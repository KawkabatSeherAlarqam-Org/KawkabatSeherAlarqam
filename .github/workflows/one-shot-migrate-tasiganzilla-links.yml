name: One-shot migrate legacy TasiGanzilla links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-migrate-tasiganzilla-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore historical dependencies and rewrite legacy repository links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          OLD = 'saloqbi/TasiGanzilla'
          NEW = 'saloqbi/KawkabatSeherAlarqam'
          roots = [Path('public'), Path('src')]
          extra = [Path('index.html')]
          text_suffixes = {'.html','.htm','.js','.jsx','.mjs','.cjs','.ts','.tsx','.css','.json','.md','.txt','.yml','.yaml'}

          github_commit = re.compile(r'https://github\.com/saloqbi/TasiGanzilla/blob/([0-9a-fA-F]{7,40})/([^\"\'<>\s)]+)')
          jsdelivr_commit = re.compile(r'https://cdn\.jsdelivr\.net/gh/saloqbi/TasiGanzilla@([0-9a-fA-F]{7,40})/([^\"\'<>\s)]+)')
          raw_commit = re.compile(r'https://raw\.githubusercontent\.com/saloqbi/TasiGanzilla/([0-9a-fA-F]{7,40})/([^\"\'<>\s)]+)')

          def candidates():
              seen = set()
              for root in roots:
                  if root.exists():
                      for p in root.rglob('*'):
                          if p.is_file() and p.suffix.lower() in text_suffixes and p not in seen:
                              seen.add(p); yield p
              for p in extra:
                  if p.exists() and p not in seen:
                      yield p

          def read_text(p):
              try:
                  return p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  return p.read_text(encoding='utf-8', errors='ignore')

          def restore(ref, rel):
              rel = rel.split('#',1)[0].split('?',1)[0]
              p = Path(rel)
              if p.exists():
                  return False
              try:
                  data = subprocess.check_output(['git','show',f'{ref}:{rel}'])
              except subprocess.CalledProcessError:
                  print(f'WARN cannot restore {ref}:{rel}')
                  return False
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print(f'RESTORED {rel} from {ref}')
              return True

          # Recursively restore any runtime dependency referenced only from historical commits.
          for _ in range(200):
              added = 0
              for p in list(candidates()):
                  text = read_text(p)
                  for rx in (github_commit, jsdelivr_commit, raw_commit):
                      for m in rx.finditer(text):
                          if restore(m.group(1), m.group(2)):
                              added += 1
              if not added:
                  break
          else:
              raise SystemExit('Dependency restoration did not converge')

          changed = 0
          for p in list(candidates()):
              old = read_text(p)
              new = github_commit.sub(lambda m: f'https://github.com/{NEW}/blob/main/{m.group(2)}', old)
              new = jsdelivr_commit.sub(lambda m: f'https://cdn.jsdelivr.net/gh/{NEW}@main/{m.group(2)}', new)
              new = raw_commit.sub(lambda m: f'https://raw.githubusercontent.com/{NEW}/main/{m.group(2)}', new)
              new = new.replace(OLD, NEW)
              if new != old:
                  p.write_text(new, encoding='utf-8')
                  changed += 1
                  print(f'PATCHED {p}')

          leftovers = []
          for p in candidates():
              if OLD in read_text(p):
                  leftovers.append(str(p))
          if leftovers:
              print('Legacy references remain:')
              print('\n'.join(leftovers[:100]))
              raise SystemExit(2)

          print(f'Patched files: {changed}')
          PY

      - name: Remove one-shot workflow and commit migration
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-migrate-tasiganzilla-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "Migrate runtime links from TasiGanzilla to KawkabatSeherAlarqam"
          git push origin HEAD:main
