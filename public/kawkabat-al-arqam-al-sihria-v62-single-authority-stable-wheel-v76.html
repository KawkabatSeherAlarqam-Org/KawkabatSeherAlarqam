function visit(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}
  }
}

function clamp(value){
  var n=Number(value);
  if(!Number.isFinite(n))n=30;
  n=Math.round(n/STEP)*STEP;
  return Math.max(MIN,Math.min(MAX,n));
}

function readState(){
  try{
    var saved=Number(localStorage.getItem(ZOOM_KEY));
    if(Number.isFinite(saved))current=clamp(saved);
    fitMode=localStorage.getItem(MODE_KEY)==='fit';
  }catch(error){}
}

function writeState(){
  try{
    localStorage.setItem(ZOOM_KEY,String(current));
    localStorage.setItem(MODE_KEY,fitMode?'fit':'manual');
  }catch(error){}
}

function findBar(){
  var found=null;
  try{visit(frame.contentDocument,function(doc){if(found)return;var bar=doc.getElementById('v62MetalBar');if(bar)found={doc:doc,bar:bar};},0);}catch(error){}
  return found;
}

function findWheel(){
  var found=null;
  try{
    visit(frame.contentDocument,function(doc){
      if(found)return;
      var wheel=doc.getElementById('wheel');
      if(wheel){
        var tag=String(wheel.tagName||'').toLowerCase();
        var node=(tag==='g'||tag==='path')?(wheel.closest('svg')||wheel):wheel;
        var rect=node.getBoundingClientRect();
        if(rect.width>100&&rect.height>100)found={doc:doc,node:node};
      }
    },0);
  }catch(error){}
  return found;
}

function findViewport(node,doc){
  var currentNode=node&&node.parentElement;
  for(var depth=0;currentNode&&depth<20;depth+=1,currentNode=currentNode.parentElement){
    var style=doc.defaultView.getComputedStyle(currentNode);
    if(/auto|scroll|overlay/.test([style.overflow,style.overflowX,style.overflowY].join(' ')))return currentNode;
    if(currentNode.dataset&&currentNode.dataset.gannzillaPageScrollbarEdgeV296==='true')return currentNode;
  }
  return node.parentElement||doc.documentElement;
}

function bindWheel(){
  var info=findWheel();
  if(!info)return false;
  if(!wheelInfo||wheelInfo.node!==info.node){
    wheelInfo=info;
    var rect=info.node.getBoundingClientRect();
    baseWidth=Math.max(1,rect.width);
    baseHeight=Math.max(1,rect.height);
    info.node.style.setProperty('zoom','1','important');
    info.node.style.setProperty('transform','none','important');
    info.node.style.setProperty('transform-origin','0 0','important');
  }
  return true;
}

function applyZoom(value,source){
  if(!bindWheel())return false;
  current=clamp(value);
  var factor=current/100;
  var node=wheelInfo.node;
  node.style.setProperty('zoom','1','important');
  node.style.setProperty('transform','none','important');
  node.style.setProperty('width',(baseWidth*factor)+'px','important');
  node.style.setProperty('height',(baseHeight*factor)+'px','important');
  node.style.setProperty('max-width','none','important');
  node.style.setProperty('max-height','none','important');
  node.dataset.v76StableZoomPercent=String(current);
  writeState();
  syncZoomControls();
  positionOverlay();
  try{wheelInfo.doc.defaultView.dispatchEvent(new CustomEvent('gannzilla:wheel-zoom-v76',{detail:{percent:current,factor:factor,source:source||'control',singleAuthority:true}}));}catch(error){}
  return true;
}

function fitPercent(){
  if(!bindWheel())return 30;
  var viewport=findViewport(wheelInfo.node,wheelInfo.doc);
  var rect=viewport.getBoundingClientRect();
  var ratio=Math.min(Math.max(80,rect.width-18)/baseWidth,Math.max(80,rect.height-18)/baseHeight);
  return clamp(ratio*100);
}

function applyFit(source){
  fitMode=true;
  return applyZoom(fitPercent(),source||'fit');
}

function panelTextScore(aside){
  if(!aside||!aside.querySelector('input,select'))return-1;
  var text=String(aside.textContent||'');
  var terms=['Default','Layout','Visible','Clockwise','Price','Highlight','Protractor','Counter','Secondary scale','الافتراضي','التخطيط','إظهار','السعر','التمييز','المنقلة','العداد'];
  var score=0;
  for(var i=0;i<terms.length;i++)if(text.indexOf(terms[i])!==-1)score++;
  return score;
}

function findPanel(){
  var best=null,bestScore=-1;
  try{visit(frame.contentDocument,function(doc){var asides=doc.querySelectorAll('aside');for(var i=0;i<asides.length;i++){var score=panelTextScore(asides[i]);if(score>bestScore){bestScore=score;best=asides[i];}}},0);}catch(error){}
  return bestScore>=3?best:null;
}

function containsWheel(node){
  return !!(node&&node.querySelector&&(node.querySelector('#wheel')||node.querySelector('canvas[data-gannzilla-unified-wheel-tools-v453="true"]')));
}

function rememberPanelNode(node){
  if(!node||originalPanelStyles.has(node))return;
  originalPanelStyles.set(node,{
    display:node.style.getPropertyValue('display'),
    visibility:node.style.getPropertyValue('visibility'),
    pointerEvents:node.style.getPropertyValue('pointer-events'),
    width:node.style.getPropertyValue('width'),
    minWidth:node.style.getPropertyValue('min-width'),
    maxWidth:node.style.getPropertyValue('max-width'),
    overflow:node.style.getPropertyValue('overflow')
  });
}

function collectPanelNodes(panel){
  var nodes=[panel];
  var currentNode=panel;
  for(var depth=0;depth<5;depth++){
    var parent=currentNode.parentElement;
    if(!parent||parent===panel.ownerDocument.body||containsWheel(parent))break;
    var rect=parent.getBoundingClientRect();
    if(rect.width>560)break;
    nodes.push(parent);
    currentNode=parent;
  }
  return nodes.filter(function(node,index,array){return node&&array.indexOf(node)===index;});
}

function restorePanelNode(node){
  var saved=originalPanelStyles.get(node);
  if(!saved)return;
  var pairs=[['display',saved.display],['visibility',saved.visibility],['pointer-events',saved.pointerEvents],['width',saved.width],['min-width',saved.minWidth],['max-width',saved.maxWidth],['overflow',saved.overflow]];
  for(var i=0;i<pairs.length;i++){
    if(pairs[i][1])node.style.setProperty(pairs[i][0],pairs[i][1],'important');else node.style.removeProperty(pairs[i][0]);
  }
}

function applyPanelState(){
  var panel=findPanel();
  if(panelVisible){
    for(var i=0;i<panelNodes.length;i++)restorePanelNode(panelNodes[i]);
    panelNodes=[];
  }else if(panel){
    panelNodes=collectPanelNodes(panel);
    for(var j=0;j<panelNodes.length;j++){
      var node=panelNodes[j];
      rememberPanelNode(node);
      node.style.setProperty('display','none','important');
      node.style.setProperty('visibility','hidden','important');
      node.style.setProperty('pointer-events','none','important');
      node.style.setProperty('width','0','important');
      node.style.setProperty('min-width','0','important');
      node.style.setProperty('max-width','0','important');
      node.style.setProperty('overflow','hidden','important');
    }
  }
  try{
    var doc=panel?panel.ownerDocument:(wheelInfo&&wheelInfo.doc);
    if(doc){
      doc.defaultView.dispatchEvent(new CustomEvent('gannzilla:layout-panel-visibility-change',{detail:{visible:panelVisible,source:'v76'}}));

      doc.defaultView.dispatchEvent(new Event('resize'));
    }
  }catch(error){}
  setTimeout(function(){if(fitMode)applyFit('panel-layout');positionOverlay();},120);

  var rect=wheelInfo.node.getBoundingClientRect();
  var dpr=Math.max(1,Math.min(2,overlayDoc.defaultView.devicePixelRatio||1));

  overlay.style.width=rect.width+'px';
  overlay.style.height=rect.height+'px';

function drawingPoint(event){
  var rect=overlay.getBoundingClientRect();
  return{x:(event.clientX-rect.left)/Math.max(1,rect.width),y:(event.clientY-rect.top)/Math.max(1,rect.height)};

function drawingSnapshot(){
  undoStack.push(JSON.stringify(drawingObjects));
  if(undoStack.length>40)undoStack.shift();
  redoStack=[];
}

function drawingUndo(){if(!undoStack.length)return;redoStack.push(JSON.stringify(drawingObjects));drawingObjects=JSON.parse(undoStack.pop());renderDrawing();syncDrawingControls();}
function drawingRedo(){if(!redoStack.length)return;undoStack.push(JSON.stringify(drawingObjects));drawingObjects=JSON.parse(redoStack.pop());renderDrawing();syncDrawingControls();}
function drawingClear(){if(!drawingObjects.length)return;drawingSnapshot();drawingObjects=[];renderDrawing();syncDrawingControls();}
function setDrawingTool(tool){drawingTool=tool;syncDrawingControls();positionOverlay();}

function bindOverlay(){
  overlay.addEventListener('pointerdown',function(event){
    if(!drawingOpen||event.button!==0)return;
    var p=drawingPoint(event);
    if(drawingTool==='text'){
      var text=prompt('اكتب النص / Enter text');
      if(text){drawingSnapshot();drawingObjects.push({type:'text',start:p,text:text});renderDrawing();syncDrawingControls();}
      return;
    }
    drawingSnapshot();
    drawingCurrent={type:drawingTool,start:p,end:p,points:(drawingTool==='pencil'||drawingTool==='erase')?[p]:null};
    drawingObjects.push(drawingCurrent);
    overlay.setPointerCapture&&overlay.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

    if(!drawingCurrent)return;
    var p=drawingPoint(event);
    drawingCurrent.end=p;
    if(drawingCurrent.points)drawingCurrent.points.push(p);
    renderDrawing();
    event.preventDefault();
  });
  function finish(){drawingCurrent=null;syncDrawingControls();}
  overlay.addEventListener('pointerup',finish);
  overlay.addEventListener('pointercancel',finish);

function renderDrawing(){
  if(!overlay)return;
  var rect=overlay.getBoundingClientRect();
  var dpr=overlay.width/Math.max(1,rect.width);
  var ctx=overlay.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,rect.width,rect.height);
  for(var i=0;i<drawingObjects.length;i++){
    var object=drawingObjects[i];
    var start={x:object.start.x*rect.width,y:object.start.y*rect.height};
    var end={x:(object.end||object.start).x*rect.width,y:(object.end||object.start).y*rect.height};
    ctx.save();
    ctx.lineWidth=object.type==='erase'?18:3;
    ctx.strokeStyle='#1479bd';
    ctx.fillStyle='#173f60';
    ctx.lineCap='round';ctx.lineJoin='round';
    if(object.type==='erase')ctx.globalCompositeOperation='destination-out';
    if(object.type==='pencil'||object.type==='erase'){
      var points=object.points||[];
      if(points.length){ctx.beginPath();ctx.moveTo(points[0].x*rect.width,points[0].y*rect.height);for(var j=1;j<points.length;j++)ctx.lineTo(points[j].x*rect.width,points[j].y*rect.height);ctx.stroke();}
    }else if(object.type==='line'){
      ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(end.x,end.y);ctx.stroke();
    }else if(object.type==='rect'){
      ctx.strokeRect(Math.min(start.x,end.x),Math.min(start.y,end.y),Math.abs(end.x-start.x),Math.abs(end.y-start.y));
    }else if(object.type==='ellipse'){
      ctx.beginPath();ctx.ellipse((start.x+end.x)/2,(start.y+end.y)/2,Math.max(.5,Math.abs(end.x-start.x)/2),Math.max(.5,Math.abs(end.y-start.y)/2),0,0,Math.PI*2);ctx.stroke();
    }else if(object.type==='text'){
      ctx.font='700 24px Tahoma,Arial';ctx.fillText(object.text,start.x,start.y);
    }
    ctx.restore();
  }
}

  var out=makeButton(doc,'v76ZoomOut','Zoom out',magnifier(false),function(){fitMode=false;applyZoom(current-STEP,'minus');});
  var select=doc.createElement('select');select.id='v76ZoomSelect';select.title='Wheel zoom';
  var fit=doc.createElement('option');fit.value='fit';fit.textContent='Fit';select.appendChild(fit);
  for(var p=MIN;p<=MAX;p+=STEP){var option=doc.createElement('option');option.value=String(p);option.textContent=p+'%';select.appendChild(option);}
  select.addEventListener('change',function(){if(select.value==='fit')applyFit('fit');else{fitMode=false;applyZoom(Number(select.value),'select');}});
  var zoomIn=makeButton(doc,'v76ZoomIn','Zoom in',magnifier(true),function(){fitMode=false;applyZoom(current+STEP,'plus');});
  zoomGroup.append(out,select,zoomIn);
  var connection=doc.getElementById('v62ConnectionBtn');
  var nodes=[pencil,eye,panel,zoomGroup];
  for(var i=0;i<nodes.length;i++){if(connection)bar.insertBefore(nodes[i],connection);else bar.appendChild(nodes[i]);}
  syncToolbarButtons(doc);
  syncZoomControls();
}

function syncToolbarButtons(doc){
  var eye=doc.getElementById('v76WheelBtn');var panel=doc.getElementById('v76PanelBtn');var pencil=doc.getElementById('v76PencilBtn');
  if(eye){eye.dataset.hidden=wheelVisible?'false':'true';eye.title=wheelVisible?'إخفاء العجلة / Hide wheel':'إظهار العجلة / Show wheel';}
  if(panel){panel.dataset.hidden=panelVisible?'false':'true';panel.title=panelVisible?'إخفاء لوحة المخطط / Hide chart panel':'إظهار لوحة المخطط / Show chart panel';}
  if(pencil)pencil.dataset.open=drawingOpen?'true':'false';
}

function syncZoomControls(){
  var info=findBar();if(!info)return;
  var select=info.doc.getElementById('v76ZoomSelect');var out=info.doc.getElementById('v76ZoomOut');var zoomIn=info.doc.getElementById('v76ZoomIn');
  if(select)select.value=fitMode?'fit':String(current);
  if(out)out.disabled=current<=MIN;
  if(zoomIn)zoomIn.disabled=current>=MAX;
}

function install(){
  var barInfo=findBar();
  if(!barInfo||!bindWheel())return false;
  buildToolbar(barInfo);
  restoreMotif();
  hideWheelScrollbars();
  ensureOverlay();
  if(fitMode)applyFit('initial-fit');else applyZoom(current,'initial');
  applyPanelState();
  applyWheelVisibility();
  try{
    barInfo.doc.defaultView.__auditKawkabatSingleAuthorityStableWheelV76=function(){
      return{
        ok:true,
        sourceVersion:'V62',
        legacyV63ZoomAbsent:true,
        singleZoomAuthority:true,
        continuousZoomTimer:false,
        continuousLayoutTimer:false,
        currentPercent:current,
        fitMode:fitMode,
        panelVisible:panelVisible,
        wheelVisible:wheelVisible,
        scrollbarsVisible:false,
        ornateMotifRestored:true,
        jitterConflictRemoved:true
      };
    };
  }catch(error){}
  return true;
}

function boot(){
  bootAttempts+=1;
  if(install())return;
  if(bootAttempts<100)setTimeout(boot,100);
}

function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){if(fitMode)applyFit('resize');positionOverlay();},260);
}

readState();
frame.addEventListener('load',function(){bootAttempts=0;setTimeout(boot,80);});
window.addEventListener('resize',onResize);
boot();
}());
</script>
</body>
