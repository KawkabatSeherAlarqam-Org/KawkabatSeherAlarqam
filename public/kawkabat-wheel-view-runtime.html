<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — View Runtime</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل العجلة الأساسية…</div>
  <script>
  (async function(){
    'use strict';
    var staticWheelApi='https://api.github.com/repos/saloqbi/KawkabatSeherAlarqam/git/blobs/b8cec022685d53af5a5d1c7ed3b5e99a2c25d47a';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(staticWheelApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('STATIC_WHEEL_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);
      var closeTag='</scr'+'ipt>';

      html=html.replace('</style>',
        '.cycle-number{font-size:24px!important;pointer-events:none!important}'+
        '.outer-text-label{font-family:Arial,Tahoma,sans-serif;text-anchor:middle;dominant-baseline:central;direction:rtl;unicode-bidi:plaintext;pointer-events:none;paint-order:stroke fill;stroke:#F7F1E3;stroke-width:1.15;stroke-opacity:.92;vector-effect:non-scaling-stroke}'+
        '.calendar-day-label{font-size:22px;font-weight:900}'+
        '.zodiac-element-label{font-size:20px;font-weight:800}'+
        'html,body{overflow:auto!important;scrollbar-width:auto!important;-ms-overflow-style:auto!important;overscroll-behavior:none!important;scroll-behavior:auto!important}'+
        'html::-webkit-scrollbar,body::-webkit-scrollbar{display:block!important;width:14px!important;height:14px!important}'+
        'html::-webkit-scrollbar-track,body::-webkit-scrollbar-track{background:#e8e3d8!important}'+
        'html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb{background:#7d898f!important;border:2px solid #e8e3d8!important;border-radius:999px!important}'+
        'html,body,svg{cursor:grab!important;touch-action:none!important}'+
        'html.wheel-pan-dragging,html.wheel-pan-dragging body,html.wheel-pan-dragging svg{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}'+
        '</style>');

      var viewScript='<script id="kawkabat-view-runtime-v1">(function(){'+
        "'use strict';"+
        'var NS="http://www.w3.org/2000/svg",CX=2200,CY=1800;'+
        'var params=new URLSearchParams(String(location.hash||"").replace(/^#/,""));'+
        'var modeKey=params.get("view")||"circle36",direction=params.get("direction")==="ccw"?"ccw":"cw",sign=direction==="ccw"?-1:1;'+
        'var modes={circle12:{label:"Circle of 12",shape:"circle",divisions:12},circle24:{label:"Circle of 24",shape:"circle",divisions:24},circle36:{label:"Circle of 36",shape:"circle",divisions:36},square4:{label:"Square of 4",shape:"polygon",sides:4,rotation:-45,divisions:4},square9:{label:"Square of 9",shape:"polygon",sides:4,rotation:-45,divisions:9},permanentSquare:{label:"Permanent square",shape:"polygon",sides:4,rotation:-45,divisions:9},tetragon:{label:"Tetragon",shape:"polygon",sides:4,rotation:-45,divisions:4}};'+
        'var meta=modes[modeKey]||modes.circle36,divisionsCount=meta.divisions,step=360/divisionsCount;'+
        'var wheel=document.getElementById("wheel"),angleFrame=document.getElementById("angleFrame"),divisionGroup=document.getElementById("divisions"),framesGroup=document.getElementById("frames"),specialFills=document.getElementById("specialFills"),specialArcs=document.getElementById("specialArcs"),ringOne=document.getElementById("numbersRingOne"),ringTwo=document.getElementById("numbersRingTwo");'+
        'if(!wheel||!angleFrame||!divisionGroup||!framesGroup||!ringOne||!ringTwo)return;'+
        'function clear(node){while(node&&node.firstChild)node.removeChild(node.firstChild);}'+
        'function polar(radius,degree){var angle=degree*Math.PI/180;return{x:CX+Math.cos(angle)*radius,y:CY+Math.sin(angle)*radius};}'+
        'function colorClass(value){var mod=((Math.round(value)%3)+3)%3;return mod===1?"number-red":mod===2?"number-blue":"number-black";}'+
        'function svgNode(name,attrs){var node=document.createElementNS(NS,name);Object.keys(attrs||{}).forEach(function(key){node.setAttribute(key,attrs[key]);});return node;}'+
        'function addLine(group,className,a,b,width){var node=svgNode("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,"class":className});if(width)node.setAttribute("stroke-width",width);group.appendChild(node);}'+
        'function addCircleFrame(radius){["frame-shadow","frame-metal","frame-highlight"].forEach(function(className,index){var r=index===2?radius-6:radius;framesGroup.appendChild(svgNode("circle",{cx:CX,cy:CY,r:r,"class":className}));});}'+
        'function polygonPoints(radius,sides,rotation){var points=[];for(var i=0;i<sides;i+=1){var degree=rotation+(360/sides)*i,point=polar(radius,degree);points.push(point);}return points;}'+
        'function polygonPath(radius,sides,rotation){var points=polygonPoints(radius,sides,rotation);return points.map(function(point,index){return(index===0?"M":"L")+point.x+" "+point.y;}).join(" ")+" Z";}'+
        'function addPolygonFrame(radius){["frame-shadow","frame-metal","frame-highlight"].forEach(function(className,index){var r=index===2?radius-6:radius;framesGroup.appendChild(svgNode("path",{d:polygonPath(r,meta.sides,meta.rotation),"class":className}));});}'+
        'function cross(ax,ay,bx,by){return ax*by-ay*bx;}'+
        'function polygonRayPoint(radius,degree){var points=polygonPoints(radius,meta.sides,meta.rotation),rad=degree*Math.PI/180,dx=Math.cos(rad),dy=Math.sin(rad),best=null;for(var i=0;i<points.length;i+=1){var a=points[i],b=points[(i+1)%points.length],sx=b.x-a.x,sy=b.y-a.y,qx=a.x-CX,qy=a.y-CY,den=cross(dx,dy,sx,sy);if(Math.abs(den)<1e-8)continue;var t=cross(qx,qy,sx,sy)/den,u=cross(qx,qy,dx,dy)/den;if(t>=0&&u>=-1e-7&&u<=1+1e-7&&(best===null||t<best))best=t;}return best===null?polar(radius,degree):{x:CX+dx*best,y:CY+dy*best};}'+
        'function geometryPoint(radius,degree){return meta.shape==="circle"?polar(radius,degree):polygonRayPoint(radius,degree);}'+
        'function addNumber(group,value,index,radius,className){var degree=sign*index*step-90,point=geometryPoint(radius,degree),cardinal=Math.abs((index*step)%90)<1e-6,text=svgNode("text",{x:point.x,y:point.y,"class":"number-text "+className+" "+colorClass(value)+(cardinal?" cardinal-number":"")});text.textContent=String(value);group.appendChild(text);return text;}'+
        'function ensureGroup(id,label){var group=document.getElementById(id);if(!group){group=svgNode("g",{id:id,"aria-label":label});wheel.insertBefore(group,angleFrame);}clear(group);return group;}'+
        'function sectorPath(innerRadius,outerRadius,startDegree,endDegree){var os=polar(outerRadius,startDegree),oe=polar(outerRadius,endDegree),ie=polar(innerRadius,endDegree),is=polar(innerRadius,startDegree);return["M",os.x,os.y,"A",outerRadius,outerRadius,0,0,1,oe.x,oe.y,"L",ie.x,ie.y,"A",innerRadius,innerRadius,0,0,0,is.x,is.y,"Z"].join(" ");}'+
        'clear(divisionGroup);clear(framesGroup);clear(specialFills);clear(specialArcs);clear(ringOne);clear(ringTwo);'+
        'for(var oldCycle=1;oldCycle<=10;oldCycle+=1){var old=document.getElementById("numbersCycle"+oldCycle);if(old)old.remove();}var oldDays=document.getElementById("calendarDaysRing"),oldZodiac=document.getElementById("zodiacElementsRing");if(oldDays)oldDays.remove();if(oldZodiac)oldZodiac.remove();'+
        'var radii=[];for(var rIndex=0;rIndex<=13;rIndex+=1)radii.push(180+rIndex*110);'+
        'radii.forEach(function(radius){if(meta.shape==="circle")addCircleFrame(radius);else addPolygonFrame(radius);});'+
        'if(meta.shape==="circle"&&divisionsCount%4===0){for(var cardinalIndex=0;cardinalIndex<4;cardinalIndex+=1){var center=cardinalIndex*90-90,start=center-step/2,end=center+step/2;specialFills.appendChild(svgNode("path",{d:sectorPath(180,1610,start,end),"class":"special-fill"}));}}'+
        'for(var rayIndex=0;rayIndex<divisionsCount;rayIndex+=1){var boundaryDegree=sign*(rayIndex*step-step/2)-90,innerPoint=geometryPoint(180,boundaryDegree),outerPoint=geometryPoint(1610,boundaryDegree),ray=svgNode("g",{"data-ray-index":rayIndex});addLine(ray,"ray-shadow",innerPoint,outerPoint);addLine(ray,"ray-metal",innerPoint,outerPoint);addLine(ray,"ray-highlight",innerPoint,outerPoint);divisionGroup.appendChild(ray);}'+
        'for(var innerIndex=0;innerIndex<divisionsCount;innerIndex+=1){var fullValue=innerIndex===0?divisionsCount:innerIndex,rootValue=((fullValue-1)%9)+1;addNumber(ringOne,fullValue,innerIndex,235,"ring-one-number");addNumber(ringTwo,rootValue,innerIndex,345,"ring-two-number");}'+
        'var cycleGroups=[];for(var cycle=1;cycle<=10;cycle+=1){var start=((cycle-1)*divisionsCount)+1,end=cycle*divisionsCount,radius=455+((cycle-1)*110),group=ensureGroup("numbersCycle"+cycle,"الدورة "+cycle+" من "+start+" إلى "+end);for(var numberIndex=0;numberIndex<divisionsCount;numberIndex+=1){var value=numberIndex===0?end:start+numberIndex-1,node=addNumber(group,value,numberIndex,radius,"cycle-number");node.setAttribute("data-cycle",cycle);node.setAttribute("data-value",value);}cycleGroups.push(group);}'+
        'var dayNames=["الجمعة","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"],zodiacElements=["ماء الحوت","نار الحمل","تراب الثور","هواء الجوزاء","ماء السرطان","نار الأسد","تراب السنبلة","هواء الميزان","ماء العقرب","نار القوس","تراب الجدي","هواء الدلو"],daysRing=ensureGroup("calendarDaysRing","الأيام"),zodiacRing=ensureGroup("zodiacElementsRing","الأبراج والعناصر");'+
        'function addOuter(group,textValue,cellValue,index,radius,className){var visualDegree=sign*index*step,point=geometryPoint(radius,visualDegree-90),normalized=((visualDegree%360)+360)%360,rotation=normalized;if(normalized>90&&normalized<270)rotation+=180;var text=svgNode("text",{x:point.x,y:point.y,"class":"outer-text-label "+className+" "+colorClass(cellValue),transform:"rotate("+rotation+" "+point.x+" "+point.y+")",lang:"ar","data-cell":cellValue});text.textContent=textValue;group.appendChild(text);}'+
        'for(var outerIndex=0;outerIndex<divisionsCount;outerIndex+=1){var cellValue=outerIndex===0?divisionsCount:outerIndex;addOuter(daysRing,dayNames[cellValue%6],cellValue,outerIndex,1580,"calendar-day-label");addOuter(zodiacRing,zodiacElements[cellValue%12],cellValue,outerIndex,1538,"zodiac-element-label");}'+
        'document.documentElement.dataset.viewMode=modeKey;document.documentElement.dataset.clockwise=direction==="cw"?"true":"false";'+
        'window.__auditKawkabatViewRuntimeV1=function(){return{ok:true,mode:modeKey,label:meta.label,shape:meta.shape,divisions:divisionsCount,direction:direction,cycleCount:cycleGroups.length,lastValue:divisionsCount*10,dayCount:daysRing.children.length,zodiacCount:zodiacRing.children.length};};'+
      '}());'+closeTag;

      var panControls='<script id="wheel-pan-controls-v1">(function(){'+
        "'use strict';"+
        'var dragging=false,moved=false,startX=0,startY=0,startScrollX=0,startScrollY=0,suppressClickUntil=0;'+
        'function editable(target){return !!(target&&((target.tagName&&/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(target.tagName))||target.isContentEditable));}'+
        'function scroller(){return document.scrollingElement||document.documentElement;}'+
        'function begin(x,y,target){if(editable(target))return;var root=scroller();dragging=true;moved=false;startX=x;startY=y;startScrollX=root.scrollLeft;startScrollY=root.scrollTop;}'+
        'function drag(x,y,event){if(!dragging)return;var dx=x-startX,dy=y-startY;if(!moved&&Math.hypot(dx,dy)>=3)moved=true;if(!moved)return;event.preventDefault();document.documentElement.classList.add("wheel-pan-dragging");var root=scroller();root.scrollLeft=startScrollX-dx;root.scrollTop=startScrollY-dy;}'+
        'function finish(){if(!dragging)return;dragging=false;document.documentElement.classList.remove("wheel-pan-dragging");if(moved)suppressClickUntil=Date.now()+240;}'+
        'document.addEventListener("mousedown",function(event){if(event.button===0)begin(event.clientX,event.clientY,event.target);},true);'+
        'window.addEventListener("mousemove",function(event){if(dragging)drag(event.clientX,event.clientY,event);},{capture:true,passive:false});'+
        'window.addEventListener("mouseup",finish,true);window.addEventListener("blur",finish);'+
        'document.addEventListener("click",function(event){if(Date.now()<suppressClickUntil){event.preventDefault();event.stopImmediatePropagation();}},true);'+
        'document.addEventListener("wheel",function(event){if(event.ctrlKey)return;event.preventDefault();var root=scroller();if(event.shiftKey)root.scrollLeft+=event.deltaY;else root.scrollTop+=event.deltaY;},{capture:true,passive:false});'+
      '}());'+closeTag;

      html=html.replace('</body>',viewScript+panControls+'</body>');
      document.open();document.write(html);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل العجلة: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
