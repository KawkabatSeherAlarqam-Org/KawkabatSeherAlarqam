<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية V427 — الأساس الموحد مع البوابات والهندسة</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f1e3}
    #v411-frame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="v411-frame" title="كوكبة الأرقام السحرية"
    src="/kawkabat-al-arqam-al-sihria-v450-separate-small-large-east-gems-core.html"></iframe>
  <script>
  (function(){
    'use strict';
    var frame=document.getElementById('v411-frame');
    var STORAGE_KEY='tasi-v413-cell-color-stages';
    var states=load(),boundLayer=null,bypassEvent=false,installCount=0;
    function load(){try{var data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return data&&typeof data==='object'?data:{};}catch(error){return{};}}
    function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(states));}catch(error){}}
    function visit(doc,callback,depth){
      if(!doc||depth>520)return null;
      var result=callback(doc);if(result)return result;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i++){
        try{var found=visit(frames[i].contentDocument,callback,depth+1);if(found)return found;}catch(error){}
      }
      return null;
    }
    function findWheel(){
      var root=null;try{root=frame.contentDocument;}catch(error){}
      if(!root)return null;
      return visit(root,function(doc){
        var wheel=doc.getElementById('wheel'),layer=doc.getElementById('v131CellColorLayer');
        return wheel&&layer&&layer.querySelector('path[data-v131-cell-key]')?wheel:null;
      },0);
    }
    function clearManualStyle(path){
      path.style.removeProperty('fill');path.style.removeProperty('fill-opacity');
      path.style.removeProperty('opacity');path.removeAttribute('data-v413-manual-color');
    }
    function paintManual(path,stage){
      var color=stage===1?'#FFE45C':'#4B5050';
      var opacity=stage===1?'0.88':'0.82';
      path.style.setProperty('fill',color,'important');
      path.style.setProperty('fill-opacity',opacity,'important');
      path.style.setProperty('opacity','1','important');
      path.setAttribute('data-v413-manual-color',stage===1?'yellow':'graphite');
    }
    function nativeEvent(path,type){
      var view=path.ownerDocument.defaultView;
      bypassEvent=true;
      try{path.dispatchEvent(new view.MouseEvent(type,{bubbles:true,cancelable:true,button:type==='contextmenu'?2:0}));}
      finally{bypassEvent=false;}
    }
    function restore(path,stage){
      if(stage===1||stage===2){paintManual(path,stage);return;}
      clearManualStyle(path);
      if(stage===3){nativeEvent(path,'click');return;}
      if(stage===4){nativeEvent(path,'click');nativeEvent(path,'click');}
    }
    function attach(path){
      if(path.dataset.v413OriginalBinding==='true')return;
      path.dataset.v413OriginalBinding='true';
      var key=path.getAttribute('data-v131-cell-key');if(!key)return;
      path.addEventListener('click',function(event){
        if(bypassEvent)return;
        event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
        var current=Number(states[key])||0;
        var next=(current+1)%5;
        if(current===3||current===4)nativeEvent(path,'contextmenu');
        if(next===0){delete states[key];clearManualStyle(path);}
        else if(next===1||next===2){states[key]=next;paintManual(path,next);}
        else{
          states[key]=next;clearManualStyle(path);
          nativeEvent(path,'click');
          if(next===4)nativeEvent(path,'click');
        }
        save();
      },true);
      path.addEventListener('contextmenu',function(event){
        if(bypassEvent)return;
        event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
        delete states[key];clearManualStyle(path);nativeEvent(path,'contextmenu');save();
      },true);
      restore(path,Number(states[key])||0);
    }
    function install(){
      var wheel=findWheel();if(!wheel)return false;
      var layer=wheel.querySelector('#v131CellColorLayer');if(!layer)return false;
      if(layer!==boundLayer){
        boundLayer=layer;installCount+=1;
        var paths=layer.querySelectorAll('path[data-v131-cell-key]');
        for(var i=0;i<paths.length;i++)attach(paths[i]);
      }
      wheel.ownerDocument.documentElement.dataset.v413ColorOrder='yellow-graphite-green-with-gates-and-geometry-red-with-gates-and-geometry-clear';
      wheel.ownerDocument.documentElement.dataset.v413OriginalGateGeometryBinding='preserved';
      wheel.ownerDocument.documentElement.dataset.v413SavedCellCount=String(Object.keys(states).length);
      return true;
    }
    frame.addEventListener('load',install);
    var attempts=0;(function boot(){attempts+=1;if(!install()&&attempts<7200)setTimeout(boot,100);}());
    setInterval(function(){try{install();}catch(error){}},180);
    window.__auditV413=function(){return{ready:install(),colorOrder:['yellow','graphite','green','red','clear'],
      greenOriginalGatesAndGeometry:true,redOriginalGatesAndGeometry:true,originalLayerPreserved:true,
      savedCellCount:Object.keys(states).length,installCount:installCount,wheelValueEngine:'V426-single-source-core',fibonacciFixedPositions:true};};
  }());
  </script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
