<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Panel Arabic V51</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="https://htmlpreview.github.io/?https://github.com/saloqbi/KawkabatSeherAlarqam/blob/main/public/kawkabat-al-arqam-al-sihria-v47-live-language-v50.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var poll=null;
var observer=null;
var currentLanguage='en';
var PANEL_ID='gannzilla-pixel-perfect-reference-panel-v421';
var originalText=new WeakMap();
var originalTitle=new WeakMap();
var AR={
'Default':'الافتراضي','Layout':'التخطيط','Visible':'إظهار','Clockwise':'مع عقارب الساعة','Size':'عدد الحلقات','View':'العرض','Data type':'نوع البيانات','Price':'السعر','Value':'القيمة','Find':'بحث','Increment':'الزيادة','Highlight':'التمييز','Fill':'التعبئة','Levels':'المستويات','Show marks':'إظهار العلامات','Show numbers':'إظهار الأرقام','Protractor':'المنقلة','Angle':'الزاوية','Counter':'العداد','Secondary scale':'المقياس الثانوي','Start':'البداية','Step':'الخطوة','Radius':'نصف القطر','Font size':'حجم الخط','Divisions':'الأقسام','Marker':'المؤشر','Shape':'الشكل','Color':'اللون','Line width':'عرض الخط','Label':'التسمية','Chronometer':'مقياس الزمن','Range':'المدى','Annual':'سنوي','Monthly':'شهري','Weekly':'أسبوعي','Daily':'يومي','Cosmogram':'الخريطة الفلكية','System':'النظام','Geocentric':'مركزي أرضي','Heliocentric':'مركزي شمسي','Location':'الموقع','City':'المدينة','Latitude':'خط العرض','Longitude':'خط الطول','Moon phases':'أطوار القمر','Show eclipses':'إظهار الكسوف والخسوف','Hide':'إخفاء','Show':'إظهار','Cell':'الخلية','None':'لا شيء','Time':'الوقت','Date':'التاريخ','Today':'اليوم','Background':'الخلفية','Grid':'الشبكة','Colors':'الألوان','Line':'خط','Dash':'متقطع','Bold line':'خط عريض','Bold dash':'متقطع عريض'
};
function locate(doc,depth,test){if(!doc||depth>180)return null;if(test(doc))return doc;var fs=doc.querySelectorAll('iframe');for(var i=0;i<fs.length;i++){try{var found=locate(fs[i].contentDocument,depth+1,test);if(found)return found;}catch(e){}}return null;}
function panelDoc(){return locate(frame.contentDocument,0,function(d){return !!d.getElementById(PANEL_ID);});}
function toolbarDoc(){return locate(frame.contentDocument,0,function(d){return !!d.getElementById('v47Language');});}
function digits(v){var map={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};return String(v||'').replace(/[0-9]/g,function(d){return map[d];});}
function translate(value){var raw=String(value||'');var trimmed=raw.trim();if(!trimmed)return raw;var out=AR[trimmed]||trimmed;out=out.replace(/^Circle of\s+(\d+)$/i,function(_,n){return 'دائرة من '+digits(n)+' قسمًا';});var lead=(raw.match(/^\s*/)||[''])[0];var tail=(raw.match(/\s*$/)||[''])[0];return lead+out+tail;}
function ensureStyle(doc){if(doc.getElementById('v51PanelArabicStyle'))return;var s=doc.createElement('style');s.id='v51PanelArabicStyle';s.textContent='#'+PANEL_ID+'[data-v51-language="ar"]{direction:rtl!important}#'+PANEL_ID+'[data-v51-language="ar"] .gz421-scroll,#'+PANEL_ID+'[data-v51-language="ar"] .gz421-section,#'+PANEL_ID+'[data-v51-language="ar"] .gz421-section-body,#'+PANEL_ID+'[data-v51-language="ar"] .gz421-row,#'+PANEL_ID+'[data-v51-language="ar"] table{direction:rtl!important;text-align:right!important}#'+PANEL_ID+'[data-v51-language="ar"] .gz421-section-title,#'+PANEL_ID+'[data-v51-language="ar"] .gz421-label,#'+PANEL_ID+'[data-v51-language="ar"] th,#'+PANEL_ID+'[data-v51-language="ar"] td{direction:rtl!important;text-align:right!important}#'+PANEL_ID+'[data-v51-language="ar"] input,#'+PANEL_ID+'[data-v51-language="ar"] select{font-family:Tahoma,Arial,sans-serif!important}';doc.head.appendChild(s);}
function applyPanel(){var doc=panelDoc();if(!doc)return false;var panel=doc.getElementById(PANEL_ID);if(!panel)return false;ensureStyle(doc);panel.setAttribute('data-v51-language',currentLanguage);panel.setAttribute('lang',currentLanguage);panel.setAttribute('dir',currentLanguage==='ar'?'rtl':'ltr');var walker=doc.createTreeWalker(panel,NodeFilter.SHOW_TEXT);var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);var changed=0;for(var i=0;i<nodes.length;i++){var node=nodes[i];var parent=node.parentElement;if(!parent||/^(SCRIPT|STYLE|TEXTAREA)$/i.test(parent.tagName))continue;if(!originalText.has(node))originalText.set(node,node.nodeValue);var base=originalText.get(node);var next=currentLanguage==='ar'?translate(base):base;if(node.nodeValue!==next){node.nodeValue=next;changed++;}}
var titled=panel.querySelectorAll('[title]');for(var j=0;j<titled.length;j++){var el=titled[j];if(!originalTitle.has(el))originalTitle.set(el,el.getAttribute('title'));var tbase=originalTitle.get(el);var tnext=currentLanguage==='ar'?translate(tbase):tbase;if(el.getAttribute('title')!==tnext)el.setAttribute('title',tnext);}
var inputs=panel.querySelectorAll('input,select,textarea');for(var k=0;k<inputs.length;k++){inputs[k].dir=currentLanguage==='ar'?'rtl':'ltr';}
if(!observer){observer=new MutationObserver(function(){setTimeout(applyPanel,0);});observer.observe(panel,{childList:true,subtree:true,characterData:true});}
try{doc.defaultView.__auditKawkabatPanelArabicV51=function(){return{ok:true,currentLanguage:currentLanguage,panelFound:true,panelId:PANEL_ID,translatedNodeCount:changed,mutationObserverActive:!!observer,wheelGeometryChanged:false,ornateFrameChanged:false};};}catch(e){}
return true;}
function setLanguage(lang){currentLanguage=lang==='ar'?'ar':'en';return applyPanel();}
function bind(){var td=toolbarDoc();var pd=panelDoc();if(!td||!pd)return false;var select=td.getElementById('v47Language');if(!select)return false;if(select.dataset.v51Bound!=='true'){select.dataset.v51Bound='true';select.addEventListener('change',function(e){setLanguage(e.target.value);});}var stored=select.value||'en';try{stored=pd.defaultView.localStorage.getItem('tasi-gannzilla-language-v1')||stored;}catch(e){}return setLanguage(stored);}
function start(){if(poll)clearInterval(poll);var n=0;poll=setInterval(function(){n++;if(bind()||n>=2600){clearInterval(poll);poll=null;}},100);}
frame.addEventListener('load',start);start();
}());
</script>
</body>
</html>
