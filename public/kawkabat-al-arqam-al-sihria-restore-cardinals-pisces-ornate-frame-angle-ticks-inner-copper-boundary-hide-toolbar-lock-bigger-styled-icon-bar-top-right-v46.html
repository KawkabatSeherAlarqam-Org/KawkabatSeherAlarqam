function locateToolbarDocument(doc,depth){

    if(!dock||!bar)return false;
    if(!doc.getElementById('v46ToolbarTopRightOverrides')){
      var style=doc.createElement('style');
      style.id='v46ToolbarTopRightOverrides';
      style.textContent=''

    };}
