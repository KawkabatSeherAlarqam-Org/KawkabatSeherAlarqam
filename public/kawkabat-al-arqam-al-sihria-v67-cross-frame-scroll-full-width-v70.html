<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Cross-Frame Scroll Full Width V70</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="https://htmlpreview.github.io/?https://github.com/saloqbi/KawkabatSeherAlarqam/blob/main/public/kawkabat-al-arqam-al-sihria-v66-panel-toggle-cached-responsive-v67.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var timer=null;
var saved=new WeakMap();
var altered=[];
var cachedInfo=null;

var PROPS=[
  'position','top','bottom','left','right','inset','inset-inline-start','inset-inline-end',
  'width','min-width','max-width','height','min-height','max-height',
  'margin','margin-left','margin-right','padding-left','padding-right',
  'transform','translate','filter','perspective','contain',
  'overflow','overflow-x','overflow-y','box-sizing','z-index','display'
];

function visit(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}
  }
}

function panelButton(){
  var found=null;
  try{
    visit(frame.contentDocument,function(doc){
      if(found)return;
      found=doc.getElementById('v66PanelBtn')||doc.getElementById('v65PanelToggleBtn');
    },0);
  }catch(error){}
  return found;
}

function panelHidden(){
  var button=panelButton();
  if(button&&button.dataset.hidden==='true')return true;
  var visible=false;
  try{
    visit(frame.contentDocument,function(doc){
      if(visible)return;
      var asides=doc.querySelectorAll('aside');
      for(var i=0;i<asides.length;i+=1){
        var aside=asides[i];
        if(!aside.querySelector('input,select'))continue;
        var text=String(aside.textContent||'');
        if(!/Default|Layout|Visible|الافتراضي|التخطيط|إظهار/.test(text))continue;
        var style=doc.defaultView.getComputedStyle(aside);
        var rect=aside.getBoundingClientRect();
        if(style.display!=='none'&&style.visibility!=='hidden'&&rect.width>4){visible=true;return;}
      }
    },0);
  }catch(error){}
  return !visible;
}

function findWheelTarget(doc){
  var wheel=doc.getElementById('wheel');
  if(wheel){
    var tag=String(wheel.tagName||'').toLowerCase();
    return (tag==='g'||tag==='path')?(wheel.closest('svg')||wheel):wheel;
  }
  var best=null,bestArea=0;
  var canvases=doc.querySelectorAll('canvas');
  for(var i=0;i<canvases.length;i+=1){
    var canvas=canvases[i];
    if(canvas.closest&&canvas.closest('aside'))continue;
    if(/DrawingOverlay/i.test(canvas.id||''))continue;
    var rect=canvas.getBoundingClientRect();
    var area=rect.width*rect.height;
    if(canvas.width>300&&canvas.height>300&&rect.width>240&&rect.height>240&&area>bestArea){
      best=canvas;bestArea=area;
    }
  }
  return best;
}

function scrollScore(node,target,doc){
  if(!(node instanceof doc.defaultView.HTMLElement))return -1;
  var rect=node.getBoundingClientRect();
  if(rect.width<220||rect.height<220)return -1;
  var style=doc.defaultView.getComputedStyle(node);
  var overflow=[style.overflow,style.overflowX,style.overflowY].join(' ');
  var score=0;
  if(node.contains(target))score+=500;
  if(/auto|scroll/.test(overflow))score+=500;
  if(node.scrollWidth>node.clientWidth+3)score+=250;
  if(node.scrollHeight>node.clientHeight+3)score+=180;
  if(rect.left>10)score+=Math.min(220,rect.left);
  if(rect.right>=doc.documentElement.clientWidth-3)score+=30;
  return score;
}

function findWheelInfo(){
  var best=null,bestScore=-1;
  try{
    visit(frame.contentDocument,function(doc){
      var target=findWheelTarget(doc);
      if(!target)return;
      var node=target;
      for(var depth=0;node&&depth<20;depth+=1,node=node.parentElement){
        var score=scrollScore(node,target,doc);
        if(score>bestScore){bestScore=score;best={doc:doc,target:target,owner:node,score:score};}
      }
    },0);
  }catch(error){}
  return best;
}

function remember(node){
  if(!node||saved.has(node))return;
  var record={};
  for(var i=0;i<PROPS.length;i++)record[PROPS[i]]=node.style.getPropertyValue(PROPS[i]);
  saved.set(node,record);
}

function restoreNode(node){
  var record=saved.get(node);
  if(!record)return;
  for(var i=0;i<PROPS.length;i++){
    var name=PROPS[i],value=record[name];
    if(value)node.style.setProperty(name,value,'important');
    else node.style.removeProperty(name);
  }
  node.removeAttribute('data-v70-full-width');
}

function mark(node){
  if(!node)return;
  remember(node);
  if(altered.indexOf(node)===-1)altered.push(node);
}

function openAncestors(node,stop){
  var current=node&&node.parentElement;
  for(var depth=0;current&&current!==stop&&depth<14;depth+=1,current=current.parentElement){
    mark(current);
    current.style.setProperty('width','100%','important');
    current.style.setProperty('min-width','0','important');
    current.style.setProperty('max-width','none','important');
    current.style.setProperty('margin-left','0','important');
    current.style.setProperty('margin-right','0','important');
    current.style.setProperty('padding-left','0','important');
    current.style.setProperty('padding-right','0','important');
    current.style.setProperty('transform','none','important');
    current.style.setProperty('translate','none','important');
    current.style.setProperty('filter','none','important');
    current.style.setProperty('perspective','none','important');
    current.style.setProperty('contain','none','important');
  }
}

function forceBoxFullWidth(node,view,preserveVertical,zIndex){
  if(!node||!view)return;
  var rect=node.getBoundingClientRect();
  var top=Math.max(0,Math.round(rect.top));
  var bottom=Math.max(0,Math.round(view.innerHeight-rect.bottom));
  mark(node);
  openAncestors(node,node.ownerDocument.body);
  node.style.setProperty('position','fixed','important');
  node.style.setProperty('top',preserveVertical?top+'px':'0','important');
  node.style.setProperty('bottom',preserveVertical?bottom+'px':'0','important');
  node.style.setProperty('left','0','important');
  node.style.setProperty('right','0','important');
  node.style.setProperty('inset-inline-start','0','important');
  node.style.setProperty('inset-inline-end','0','important');
  node.style.setProperty('width','auto','important');
  node.style.setProperty('min-width','0','important');
  node.style.setProperty('max-width','none','important');
  node.style.setProperty('height','auto','important');
  node.style.setProperty('max-height','none','important');
  node.style.setProperty('margin','0','important');
  node.style.setProperty('margin-left','0','important');
  node.style.setProperty('margin-right','0','important');
  node.style.setProperty('transform','none','important');
  node.style.setProperty('translate','none','important');
  node.style.setProperty('box-sizing','border-box','important');
  node.style.setProperty('z-index',String(zIndex),'important');
  node.dataset.v70FullWidth='true';
}

function frameChain(doc){
  var chain=[];
  var view=doc&&doc.defaultView;
  for(var depth=0;view&&depth<40;depth+=1){
    var element=null;
    try{element=view.frameElement;}catch(error){break;}
    if(!element)break;
    chain.push({element:element,parentView:element.ownerDocument.defaultView});
    try{view=view.parent;}catch(error){break;}
  }
  return chain;
}

function forceFullWidth(info){
  if(!info||!info.owner)return false;
  cachedInfo=info;

  /* Deepest scroll owner: fills its own document viewport. */
  forceBoxFullWidth(info.owner,info.doc.defaultView,true,1);
  info.owner.style.setProperty('overflow','auto','important');
  info.owner.style.setProperty('overflow-x','auto','important');
  info.owner.style.setProperty('overflow-y','auto','important');

  /* Critical fix: expand every iframe that carries the wheel document. */
  var chain=frameChain(info.doc);
  for(var i=0;i<chain.length;i++){
    var item=chain[i];
    var rect=item.element.getBoundingClientRect();
    var rightGap=item.parentView.innerWidth-rect.right;
    if(rect.left>2||rightGap>2){
      forceBoxFullWidth(item.element,item.parentView,true,0);
      item.element.style.setProperty('border','0','important');
    }
  }

  /* Remove panel-width translations from the wheel itself and nearby wrappers. */
  var target=info.target;
  var node=target;
  for(var depth=0;node&&depth<8;depth+=1,node=node.parentElement){
    mark(node);
    node.style.setProperty('margin-left','0','important');
    node.style.setProperty('margin-right','0','important');
    node.style.setProperty('transform','none','important');
    node.style.setProperty('translate','none','important');
    node.style.setProperty('max-width','none','important');
  }

  try{
    info.doc.defaultView.dispatchEvent(new Event('resize'));
    info.doc.defaultView.dispatchEvent(new CustomEvent('gannzilla:page-scrollbar-edge-sync',{detail:{panelVisible:false,source:'v70-cross-frame'}}));
  }catch(error){}
  return true;
}

function restoreAll(){
  for(var i=altered.length-1;i>=0;i--)restoreNode(altered[i]);
  altered=[];
  if(cachedInfo){
    try{
      cachedInfo.doc.defaultView.dispatchEvent(new Event('resize'));
      cachedInfo.doc.defaultView.dispatchEvent(new CustomEvent('gannzilla:page-scrollbar-edge-sync',{detail:{panelVisible:true,source:'v70-restore'}}));
    }catch(error){}
  }
}

function bindButton(){
  var button=panelButton();
  if(!button||button.dataset.v70Bound==='true')return;
  button.dataset.v70Bound='true';
  button.addEventListener('click',function(){
    setTimeout(sync,0);
    setTimeout(sync,40);
    setTimeout(sync,140);
    setTimeout(sync,400);
  },true);
}

function audit(info,hidden){
  if(!info)return;
  try{
    info.doc.defaultView.__auditKawkabatCrossFrameFullWidthV70=function(){
      var ownerRect=info.owner.getBoundingClientRect();
      var chain=frameChain(info.doc).map(function(item){
        var rect=item.element.getBoundingClientRect();
        return {left:Math.round(rect.left),rightGap:Math.round(item.parentView.innerWidth-rect.right),tag:item.element.tagName};
      });
      return{
        ok:true,
        sourceVersion:'V67',
        panelHidden:hidden,
        ownerLeftPx:Math.round(ownerRect.left),
        ownerRightGapPx:Math.round(info.doc.defaultView.innerWidth-ownerRect.right),
        crossFrameChain:chain,
        alteredNodeCount:altered.length,
        fullWidthApplied:hidden,
        scrollbarKept:true,
        wheelGeometryChanged:false,
        ornateFrameChanged:false
      };
    };
  }catch(error){}
}

function sync(){
  bindButton();
  var hidden=panelHidden();
  var info=findWheelInfo()||cachedInfo;
  if(!info)return false;
  if(hidden)forceFullWidth(info);
  else if(altered.length)restoreAll();
  audit(info,hidden);
  return true;
}

function start(){
  if(timer)clearInterval(timer);
  timer=setInterval(sync,60);
  sync();
}

frame.addEventListener('load',start);
start();
}());
</script>
</body>
</html>
