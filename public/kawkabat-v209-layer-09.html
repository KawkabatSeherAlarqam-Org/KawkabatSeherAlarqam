<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Metal Toolbar Zoom 50–400 V63</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="/kawkabat-v209-layer-10.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var MIN=50,MAX=400,STEP=5,STORAGE='tasi-gannzilla-wheel-zoom-v63';
var current=100,timer=null,currentTarget=null;
var bases=new WeakMap();

function visit(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}}
}

function clamp(value){
  var n=Number(value);
  if(!Number.isFinite(n))n=100;
  n=Math.round(n/STEP)*STEP;
  return Math.max(MIN,Math.min(MAX,n));
}

function readStored(){
  var result=null;
  try{visit(frame.contentDocument,function(doc){if(result!==null)return;try{var v=Number(doc.defaultView.localStorage.getItem(STORAGE));if(Number.isFinite(v))result=clamp(v);}catch(error){}},0);}catch(error){}
  return result===null?100:result;
}

function writeStored(value){
  try{visit(frame.contentDocument,function(doc){try{doc.defaultView.localStorage.setItem(STORAGE,String(value));}catch(error){}},0);}catch(error){}
}

function findBar(){
  var found=null;
  try{visit(frame.contentDocument,function(doc){if(found)return;var bar=doc.getElementById('v62MetalBar');if(bar)found={doc:doc,bar:bar};},0);}catch(error){}
  return found;
}

function findWheelTarget(){
  var best=null;
  try{
    visit(frame.contentDocument,function(doc){
      if(best)return;
      var wheel=doc.getElementById('wheel');
      if(wheel){
        var tag=String(wheel.tagName||'').toLowerCase();
        var target=(tag==='g'||tag==='path')?(wheel.closest('svg')||wheel):wheel;
        var rect=target.getBoundingClientRect();
        if(rect.width>100&&rect.height>100)best={doc:doc,target:target};
      }
    },0);
    if(best)return best;
    visit(frame.contentDocument,function(doc){
      var canvases=doc.querySelectorAll('canvas');
      for(var i=0;i<canvases.length;i+=1){
        if(canvases[i].closest&&canvases[i].closest('aside'))continue;
        var rect=canvases[i].getBoundingClientRect();
        var area=rect.width*rect.height;
        if(rect.width>250&&rect.height>250&&(!best||area>best.area))best={doc:doc,target:canvases[i],area:area};
      }
    },0);
  }catch(error){}
  return best;
}

function ensureStyle(doc){
  if(doc.getElementById('v63ZoomStyles'))return;
  var style=doc.createElement('style');
  style.id='v63ZoomStyles';
  style.textContent=''
    +'#v63ZoomGroup{display:inline-flex;align-items:stretch;height:30px;direction:ltr;}'
    +'#v63ZoomOut,#v63ZoomIn{width:32px;min-width:32px;height:30px;margin:0;padding:4px;border:1px solid #95a2ac;background:linear-gradient(180deg,#fff 0%,#edf3f7 46%,#d5dfe7 52%,#fbfcfd 100%);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.97)}'
    +'#v63ZoomOut{border-radius:3px 0 0 3px;border-right:0}'
    +'#v63ZoomIn{border-radius:0 3px 3px 0;border-left:0}'
    +'#v63ZoomOut:hover,#v63ZoomIn:hover{background:linear-gradient(180deg,#fff8ea 0%,#f3e5c3 46%,#e2c382 52%,#fff5e5 100%);border-color:#b88a4a}'
    +'#v63ZoomOut:disabled,#v63ZoomIn:disabled{opacity:.42;cursor:default}'
    +'#v63ZoomOut svg,#v63ZoomIn svg{width:19px;height:19px;display:block;pointer-events:none}'
    +'#v63ZoomSelect{width:58px;min-width:58px;height:30px;margin:0;padding:0 3px;border:1px solid #95a2ac;border-radius:0;background:linear-gradient(180deg,#fff 0%,#edf3f7 46%,#d5dfe7 52%,#fbfcfd 100%);color:#202b34;font:700 13px Arial,Tahoma,sans-serif;text-align:center;text-align-last:center;cursor:pointer;appearance:none;-webkit-appearance:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.97)}'
    +'#v63ZoomSelect:focus{outline:2px solid #2a8ad4;outline-offset:-2px}';
  doc.head.appendChild(style);
}

function magnifier(plus){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.2" cy="9.2" r="5.7" fill="#fbfdff" stroke="#3579ad" stroke-width="1.45"/><path d="M13.4 13.4 20 20" fill="none" stroke="#3579ad" stroke-width="2" stroke-linecap="round"/><path d="M6.3 9.2h5.8" fill="none" stroke="#2469a2" stroke-width="1.55"/>'+(plus?'<path d="M9.2 6.3v5.8" fill="none" stroke="#2469a2" stroke-width="1.55"/>':'')+'</svg>';
}

function populate(select){
  select.replaceChildren();
  for(var p=MIN;p<=MAX;p+=STEP){var option=select.ownerDocument.createElement('option');option.value=String(p);option.textContent=p+'%';select.appendChild(option);}
  select.value=String(current);
}

function syncControls(doc){
  var select=doc.getElementById('v63ZoomSelect');
  var out=doc.getElementById('v63ZoomOut');
  var zoomIn=doc.getElementById('v63ZoomIn');
  if(select)select.value=String(current);
  if(out)out.disabled=current<=MIN;
  if(zoomIn)zoomIn.disabled=current>=MAX;
}

function applyZoom(value,source){
  current=clamp(value);
  writeStored(current);
  var barInfo=findBar();
  if(barInfo)syncControls(barInfo.doc);
  var info=findWheelTarget();
  if(!info||!info.target)return false;
  var target=info.target;
  currentTarget=target;
  var ratio=current/100;
  var base=bases.get(target);
  if(!base){
    var rect=target.getBoundingClientRect();
    base={width:Math.max(1,rect.width/ratio),height:Math.max(1,rect.height/ratio)};
    bases.set(target,base);
  }
  target.style.setProperty('width',(base.width*ratio)+'px','important');
  target.style.setProperty('height',(base.height*ratio)+'px','important');
  target.style.setProperty('max-width','none','important');
  target.style.setProperty('max-height','none','important');
  target.dataset.v63ZoomPercent=String(current);
  try{info.doc.defaultView.dispatchEvent(new CustomEvent('gannzilla:wheel-zoom-v63',{detail:{percent:current,zoom:ratio,source:source||'control',min:MIN,max:MAX,step:STEP}}));}catch(error){}
  return true;
}

function createControl(info){
  var doc=info.doc,bar=info.bar;
  ensureStyle(doc);
  var existing=doc.getElementById('v63ZoomGroup');
  if(existing)return existing;
  var group=doc.createElement('div');group.id='v63ZoomGroup';group.setAttribute('role','group');group.setAttribute('aria-label','Wheel zoom');
  var out=doc.createElement('button');out.id='v63ZoomOut';out.type='button';out.title='Zoom out';out.innerHTML=magnifier(false);out.addEventListener('click',function(){applyZoom(current-STEP,'minus');});
  var select=doc.createElement('select');select.id='v63ZoomSelect';select.title='Wheel zoom';populate(select);select.addEventListener('change',function(){applyZoom(Number(select.value),'select');});
  var zoomIn=doc.createElement('button');zoomIn.id='v63ZoomIn';zoomIn.type='button';zoomIn.title='Zoom in';zoomIn.innerHTML=magnifier(true);zoomIn.addEventListener('click',function(){applyZoom(current+STEP,'plus');});
  group.append(out,select,zoomIn);
  var connection=doc.getElementById('v62ConnectionBtn');
  if(connection)bar.insertBefore(group,connection);else bar.insertBefore(group,bar.firstChild);
  syncControls(doc);
  return group;
}

function install(){
  var info=findBar();
  if(!info)return false;
  current=readStored();
  createControl(info);
  applyZoom(current,'install');
  try{info.doc.defaultView.__auditKawkabatMetalZoomV63=function(){return{ok:!!info.doc.getElementById('v63ZoomGroup'),sourceVersion:'V62',minPercent:MIN,maxPercent:MAX,stepPercent:STEP,currentPercent:current,zoomApplied:!!currentTarget,connectionKept:!!info.doc.getElementById('v62ConnectionBtn'),fullscreenKept:!!info.doc.getElementById('v62FullscreenBtn'),languageKept:!!info.doc.getElementById('v62Language'),wheelGeometryChanged:false,ornateFrameChanged:false};};}catch(error){}
  return true;
}

function start(){if(timer)clearInterval(timer);timer=setInterval(install,300);install();}
frame.addEventListener('load',start);start();
}());
</script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
