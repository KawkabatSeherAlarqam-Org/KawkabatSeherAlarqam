  <script>
  (function () {
    'use strict';

    var DIVISIONS = 36;
    var MAJOR_CYCLE_TICKS = 360;
    var DEFAULT_OUTER_CYCLES = 11;
    var RING_0_ARABIC_FONT_SIZE = '36px';
    var OUTER_RINGS_1_2_ARABIC_FONT_SIZE = '46px';
    var OUTER_RINGS_3_4_ARABIC_FONT_SIZE = '50px';
    var OUTER_RINGS_5_PLUS_ARABIC_FONT_SIZE = '54px';

    var frame = document.getElementById('v131-frame');
    var controlDocument = null;
    var wheelDocument = null;
    var wheelObserver = null;
    var pendingApply = false;

    var findInput = null;
    var valueInput = null;
    var incrementInput = null;
    var actualSizeInput = null;
    var visibleSizeInput = null;
    var findAction = null;
    var highlightVisibleInput = null;
    var highlightFillSelect = null;
    var highlightShowNumbersInput = null;
    var highlightShowMarksInput = null;

    // V240 clock rays: isolated controls and SVG elements.
    var clockVisibleInputV240 = null;
    var clockCenterInputV240 = null;
    var clockTimerV240 = null;

    // V272: one responsive luxury card shared by all twelve zodiac sectors.
    var clockZodiacV272 = [
      { sign: 'الحمل', symbol: '♈', element: 'النار', adjective: 'ناري', key: 'fire', color: '#B93620' },
      { sign: 'الثور', symbol: '♉', element: 'التراب', adjective: 'ترابي', key: 'earth', color: '#4F792B' },
      { sign: 'الجوزاء', symbol: '♊', element: 'الهواء', adjective: 'هوائي', key: 'air', color: '#197EAD' },
      { sign: 'السرطان', symbol: '♋', element: 'الماء', adjective: 'مائي', key: 'water', color: '#1B6FA8' },
      { sign: 'الأسد', symbol: '♌', element: 'النار', adjective: 'ناري', key: 'fire', color: '#B93620' },
      { sign: 'العذراء', symbol: '♍', element: 'التراب', adjective: 'ترابي', key: 'earth', color: '#4F792B' },
      { sign: 'الميزان', symbol: '♎', element: 'الهواء', adjective: 'هوائي', key: 'air', color: '#197EAD' },
      { sign: 'العقرب', symbol: '♏', element: 'الماء', adjective: 'مائي', key: 'water', color: '#1B6FA8' },
      { sign: 'القوس', symbol: '♐', element: 'النار', adjective: 'ناري', key: 'fire', color: '#B93620' },
      { sign: 'الجدي', symbol: '♑', element: 'التراب', adjective: 'ترابي', key: 'earth', color: '#4F792B' },
      { sign: 'الدلو', symbol: '♒', element: 'الهواء', adjective: 'هوائي', key: 'air', color: '#197EAD' },
      { sign: 'الحوت', symbol: '♓', element: 'الماء', adjective: 'مائي', key: 'water', color: '#1B6FA8' }
    ];

    var defaultsApplied = false;
    var lastTarget = null;
    var lastAnchor = null;
    var lastFound = false;
    var findInputTimer = null;
    var arabicDigits = '٠١٢٣٤٥٦٧٨٩';

    function visitDocuments(doc, callback, depth) {
      if (!doc || depth > 240) return null;
      var result = callback(doc);
      if (result) return result;

      var frames = doc.querySelectorAll('iframe');
      for (var index = 0; index < frames.length; index += 1) {
        try {
          var found = visitDocuments(
            frames[index].contentDocument,
            callback,
            depth + 1
          );
          if (found) return found;
        } catch (error) {}
      }
      return null;
    }

    function discoverDocuments() {
      try {
        var root = frame.contentDocument;

        controlDocument = visitDocuments(root, function (doc) {
          return doc.querySelector('input[aria-label="Find"]') &&
            doc.querySelector('input[aria-label="Value"]') &&
            doc.querySelector('input[aria-label="Increment"]') &&
            doc.querySelector('input[aria-label="Size"]')
            ? doc
            : null;
        }, 0);

        wheelDocument = visitDocuments(root, function (doc) {
          return doc.getElementById('wheel') &&
            doc.querySelector('.approved-cycle-number') &&
            doc.documentElement.dataset.v50LiveLanguage
            ? doc
            : null;
        }, 0);

        return !!(controlDocument && wheelDocument);
      } catch (error) {
        return false;
      }
    }

    function normalizeDigits(value) {
      var map = {
        '٠':'0','١':'1','٢':'2','٣':'3','٤':'4',
        '٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
        '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4',
        '۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'
      };
      return String(value).replace(/[٠-٩۰-۹]/g, function (digit) {
        return map[digit] || digit;
      }).replace(/,/g, '').trim();
    }

    function parseFiniteNumber(value) {
      var number = Number(normalizeDigits(value));
      return Number.isFinite(number) ? number : null;
    }

    function clampOuterCycles(value) {
      var number = Math.round(Number(value));
      if (!Number.isFinite(number)) number = DEFAULT_OUTER_CYCLES;
      return Math.max(1, number);
    }

    function dispatchControl(control) {
      control.dispatchEvent(new Event('input', { bubbles: true }));
      control.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function setupOuterCycleProxy() {
      actualSizeInput =
        controlDocument.querySelector('input[aria-label="Size"]');
      if (!actualSizeInput) return false;

      function normalizeWesternCycleDigits(value) {
        return String(value == null ? '' : value)
          .replace(/[٠-٩]/g, function (digit) {
            return String('٠١٢٣٤٥٦٧٨٩'.indexOf(digit));
          })
          .replace(/[۰-۹]/g, function (digit) {
            return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(digit));
          });
      }

      visibleSizeInput =
        controlDocument.querySelector('input[data-v131-outer-cycle-proxy="true"]');

      if (!visibleSizeInput) {
        visibleSizeInput = actualSizeInput.cloneNode(true);
        visibleSizeInput.removeAttribute('aria-label');
        visibleSizeInput.setAttribute(
          'aria-label',
          'Outer cycles after anchor'
        );
        visibleSizeInput.setAttribute(
          'data-v131-outer-cycle-proxy',
          'true'
        );
        visibleSizeInput.min = '1';
        visibleSizeInput.removeAttribute('max');
        visibleSizeInput.step = '1';
        visibleSizeInput.value = String(DEFAULT_OUTER_CYCLES);
        actualSizeInput.parentNode.insertBefore(
          visibleSizeInput,
          actualSizeInput
        );
        actualSizeInput.hidden = true;

        function syncOuterCycles() {
          var totalWheels = clampOuterCycles(
            normalizeWesternCycleDigits(visibleSizeInput.value)
          );
          var nextValue = String(totalWheels);
          visibleSizeInput.value = nextValue;
          var controller = controlDocument.defaultView;
          if (
            controller &&
            typeof controller.__setKawkabatWheelCount === 'function'
          ) {
            controller.__setKawkabatWheelCount(totalWheels);
            actualSizeInput.value = nextValue;
          } else {
            actualSizeInput.value = nextValue;
            dispatchControl(actualSizeInput);
          }
        }

        visibleSizeInput.addEventListener('input', syncOuterCycles);
        visibleSizeInput.addEventListener('change', syncOuterCycles);
        visibleSizeInput.addEventListener('keyup', syncOuterCycles);
      }

      [actualSizeInput, visibleSizeInput].forEach(function (input) {
        input.setAttribute('lang', 'en-US');
        input.setAttribute('dir', 'ltr');
        input.setAttribute('inputmode', 'numeric');
        input.style.setProperty('font-family', 'Arial, sans-serif', 'important');
        input.style.setProperty('font-variant-numeric', 'lining-nums tabular-nums', 'important');
        input.style.setProperty('unicode-bidi', 'isolate', 'important');
        input.value = normalizeWesternCycleDigits(input.value);
      });

      var initialOuterCycles =
        clampOuterCycles(normalizeWesternCycleDigits(visibleSizeInput.value) || DEFAULT_OUTER_CYCLES);
      visibleSizeInput.value = String(initialOuterCycles);
      actualSizeInput.value = String(initialOuterCycles);
      controlDocument.documentElement.dataset.v131SizeSemantics =
        'default-eleven-total-wheels-decrease-to-one-unlimited-increase';
      return true;
    }

    

    

    function localizeDigits(value, language) {
      if (language !== 'ar') return value;
      return value.replace(/[0-9]/g, function (digit) {
        return arabicDigits.charAt(Number(digit));
      });
    }

    function positiveModulo(value, divisor) {
      return ((value % divisor) + divisor) % divisor;
    }

    function captureOriginalFont(node) {
      if (node.hasAttribute('data-v131-original-font-size')) return;
      node.setAttribute(
        'data-v131-original-font-size',
        node.style.getPropertyValue('font-size') || ''
      );
      node.setAttribute(
        'data-v131-original-font-priority',
        node.style.getPropertyPriority('font-size') || ''
      );
    }

    function restoreOriginalFont(node) {
      var size = node.getAttribute('data-v131-original-font-size') || '';
      var priority =
        node.getAttribute('data-v131-original-font-priority') || '';
      if (size) {
        node.style.setProperty('font-size', size, priority);
      } else {
        node.style.removeProperty('font-size');
      }
      node.setAttribute('data-v131-font-size', 'en-original');
    }

    function applyArabicFont(node, cycleOffset) {
      var size;
      var marker;
      if (cycleOffset === 0) {
        size = RING_0_ARABIC_FONT_SIZE;
        marker = 'ar-anchor-ring-0-36';
      } else if (cycleOffset <= 2) {
        size = OUTER_RINGS_1_2_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-1-2-46';
      } else if (cycleOffset <= 4) {
        size = OUTER_RINGS_3_4_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-3-4-50';
      } else {
        size = OUTER_RINGS_5_PLUS_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-5-plus-54';
      }
      node.style.setProperty('font-size', size, 'important');
      node.setAttribute('data-v131-font-size', marker);
    }

    function captureSourceTick(node) {
      if (!node.hasAttribute('data-v131-source-tick')) {
        node.setAttribute(
          'data-v131-source-tick',
          node.getAttribute('data-tick') || ''
        );
      }
      return Number(node.getAttribute('data-v131-source-tick'));
    }

    function renderCycleNumberPair(
      node,
      primaryValue,
      cycleValue,
      language,
      enabled,
      ringCount
    ) {
      var localizedCycle = localizeDigits(String(cycleValue), language);
      var angleBadgeId = 'v281CycleAngleBadge-' +
        String(node.getAttribute('data-tick') || primaryValue)
          .replace(/[^0-9A-Za-z_-]/g, '-');
      var existingAngleBadge = wheelDocument.getElementById(angleBadgeId);
      var state = enabled
        ? 'pair|' + primaryValue + '|' + localizedCycle
        : 'primary|' + primaryValue;

      if (node.getAttribute('data-v131-number-render-state') === state) {
        return;
      }

      if (!enabled) {
        if (existingAngleBadge) existingAngleBadge.remove();
        node.textContent = primaryValue;
        node.setAttribute('data-v131-number-render-state', state);
        node.removeAttribute('data-v131-cycle-angle-number');
        return;
      }

      var x = Number(node.getAttribute('x')) || 0;
      var y = Number(node.getAttribute('y')) || 0;
      var dx = x - 2200;
      var dy = y - 1800;
      var radius = Math.sqrt((dx * dx) + (dy * dy)) || 1;
      var radialX = dx / radius;
      var radialY = dy / radius;
      var clockwise =
        wheelDocument.documentElement.dataset.layoutDirection !==
        'counterclockwise';
      var tangentX = clockwise ? -radialY : radialY;
      var tangentY = clockwise ? radialX : -radialX;
      var ringWidth = (1500 - 400) / Math.max(1, ringCount);
      var radialOffset = Math.max(10, (ringWidth / 2) - 16);
      var cornerRadius = radius + radialOffset;
      var tangentBoundary = cornerRadius * Math.tan(
        Math.PI / DIVISIONS
      );
      var tangentOffset = Math.max(8, tangentBoundary - 18);
      var secondaryX =
        x + (radialX * radialOffset) + (tangentX * tangentOffset);
      var secondaryY =
        y + (radialY * radialOffset) + (tangentY * tangentOffset);

      node.textContent = '';

      var primary = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'tspan'
      );
      primary.setAttribute('x', String(x));
      primary.setAttribute('y', String(y));
      primary.setAttribute('data-v131-number-role', 'primary');
      primary.textContent = primaryValue;

      var secondary = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'tspan'
      );
      secondary.setAttribute('x', secondaryX.toFixed(3));
      secondary.setAttribute('y', secondaryY.toFixed(3));
      secondary.setAttribute('data-v131-number-role', 'cycle-angle');
      secondary.style.setProperty('font-size', '15px', 'important');
      secondary.style.setProperty('font-weight', '700', 'important');
      secondary.style.setProperty('font-style', 'normal', 'important');
      secondary.style.setProperty('fill', '#111111', 'important');
      secondary.style.setProperty('stroke', 'none', 'important');
      secondary.style.setProperty('stroke-width', '0', 'important');
      secondary.style.setProperty('filter', 'none', 'important');
      secondary.style.setProperty(
        'paint-order',
        'stroke fill',
        'important'
      );
      secondary.style.setProperty(
        'stroke-linejoin',
        'round',
        'important'
      );
      secondary.style.setProperty('opacity', '1', 'important');
      secondary.textContent = localizedCycle;

      var badgeWidth = Math.max(30, (localizedCycle.length * 8) + 10);
      var angleBadge = existingAngleBadge ||
        wheelDocument.createElementNS(
          'http://www.w3.org/2000/svg',
          'rect'
        );
      angleBadge.id = angleBadgeId;
      angleBadge.setAttribute(
        'x',
        (secondaryX - (badgeWidth / 2)).toFixed(3)
      );
      angleBadge.setAttribute('y', (secondaryY - 10).toFixed(3));
      angleBadge.setAttribute('width', badgeWidth.toFixed(3));
      angleBadge.setAttribute('height', '20');
      angleBadge.setAttribute('rx', '0');
      angleBadge.setAttribute('ry', '0');
      angleBadge.setAttribute('fill', '#C7C7C7');
      angleBadge.setAttribute('fill-opacity', '0.97');
      angleBadge.setAttribute('stroke', 'none');
      angleBadge.setAttribute(
        'data-v281-cycle-angle-badge',
        String(cycleValue)
      );
      if (!existingAngleBadge && node.parentNode) {
        node.parentNode.insertBefore(angleBadge, node);
      }

      node.appendChild(primary);
      node.appendChild(secondary);
      node.setAttribute('data-v131-number-render-state', state);
      node.setAttribute(
        'data-v131-cycle-angle-number',
        String(cycleValue)
      );
    }

    

    function layerNumberForOffset(cycleOffset) {
      if (cycleOffset === 0) return 0;
      return positiveModulo(cycleOffset - 1, 10) + 1;
    }

    function renderLayerMarks(
      root,
      language,
      dataType,
      ringCount,
      model
    ) {
      var existing = wheelDocument.getElementById('v131LayerMarks');
      var enabled = !!(
        highlightShowMarksInput &&
        highlightShowMarksInput.checked &&
        dataType === 'price' &&
        root.dataset.viewMode === 'circle36'
      );

      if (!enabled) {
        if (existing) existing.remove();
        root.dataset.v131LayerMarks = 'hidden';
        return;
      }

      var state = [
        language,
        ringCount,
        root.dataset.layoutDirection || 'clockwise',
        model.anchorEndTick,
        model.step
      ].join('|');

      if (
        existing &&
        existing.getAttribute('data-v131-render-state') === state
      ) {
        return;
      }
      if (existing) existing.remove();

      var cycles = wheelDocument.getElementById('dynamicApprovedCycles');
      if (!cycles) return;

      var group = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'g'
      );
      group.id = 'v131LayerMarks';
      group.setAttribute('pointer-events', 'none');
      group.setAttribute('aria-label', 'Wheel layer marks');
      group.setAttribute('data-v131-render-state', state);

      var clockwise =
        root.dataset.layoutDirection !== 'counterclockwise';
      var ringWidth = (1500 - 400) / Math.max(1, ringCount);
      var eligibleCount = 0;

      wheelDocument
        .querySelectorAll('.approved-cycle-number[data-tick]')
        .forEach(function (node) {
          var correctedTick = Number(node.getAttribute('data-tick'));
          if (
            !Number.isFinite(correctedTick) ||
            Math.abs(correctedTick - Math.round(correctedTick)) > 1e-9 ||
            positiveModulo(Math.round(correctedTick), 3) !== 0
          ) {
            return;
          }

          var cycleOffset = Number.parseInt(
            node.getAttribute('data-cycle-offset') || '0',
            10
          );
          var x = Number(node.getAttribute('x')) || 0;
          var y = Number(node.getAttribute('y')) || 0;
          var dx = x - 2200;
          var dy = y - 1800;
          var radius = Math.sqrt((dx * dx) + (dy * dy)) || 1;
          var radialX = dx / radius;
          var radialY = dy / radius;
          var tangentX = clockwise ? -radialY : radialY;
          var tangentY = clockwise ? radialX : -radialX;
          var radialOffset = Math.max(0, (ringWidth / 2) - 11);
          var cornerRadius = radius + radialOffset;
          var tangentBoundary = cornerRadius * Math.tan(
            Math.PI / DIVISIONS
          );
          var tangentOffset = Math.max(6, tangentBoundary - 18);
          var markX =
            x + (radialX * radialOffset) - (tangentX * tangentOffset);
          var markY =
            y + (radialY * radialOffset) - (tangentY * tangentOffset);
          var layerNumber = layerNumberForOffset(cycleOffset);

          var mark = wheelDocument.createElementNS(
            'http://www.w3.org/2000/svg',
            'text'
          );
          mark.setAttribute('x', markX.toFixed(3));
          mark.setAttribute('y', markY.toFixed(3));
          mark.setAttribute('text-anchor', 'middle');
          mark.setAttribute('dominant-baseline', 'central');
          mark.setAttribute('data-v131-layer-mark', String(layerNumber));
          mark.setAttribute(
            'data-v131-source-tick',
            String(correctedTick)
          );
          mark.style.setProperty('font-family', 'Arial, sans-serif', 'important');
          mark.style.setProperty('font-size', '14px', 'important');
          mark.style.setProperty('font-weight', '800', 'important');
          mark.style.setProperty('font-style', 'normal', 'important');
          mark.style.setProperty('fill', '#6F3F68', 'important');
          mark.style.setProperty('stroke', '#3F233C', 'important');
          mark.style.setProperty('stroke-width', '0.18px', 'important');
          mark.style.setProperty('paint-order', 'stroke fill', 'important');
          mark.style.setProperty('opacity', '1', 'important');
          mark.textContent = localizeDigits(String(layerNumber), language);

          var badge = wheelDocument.createElementNS(
            'http://www.w3.org/2000/svg',
            'rect'
          );
          badge.setAttribute('x', (markX - 12).toFixed(3));
          badge.setAttribute('y', (markY - 10).toFixed(3));
          badge.setAttribute('width', '24');
          badge.setAttribute('height', '20');
          badge.setAttribute('rx', '2.5');
          badge.setAttribute('ry', '2.5');
          badge.setAttribute(
            'data-v131-layer-badge',
            String(layerNumber)
          );
          badge.style.setProperty('fill', '#EAF7F4', 'important');
          badge.style.setProperty('fill-opacity', '0.92', 'important');
          badge.style.setProperty('stroke', '#69BEB8', 'important');
          badge.style.setProperty('stroke-width', '0.9px', 'important');
          badge.style.setProperty('opacity', '1', 'important');

          var shadow = badge.cloneNode(true);
          shadow.removeAttribute('data-v131-layer-badge');
          shadow.setAttribute(
            'data-v131-layer-shadow',
            String(layerNumber)
          );
          shadow.setAttribute('x', (markX - 10.5).toFixed(3));
          shadow.setAttribute('y', (markY - 8.5).toFixed(3));
          shadow.style.setProperty('fill', '#2F625E', 'important');
          shadow.style.setProperty('fill-opacity', '0.22', 'important');
          shadow.style.setProperty('stroke', 'none', 'important');

          group.appendChild(shadow);
          group.appendChild(badge);
          group.appendChild(mark);
          eligibleCount += 1;
        });

      group.setAttribute(
        'data-v131-eligible-mark-count',
        String(eligibleCount)
      );
      cycles.appendChild(group);
      root.dataset.v131LayerMarks = 'visible';
      root.dataset.v131LayerMarkPattern =
        'black-multiples-of-3-offset-0-then-1-to-10-repeat';
    }

    function cellPositionFromGeometry(node, clockwise) {
      var x = Number(node.getAttribute('x'));
      var y = Number(node.getAttribute('y'));
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      var angle = Math.atan2(y - 1800, x - 2200) * 180 / Math.PI;
      var rawIndex = (angle + 90) / (360 / DIVISIONS);
      /*
       * Approved price nodes are positioned at cell centres one geometric
       * step after the north boundary. Converting their angle without this
       * correction shifts every displayed value forward: 2 appears where
       * 1 belongs and 37 replaces 36 at the end of the first ring.
       */
      var numberIndex = positiveModulo(
        Math.round(clockwise ? rawIndex : -rawIndex) - 1,
        DIVISIONS
      );
      return numberIndex === 0 ? DIVISIONS : numberIndex;
    }

    function ensureArabicCardinalDirectionsV142() {
      if (!wheelDocument) return false;
      var svg = wheelDocument.getElementById('wheel');
      if (!svg) return false;

      var existing =
        wheelDocument.getElementById('v144ArabicCardinalDirections');
      if (existing) {
        if (existing.parentNode === svg &&
            existing !== svg.lastElementChild) {
          svg.appendChild(existing);
        }
        return true;
      }

      var NS = 'http://www.w3.org/2000/svg';
      var group = wheelDocument.createElementNS(NS, 'g');
      group.id = 'v144ArabicCardinalDirections';
      group.setAttribute('aria-label', 'الاتجاهات الأربعة');
      group.setAttribute('pointer-events', 'none');

      var directions = [
        { label: 'الشمال', x: 2200, y: 140, rotation: 0 },
        { label: 'الشرق', x: 3860, y: 1800, rotation: 90 },
        { label: 'الجنوب', x: 2200, y: 3460, rotation: 0 },
        { label: 'الغرب', x: 540, y: 1800, rotation: -90 }
      ];

      directions.forEach(function (direction) {
        var text = wheelDocument.createElementNS(NS, 'text');
        text.setAttribute('x', String(direction.x));
        text.setAttribute('y', String(direction.y));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('direction', 'rtl');
        text.setAttribute('unicode-bidi', 'plaintext');
        text.setAttribute('lang', 'ar');
        text.setAttribute('aria-label', direction.label);
        text.setAttribute(
          'transform',
          'rotate(' + direction.rotation + ' ' +
            direction.x + ' ' + direction.y + ')'
        );
        text.style.fontFamily = 'Tahoma, Arial, sans-serif';
        text.style.fontSize = '32px';
        text.style.fontWeight = '500';
        text.style.fill = '#171513';
        text.style.paintOrder = 'stroke fill';
        text.style.stroke = 'rgba(255,255,255,0.32)';
        text.style.strokeWidth = '0.8px';
        text.textContent = direction.label;
        group.appendChild(text);
      });

    function setClockRayV240(role, angle, label, zodiacData) {
      var inner = { x: 2200, y: 1800 };

       * The badges are centred inside the zodiac/day band while their
       * live hour, minute and second angles remain completely unchanged.

      var outer = clockPointV240(angle, 1588);
      var badge = clockPointV240(angle, 1630);
      var line = wheelDocument.querySelector(
        '[data-v240-ray="' + role + '"]'
      );
      var halo = wheelDocument.querySelector(
        '[data-v240-badge-halo="' + role + '"]'
      );
      var rim = wheelDocument.querySelector(
        '[data-v240-badge-rim="' + role + '"]'
      );
      var circle = wheelDocument.querySelector(
        '[data-v240-badge="' + role + '"]'
      );
      var text = wheelDocument.querySelector(
        '[data-v240-label="' + role + '"]'

      if (!line || !halo || !rim || !circle || !text) return;

      line.setAttribute('x1', inner.x.toFixed(3));
      line.setAttribute('y1', inner.y.toFixed(3));
      line.setAttribute('x2', outer.x.toFixed(3));
      line.setAttribute('y2', outer.y.toFixed(3));

      halo.setAttribute('cx', badge.x.toFixed(3));
      halo.setAttribute('cy', badge.y.toFixed(3));
      rim.setAttribute('cx', badge.x.toFixed(3));
      rim.setAttribute('cy', badge.y.toFixed(3));
      circle.setAttribute('cx', badge.x.toFixed(3));
      circle.setAttribute('cy', badge.y.toFixed(3));
      text.setAttribute('x', badge.x.toFixed(3));
      text.setAttribute('y', badge.y.toFixed(3));
      text.textContent = label;

      if (role === 'minute' && zodiacData) {
        var side = badge.x >= 2200 ? 1 : -1;
        var panelX = badge.x + (side * 151);
        var panelY = badge.y;
        var textX = panelX - (side * 22);
        var iconX = panelX + (side * 83);
        var bottomX = panelX - (side * 21);
        var bridge = wheelDocument.querySelector('[data-v260-card-bridge="minute"]');
        var shadow = wheelDocument.querySelector('[data-v260-card-shadow="minute"]');
        var frame = wheelDocument.querySelector('[data-v260-card-frame="minute"]');
        var face = wheelDocument.querySelector('[data-v260-card-face="minute"]');
        var highlight = wheelDocument.querySelector('[data-v260-card-highlight="minute"]');
        var frameOrnament = wheelDocument.querySelector('[data-v272-full-frame-ornament="minute"]');
        var signName = wheelDocument.querySelector('[data-v260-sign-name="minute"]');
        var angleBadge = wheelDocument.querySelector('[data-v269-angle-badge="minute"]');
        var angleLabel = wheelDocument.querySelector('[data-v267-clock-angle="minute"]');
        var elementName = wheelDocument.querySelector('[data-v260-element-name="minute"]');
        var icon = wheelDocument.querySelector('[data-v260-element-icon="minute"]');
        var bottomFrame = wheelDocument.querySelector('[data-v260-bottom-frame="minute"]');
        var bottomFace = wheelDocument.querySelector('[data-v260-bottom-face="minute"]');
        var zodiacSymbol = wheelDocument.querySelector('[data-v260-zodiac-symbol="minute"]');
        var adjective = wheelDocument.querySelector('[data-v260-adjective="minute"]');
        var jewel = wheelDocument.querySelector('[data-v260-card-jewel="minute"]');
        var ornament = wheelDocument.querySelector('[data-v271-card-ornament="minute"]');
        var ornamentGem = wheelDocument.querySelector('[data-v271-ornament-gem="minute"]');
        var diamond = wheelDocument.querySelector('[data-v260-card-diamond="minute"]');
        if (bridge && shadow && frame && face && highlight && frameOrnament && signName &&
            angleBadge && angleLabel && elementName && icon && bottomFrame && bottomFace && zodiacSymbol &&
            adjective && jewel && ornament && ornamentGem && diamond) {
          bridge.setAttribute('x1', badge.x.toFixed(3));
          bridge.setAttribute('y1', badge.y.toFixed(3));
          bridge.setAttribute('x2', (panelX - side * 118).toFixed(3));
          bridge.setAttribute('y2', panelY.toFixed(3));

          shadow.setAttribute('x', (panelX - 127).toFixed(3));
          shadow.setAttribute('y', (panelY - 58).toFixed(3));
          frame.setAttribute('x', (panelX - 123).toFixed(3));
          frame.setAttribute('y', (panelY - 54).toFixed(3));
          face.setAttribute('x', (panelX - 116).toFixed(3));
          face.setAttribute('y', (panelY - 47).toFixed(3));

          frameOrnament.setAttribute(

            'translate(' + panelX.toFixed(3) + ' ' + panelY.toFixed(3) + ')'
          );
          frameOrnament.querySelectorAll('[data-v272-frame-gem]').forEach(
            function (node) {
              node.setAttribute('fill', zodiacData.color);
            }

          highlight.setAttribute('x1', (panelX - 101).toFixed(3));
          highlight.setAttribute('y1', (panelY - 39).toFixed(3));
          highlight.setAttribute('x2', (panelX + 101).toFixed(3));
          highlight.setAttribute('y2', (panelY - 39).toFixed(3));

          signName.setAttribute('x', (textX - 28).toFixed(3));
          signName.setAttribute('y', (panelY - 21).toFixed(3));

          zodiacSymbol.textContent = zodiacData.symbol;
          adjective.setAttribute('x', (bottomX + 24).toFixed(3));
          adjective.setAttribute('y', (panelY + 57).toFixed(3));
          adjective.setAttribute('fill', zodiacData.color);
          adjective.textContent = zodiacData.adjective;

          jewel.setAttribute('cx', (panelX + side * 116).toFixed(3));
          jewel.setAttribute('cy', (panelY - 39).toFixed(3));

          diamond.setAttribute(
            'transform',
            'translate(' + (badge.x + side * 49).toFixed(3) + ' ' +

    function renderClockV240() {
      if (!wheelDocument ||
          !clockVisibleInputV240 ||
          !ensureClockGraphicV240()) return false;

      var rays = wheelDocument.getElementById('v240ClockRays');
      var visible = clockVisibleInputV240.checked;

      rays.style.display = visible ? '' : 'none';
      if (!visible) return true;

      var now = new Date();
      var hour = now.getHours();
      var minute = now.getMinutes();
      var second = now.getSeconds();
      var preciseSecond =
        second + now.getMilliseconds() / 1000;
      // V272: approved wheel sequence advances one zodiac per minute.
      var zodiacData = clockZodiacV272[minute % clockZodiacV272.length];

      setClockRayV240(
        'hour',
        // V272: displayed hour stays on its exact hour axis (18 = 180°).
        (hour % 12) * 30,
        String(hour).padStart(2, '0')
      );
      setClockRayV240(
        'minute',
        // V272: displayed minute stays on its exact minute tick.
        minute * 6,
        String(minute).padStart(2, '0'),
        zodiacData
      );
      setClockRayV240(
        'second',
        // V272: displayed second stays on its exact second tick.
        second * 6,
        String(second).padStart(2, '0')
      );

      return true;
    }

    function startClockV240() {
      ensureClockControlsV240();
      ensureClockGraphicV240();
      renderClockV240();
      if (!clockTimerV240) {
        clockTimerV240 = setInterval(renderClockV240, 250);
      }
      wheelDocument.documentElement.dataset.v240Clock =
        'main-module-ready-default-off';
    }

    function attachWheel() {
      startClockV240();
      if (wheelObserver) wheelObserver.disconnect();
      wheelDocument.addEventListener('gannzilla:language-change', scheduleApply);
      wheelObserver = new MutationObserver(scheduleApply);
      wheelObserver.observe(wheelDocument.getElementById('wheel'), {
        childList: true,
        subtree: true
      });
      applyWheelModel();
    }

    function boot(attempt) {
      if (discoverDocuments()) {
        attachControls();
        attachWheel();
        return;
      }
      if (attempt < 300) {
        setTimeout(function () { boot(attempt + 1); }, 100);
      }
    }

    frame.addEventListener('load', function () { boot(0); });
    boot(0);

    window.auditV131AnchorRing = function () {
      if (!wheelDocument || !controlDocument) return { ready: false };

      var root = wheelDocument.documentElement;

function blobToDataUrl(blob){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){resolve(reader.result);};

async function inlineImages(clone,baseUrl){
  var images=Array.prototype.slice.call(clone.querySelectorAll('image'));
  for(var i=0;i<images.length;i+=1){
    var node=images[i];
    var href=node.getAttribute('href')||node.getAttributeNS('http://www.w3.org/1999/xlink','href')||'';

    try{

      if(!response.ok)continue;
      var dataUrl=await blobToDataUrl(await response.blob());

<script>
(function(){

  'layout':1,'price':1,'highlight':1,'figures':1,'stars':1,
  'default':1,'wheel':1,'appearance':1,'numbers':1,
  'angles':1,'clock':1,'levels':1
};
var SHAPES={
  'triangle':1,'square':1,'pentagon':1,'hexagon':1,
  'heptagon':1,'octagon':1,'nonagon':1,'decagon':1,
  'hendecagon':1,'dodecagon':1
};

function directText(node){
  var text='';
  for(var i=0;i<node.childNodes.length;i+=1){
    if(node.childNodes[i].nodeType===3)text+=' '+node.childNodes[i].nodeValue;
  }
  return text.replace(/\s+/g,' ').trim();
}
function clean(raw){
  return String(raw||'')
    .replace(/^[\s−–—\-+*★☆▪●•]+/,'')
    .replace(/\s*=\s*\d+\s*$/,'')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}
function classify(node){
  var raw=directText(node);
  var title=clean(raw);
  var id=String(node.id||'').toLowerCase();
  var cls=String(node.className||'').toLowerCase();
  var prefixed=/^[\s−–—\-+*★☆▪●•]+/.test(raw);
  var headerNamed=/(?:header|title|section|group|accordion|collaps)/.test(id+' '+cls);

  if(MAIN[title])return'main';
  if(SHAPES[title])return'sub';
  if(/^\d+\s*-\s*point\s+star$/i.test(title))return'sub';
  if(/^\d+\s*point\s+star$/i.test(title))return'sub';
  if(title==='stars')return'main';

  if(prefixed||headerNamed){
    if(/\bstars?\b/i.test(title)){
      return/^\d+/.test(title)?'sub':'main';
    }
    if(/\b(?:triangle|square|pentagon|hexagon|heptagon|octagon|nonagon|decagon|hendecagon|dodecagon)\b/i.test(title)){
      return'sub';
    }
  }
  return'';
}

  for(var n=0;n<nodes.length;n+=1){

  result.documents=1;

  merge(result,styleDocument(doc));
  var frames=doc.querySelectorAll('iframe');

<script>
(function(){

function visit(doc,callback,depth){
  if(!doc||depth>220)return;
  callback(doc);

  for(var i=0;i<frames.length;i+=1){
    try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}

function polar(cx,cy,r,degree){
  var a=degree*Math.PI/180;
  return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};
}
function sector(cx,cy,inner,outer,start,end){
  var os=polar(cx,cy,outer,start),oe=polar(cx,cy,outer,end);
  var ie=polar(cx,cy,inner,end),is=polar(cx,cy,inner,start);
  return[
    'M',os.x.toFixed(3),os.y.toFixed(3),
    'A',outer,outer,0,0,1,oe.x.toFixed(3),oe.y.toFixed(3),
    'L',ie.x.toFixed(3),ie.y.toFixed(3),

  if(gradient.getAttribute('data-v313-palette')===signature)return;
  while(gradient.firstChild)gradient.removeChild(gradient.firstChild);
  for(var i=0;i<stops.length;i+=1){
    var stop=doc.createElementNS(NS,'stop');
    stop.setAttribute('offset',stops[i][0]);
    stop.setAttribute('stop-color',stops[i][1]);

function gradient(doc,defs,id,vertical){
  var node=doc.getElementById(id);
  if(!node){
    node=doc.createElementNS(NS,'linearGradient');
    node.id=id;
    defs.appendChild(node);
  }
  node.setAttribute('gradientUnits','objectBoundingBox');
  node.setAttribute('x1','0%');
  node.setAttribute('y1','0%');
  node.setAttribute('x2',vertical?'0%':'100%');
  node.setAttribute('y2',vertical?'100%':'0%');
  node.setAttribute('spreadMethod','pad');
  var signature=highPrecisionStops.map(function(s){return s.join(':');}).join('|');
  if(node.getAttribute('data-v323-stops')!==signature){
    while(node.firstChild)node.removeChild(node.firstChild);
    for(var i=0;i<highPrecisionStops.length;i+=1){
      var stop=doc.createElementNS(NS,'stop');
      stop.setAttribute('offset',highPrecisionStops[i][0]);
      stop.setAttribute('stop-color',highPrecisionStops[i][1]);
      stop.setAttribute('stop-opacity','1');
      node.appendChild(stop);
    }
    node.setAttribute('data-v323-stops',signature);
  }
}
function embossFilter(doc,defs){
  var filter=doc.getElementById('v323CardinalEmboss');
  if(filter)return filter;
  filter=doc.createElementNS(NS,'filter');
  filter.id='v323CardinalEmboss';
  filter.setAttribute('x','-20%');
  filter.setAttribute('y','-20%');
  filter.setAttribute('width','140%');
  filter.setAttribute('height','140%');
  filter.setAttribute('color-interpolation-filters','sRGB');

  var lower=doc.createElementNS(NS,'feDropShadow');
  lower.setAttribute('dx','0');
  lower.setAttribute('dy','2.2');
  lower.setAttribute('stdDeviation','1.25');
  lower.setAttribute('flood-color','#3B241A');
  lower.setAttribute('flood-opacity','.52');
  filter.appendChild(lower);

  var upper=doc.createElementNS(NS,'feDropShadow');
  upper.setAttribute('dx','0');
  upper.setAttribute('dy','-1.35');
  upper.setAttribute('stdDeviation','.72');
  upper.setAttribute('flood-color','#FFFFFF');
  upper.setAttribute('flood-opacity','.82');
  filter.appendChild(upper);

  defs.appendChild(filter);
  return filter;
}
function repair(doc){
  var svg=doc.getElementById('wheel');
  var defs=svg&&svg.querySelector('defs');
  var fills=doc.getElementById('specialFills');
  if(!svg||!defs||!fills)return false;

  gradient(doc,defs,'v323CardinalVerticalEmbossGradient',true);
  gradient(doc,defs,'v323CardinalHorizontalEmbossGradient',false);
  embossFilter(doc,defs);

  var directionPaths=fills.querySelectorAll('path.special-fill');
  for(var pathIndex=0;pathIndex<directionPaths.length;pathIndex+=1){
    var box=null;
    try{box=directionPaths[pathIndex].getBBox();}catch(error){}
    if(!box)continue;
    var dx=box.x+box.width/2-2200;
    var dy=box.y+box.height/2-1800;
    directionPaths[pathIndex].classList.remove(
      'v322HorizontalAxis','v322VerticalAxis'
    );
    directionPaths[pathIndex].classList.add(
      Math.abs(dx)>Math.abs(dy)
        ?'v322HorizontalAxis'
        :'v322VerticalAxis'
    );
  }

  if(!doc.getElementById('v323HighPrecisionCardinalEmbossStyle')){
    var style=doc.createElement('style');
    style.id='v323HighPrecisionCardinalEmbossStyle';
    style.textContent=
      '#specialFills path.special-fill.v322HorizontalAxis{'+
        'fill:url(#v323CardinalVerticalEmbossGradient)!important;'+
        'fill-opacity:.62!important;opacity:.62!important;'+
        'filter:url(#v323CardinalEmboss)!important;'+
        'stroke:#FFF8F3!important;stroke-opacity:.24!important;'+
        'stroke-width:.55px!important;vector-effect:non-scaling-stroke!important}'+
      '#specialFills path.special-fill.v322VerticalAxis{'+
        'fill:url(#v323CardinalHorizontalEmbossGradient)!important;'+
        'fill-opacity:.62!important;opacity:.62!important;'+
        'filter:url(#v323CardinalEmboss)!important;'+
        'stroke:#FFF8F3!important;stroke-opacity:.24!important;'+
        'stroke-width:.55px!important;vector-effect:non-scaling-stroke!important}'+
      '#specialArcs .special-arc-shadow{opacity:.78!important}'+
      '#specialArcs .special-arc-metal{filter:drop-shadow(0 1px 1px rgba(45,27,19,.42))!important}'+
      '#specialArcs .special-arc-highlight{opacity:1!important}';
    doc.head.appendChild(style);
  }

  repairCount+=1;
  doc.documentElement.dataset.v323HighPrecisionCardinalEmboss='true';

  if(doc.documentElement.dataset.v323CardinalEmbossObserver!=='true'){
    doc.documentElement.dataset.v323CardinalEmbossObserver='true';
    var observer=new MutationObserver(function(records){
      var changed=false;
      for(var i=0;i<records.length;i+=1){
        if(records[i].type==='childList'&&
           (records[i].addedNodes.length||records[i].removedNodes.length)){
          changed=true;break;
        }
      }
      if(!changed)return;
      if(repairTimer)clearTimeout(repairTimer);
      repairTimer=setTimeout(function(){
        repairTimer=null;
        repair(doc);
      },100);
    });
    observer.observe(doc.body,{childList:true,subtree:true});
  }

  if(doc.defaultView){
    doc.defaultView.__auditKawkabatHighPrecisionEmbossV323=function(){
      return{
        applied:true,
        gradientStopCount:highPrecisionStops.length,
        narrowCentralSpecularHighlight:true,
        upperWhiteReflection:true,
        lowerReliefShadow:true,
        cellEdgeMicroHighlight:true,
        fillOpacity:0.62,
        fourDirectionsPreserved:true,
        wheelSizeChangesSupported:true,
        repairCount:repairCount,
        numbersFiltered:false,
        numberGeometryChanged:false,
        wheelGeometryChanged:false
      };
    };
  }
  return true;
}
function start(){
  if(timer)clearTimeout(timer);
  var attempts=0;
  function boot(){
    attempts+=1;
    var done=false;
    try{done=visit(rootFrame.contentDocument,repair,0);}catch(error){}
    if(done||attempts>=600){timer=null;return;}
    timer=setTimeout(boot,100);
  }
  boot();
}
rootFrame.addEventListener('load',start);
start();
}());
</script>
