<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Zodiac Old Color #DAC4B2 V26</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="https://htmlpreview.github.io/?https://github.com/saloqbi/KawkabatSeherAlarqam/blob/main/public/kawkabat-al-arqam-al-sihria-angle-numbers-larger-only-v24.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var poll=null;
    var observer=null;
    var observedWheel=null;
    var timer=null;
    var OLD_ZODIAC_COLOR='#DAC4B2';
    var TARGET_STOP_INDEXES=[2,4];

    function locateWheelDocument(doc,depth){
      if(!doc||depth>20)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function applyOldZodiacColorOnly(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;

        var wheel=wheelDoc.getElementById('wheel');
        var background=wheelDoc.getElementById('thirteenthWheelBackground')||wheelDoc.getElementById('zodiacChampagneBackgroundV13');
        var gradient=wheelDoc.getElementById('zodiacChampagneRadialV13');
        var labels=wheelDoc.getElementById('allBalancedDaysZodiac');
        if(!wheel||!background||!gradient||!labels)return false;

        var stops=gradient.querySelectorAll('stop');
        if(stops.length<5)return false;

        TARGET_STOP_INDEXES.forEach(function(index){
          stops[index].setAttribute('stop-color',OLD_ZODIAC_COLOR);
        });

        background.style.removeProperty('stroke');
        background.setAttribute('stroke','url(#zodiacChampagneRadialV13)');
        background.setAttribute('data-zodiac-dac4b2-old-color-v26','true');

        wheelDoc.documentElement.dataset.zodiacBaseColor=OLD_ZODIAC_COLOR;
        wheelDoc.documentElement.dataset.zodiacGeometryPreserved='true';
        wheelDoc.documentElement.dataset.zodiacTextColorsPreserved='true';
        wheelDoc.documentElement.dataset.cardinalDirectionColorsPreserved='true';
        wheelDoc.documentElement.dataset.piscesColorPreserved='true';
        wheelDoc.documentElement.dataset.angleNumbersPreserved='true';

        if(observedWheel!==wheel){
          if(observer)observer.disconnect();
          observer=new MutationObserver(scheduleApply);
          observer.observe(wheel,{childList:true,subtree:true});
          observedWheel=wheel;
        }

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatZodiacDAC4B2OldColorV26=function(){
            var currentStops=gradient.querySelectorAll('stop');
            return{
              ok:currentStops[2]&&currentStops[4]&&currentStops[2].getAttribute('stop-color')===OLD_ZODIAC_COLOR&&currentStops[4].getAttribute('stop-color')===OLD_ZODIAC_COLOR,
              changedArea:'zodiac-base-gradient-color-only',
              zodiacBaseColor:OLD_ZODIAC_COLOR,
              changedStopIndexes:TARGET_STOP_INDEXES.slice(),
              layoutChanged:false,
              geometryChanged:false,
              bordersChanged:false,
              textChanged:false,
              textColorsChanged:false,
              cardinalDirectionsChanged:false,
              piscesChanged:false,
              angleNumbersChanged:false,
              numberColorsChanged:false
            };
          };
        }
        return true;
      }catch(error){
        return false;
      }
    }

    function scheduleApply(){
      if(timer)clearTimeout(timer);
      timer=setTimeout(function(){timer=null;applyOldZodiacColorOnly();},50);
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyOldZodiacColorOnly()||attempts>=500){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
