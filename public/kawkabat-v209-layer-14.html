<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Fullscreen Enabled V57</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
html[data-v57-pseudo-fullscreen="true"],html[data-v57-pseudo-fullscreen="true"] body{position:fixed;inset:0;width:100%;height:100%;z-index:2147483647}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="/kawkabat-v209-layer-15.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var timer=null;
var boundButtons=[];

function visitDocuments(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{visitDocuments(frames[i].contentDocument,callback,depth+1);}catch(error){}
  }
}

function findFullscreenButtons(){
  var found=[];
  try{
    visitDocuments(frame.contentDocument,function(doc){
      var toolbar=doc.getElementById('v47Toolbar');
      if(!toolbar)return;
      var buttons=toolbar.querySelectorAll('button');
      for(var i=0;i<buttons.length;i+=1){
        var title=String(buttons[i].getAttribute('title')||'').trim();
        if(title==='Fit view'||title==='Fullscreen')found.push(buttons[i]);
      }
    },0);
  }catch(error){}
  return found;
}

function fullscreenElement(){
  return document.fullscreenElement||document.webkitFullscreenElement||null;
}

function enterFullscreen(){
  var root=document.documentElement;
  var request=root.requestFullscreen||root.webkitRequestFullscreen;
  if(request){
    try{
      var result=request.call(root,{navigationUI:'hide'});
      if(result&&typeof result.catch==='function'){
        result.catch(function(){root.dataset.v57PseudoFullscreen='true';});
      }
      return;
    }catch(error){}
  }
  root.dataset.v57PseudoFullscreen='true';
}

function exitFullscreen(){
  var exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(fullscreenElement()&&exit){
    try{exit.call(document);}catch(error){}
  }
  delete document.documentElement.dataset.v57PseudoFullscreen;
}

function toggleFullscreen(){
  if(fullscreenElement()||document.documentElement.dataset.v57PseudoFullscreen==='true')exitFullscreen();
  else enterFullscreen();
}

function syncButtonState(){
  var active=!!fullscreenElement()||document.documentElement.dataset.v57PseudoFullscreen==='true';
  for(var i=0;i<boundButtons.length;i+=1){
    var button=boundButtons[i];
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',active?'true':'false');
    button.setAttribute('title',active?'Exit fullscreen':'Fullscreen');
  }
}

function bind(){
  var buttons=findFullscreenButtons();
  if(!buttons.length)return false;
  for(var i=0;i<buttons.length;i+=1){
    var button=buttons[i];
    if(button.dataset.v57FullscreenBound==='true')continue;
    button.dataset.v57FullscreenBound='true';
    button.setAttribute('aria-label','Fullscreen');
    button.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      if(typeof event.stopImmediatePropagation==='function')event.stopImmediatePropagation();
      toggleFullscreen();
      setTimeout(syncButtonState,80);
    },true);
    boundButtons.push(button);
  }
  syncButtonState();
  return true;
}

function start(){
  if(timer)clearInterval(timer);
  timer=setInterval(bind,150);
  bind();
}

document.addEventListener('fullscreenchange',syncButtonState);
document.addEventListener('webkitfullscreenchange',syncButtonState);
frame.addEventListener('load',start);
start();

window.__auditKawkabatFullscreenEnabledV57=function(){
  return{
    ok:boundButtons.length>0,
    sourceVersion:'V56',
    boundButtonCount:boundButtons.length,
    fullscreenApiSupported:!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen),
    toggleEnabled:true,
    secondClickExits:true,
    escapeExitSupported:true,
    cssFallback:true,
    wheelGeometryChanged:false,
    ornateFrameChanged:false,
    languageBehaviorChanged:false
  };
};
}());
</script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
