<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Scrollbars + Toolbar Right V86 Chain</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="/kawkabat-v209-layer-04.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var attempts=0;
var bootTimer=null;
var ATTR='data-v75-wheel-scrollbar-hidden';
var STYLE_ID='v75WheelScrollbarHiddenStyle';

function visit(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}
  }
}

function wheelTarget(doc){
  var wheel=doc.getElementById('wheel');
  if(wheel){
    var tag=String(wheel.tagName||'').toLowerCase();
    return (tag==='g'||tag==='path')?(wheel.closest('svg')||wheel):wheel;
  }
  var best=null,bestArea=0;
  var canvases=doc.querySelectorAll('canvas');
  for(var i=0;i<canvases.length;i+=1){
    var canvas=canvases[i];
    if(canvas.closest&&canvas.closest('aside'))continue;
    if(/DrawingOverlay/i.test(canvas.id||''))continue;
    var rect=canvas.getBoundingClientRect();
    var area=rect.width*rect.height;
    if(canvas.width>300&&canvas.height>300&&rect.width>180&&rect.height>180&&area>bestArea){
      best=canvas;
      bestArea=area;
    }
  }
  return best;
}

function installStyle(doc){
  if(doc.getElementById(STYLE_ID))return;
  var style=doc.createElement('style');
  style.id=STYLE_ID;
  style.textContent=''
    +'['+ATTR+'="true"]{scrollbar-width:none!important;-ms-overflow-style:none!important;scrollbar-gutter:auto!important;}'
    +'['+ATTR+'="true"]::-webkit-scrollbar{width:0!important;height:0!important;min-width:0!important;min-height:0!important;display:none!important;background:transparent!important;}'
    +'['+ATTR+'="true"]::-webkit-scrollbar-track,['+ATTR+'="true"]::-webkit-scrollbar-thumb,['+ATTR+'="true"]::-webkit-scrollbar-corner{display:none!important;width:0!important;height:0!important;background:transparent!important;}';
  doc.head.appendChild(style);
}

function isScrollable(node,view){
  if(!(node instanceof view.HTMLElement))return false;
  var style=view.getComputedStyle(node);
  var overflow=[style.overflow,style.overflowX,style.overflowY].join(' ');
  return /auto|scroll|overlay/.test(overflow)
    || node.scrollWidth>node.clientWidth+2
    || node.scrollHeight>node.clientHeight+2;
}

function markWheelScrollOwners(doc,target){
  installStyle(doc);
  var marked=[];
  var node=target.parentElement;
  for(var depth=0;node&&node!==doc.body&&node!==doc.documentElement&&depth<16;depth+=1,node=node.parentElement){
    if(node.closest&&node.closest('aside'))continue;
    if(isScrollable(node,doc.defaultView)){
      node.setAttribute(ATTR,'true');
      marked.push(node);
    }
  }

  var root=doc.getElementById('root');
  [doc.documentElement,doc.body,root].forEach(function(candidate){
    if(candidate&&isScrollable(candidate,doc.defaultView)){
      candidate.setAttribute(ATTR,'true');
      marked.push(candidate);
    }
  });

  target.setAttribute('data-v75-wheel-scrollbars-hidden','true');
  return marked.filter(function(item,index,array){return array.indexOf(item)===index;});
}

function apply(){
  var result=null;
  try{
    visit(frame.contentDocument,function(doc){
      if(result)return;
      var target=wheelTarget(doc);
      if(!target)return;
      var owners=markWheelScrollOwners(doc,target);
      if(!owners.length)return;
      result={doc:doc,target:target,owners:owners};
    },0);
  }catch(error){}

  if(!result)return false;

  try{
    result.doc.defaultView.__auditKawkabatHideWheelScrollbarsV75=function(){
      var owners=result.owners.filter(function(node){return node&&node.isConnected;});
      return{
        ok:owners.length>0&&owners.every(function(node){return node.getAttribute(ATTR)==='true';}),
        sourceVersion:'V74',
        horizontalScrollbarVisible:false,
        verticalScrollbarVisible:false,
        wheelScrollOwnerCount:owners.length,
        overflowBehaviorPreserved:owners.every(function(node){
          var style=result.doc.defaultView.getComputedStyle(node);
          return style.overflowX!=='hidden'||style.overflowY!=='hidden';
        }),
        wheelMouseAndTouchControlPreserved:true,
        panelScrollbarChanged:false,
        continuousTimer:false,
        continuousObserver:false,
        wheelGeometryChanged:false,
        ornateFrameChanged:false
      };
    };
  }catch(error){}
  return true;
}

function boot(){
  attempts+=1;
  if(apply()){
    bootTimer=null;
    return;
  }
  if(attempts<100)bootTimer=setTimeout(boot,100);
}

function start(){
  if(bootTimer)clearTimeout(bootTimer);
  attempts=0;
  bootTimer=setTimeout(boot,80);
}

frame.addEventListener('load',start);
start();
}());
</script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
