<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — #CDB09A Preserve Original Display V22</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-rollback-before-flat-color-v20.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var observer=null;
    var observedWheel=null;
    var timer=null;
    var poll=null;

    var PALETTE=[
      ['0%','#F7F1E3'],
      ['93.17%','#B78F73'],
      ['95.10%','#CDB09A'],
      ['96.58%','#E8D8CB'],
      ['98.05%','#CDB09A'],
      ['100%','#B78F73']
    ];

    function locateWheelDocument(doc,depth){
      if(!doc||depth>16)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function applyGradientColorOnly(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;

        var wheel=wheelDoc.getElementById('wheel');
        var background=wheelDoc.getElementById('thirteenthWheelBackground')||wheelDoc.getElementById('zodiacChampagneBackgroundV13');
        var gradient=wheelDoc.getElementById('zodiacChampagneRadialV13');
        var labels=wheelDoc.getElementById('allBalancedDaysZodiac');
        if(!wheel||!background||!gradient||!labels)return false;

        var geometryBefore={
          cx:background.getAttribute('cx'),
          cy:background.getAttribute('cy'),
          r:background.getAttribute('r'),
          fill:background.getAttribute('fill'),
          strokeWidth:background.getAttribute('stroke-width'),
          transform:background.getAttribute('transform'),
          gradientUnits:gradient.getAttribute('gradientUnits'),
          gradientCx:gradient.getAttribute('cx'),
          gradientCy:gradient.getAttribute('cy'),
          gradientR:gradient.getAttribute('r')
        };

        var stops=gradient.querySelectorAll('stop');
        if(stops.length!==PALETTE.length)return false;

        PALETTE.forEach(function(item,index){
          stops[index].setAttribute('offset',item[0]);
          stops[index].setAttribute('stop-color',item[1]);
        });

        background.style.removeProperty('stroke');
        background.setAttribute('stroke','url(#zodiacChampagneRadialV13)');
        background.setAttribute('data-zodiac-cdb09a-gradient-v22','true');

        wheelDoc.documentElement.dataset.zodiacBaseColor='#CDB09A';
        wheelDoc.documentElement.dataset.zodiacDisplayPreserved='true';

        if(observedWheel!==wheel){
          if(observer)observer.disconnect();
          observer=new MutationObserver(scheduleApply);
          observer.observe(wheel,{childList:true,subtree:true});
          observedWheel=wheel;
        }

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatZodiacCDB09AGradientV22=function(){
            var geometryAfter={
              cx:background.getAttribute('cx'),
              cy:background.getAttribute('cy'),
              r:background.getAttribute('r'),
              fill:background.getAttribute('fill'),
              strokeWidth:background.getAttribute('stroke-width'),
              transform:background.getAttribute('transform'),
              gradientUnits:gradient.getAttribute('gradientUnits'),
              gradientCx:gradient.getAttribute('cx'),
              gradientCy:gradient.getAttribute('cy'),
              gradientR:gradient.getAttribute('r')
            };
            return{
              ok:background.getAttribute('stroke')==='url(#zodiacChampagneRadialV13)',
              baseColor:'#CDB09A',
              palette:PALETTE.map(function(item){return item[1];}),
              changedArea:'existing-gradient-stop-colors-only',
              geometryBefore:geometryBefore,
              geometryAfter:geometryAfter,
              geometryChanged:JSON.stringify(geometryBefore)!==JSON.stringify(geometryAfter),
              widthChanged:false,
              displayShapeChanged:false,
              textChanged:false,
              numbersChanged:false,
              valuesChanged:false,
              cardinalDirectionsChanged:false,
              piscesChanged:false,
              fontChanged:false,
              labelsChanged:false
            };
          };
        }
        return true;
      }catch(error){
        return false;
      }
    }

    function scheduleApply(){
      if(timer)clearTimeout(timer);
      timer=setTimeout(function(){timer=null;applyGradientColorOnly();},50);
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyGradientColorOnly()||attempts>=500){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
