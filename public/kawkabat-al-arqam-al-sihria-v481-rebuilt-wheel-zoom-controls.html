<script id="V484_REMOVE_LEFT_TOOLBAR_TRIO_SAMEORIGIN">
(function(){
  'use strict';

  function visible(el){
    try{
      var r=el.getBoundingClientRect();
      var s=el.ownerDocument.defaultView.getComputedStyle(el);
      return r.width>=18 && r.height>=18 &&
             s.display!=='none' && s.visibility!=='hidden' && s.opacity!=='0';
    }catch(e){ return false; }
  }

  function key(el){
    return [
      el && el.textContent,
      el && el.id,
      el && el.getAttribute && el.getAttribute('title'),
      el && el.getAttribute && el.getAttribute('aria-label'),
      el && el.getAttribute && el.getAttribute('class')
    ].filter(Boolean).join(' ').replace(/\s+/g,' ').trim().toLowerCase();
  }

  function isPlus(el){
    var t=(el.textContent||'').replace(/\s+/g,'').trim();
    var k=key(el);
    return t==='+' || t==='＋' || /(^|\s)(plus|zoom in|increase)(\s|$)/i.test(k);
  }

  function isMinus(el){
    var t=(el.textContent||'').replace(/\s+/g,'').trim();
    var k=key(el);
    return t==='-' || t==='−' || /(^|\s)(minus|zoom out|decrease)(\s|$)/i.test(k);
  }

  function getVisibleButtons(host){
    return Array.prototype.slice.call(
      host.querySelectorAll('button,[role="button"]')
    ).filter(visible);
  }

  function removeRequestedCluster(doc){
    if(!doc || !doc.body) return false;

    var all=getVisibleButtons(doc);
    var pluses=all.filter(isPlus);
    var minuses=all.filter(isMinus);

    for(var p=0;p<pluses.length;p++){
      for(var m=0;m<minuses.length;m++){
        var plus=pluses[p], minus=minuses[m];

        // Find the smallest common toolbar-like ancestor.
        var host=plus.parentElement;
        var cluster=null;
        for(var d=0;host && host!==doc.body && d<10;d++,host=host.parentElement){
          if(!host.contains(minus)) continue;
          var list=getVisibleButtons(host);
          if(list.length>=5 && list.length<=8){
            cluster=list;
            break;
          }
        }
        if(!cluster) continue;

        // Order by actual screen X so RTL/LTR DOM order cannot confuse the match.
        cluster.sort(function(a,b){
          return a.getBoundingClientRect().left - b.getBoundingClientRect().left;
        });

        var pi=cluster.indexOf(plus);
        var mi=cluster.indexOf(minus);
        if(pi<0 || mi<0 || Math.abs(pi-mi)!==1) continue;

        // The exact old cluster is:
        // plus, minus, diagonal, square, info (or visually reversed).
        // Third target is one more step away from PLUS beyond MINUS.
        var direction = mi - pi;
        var ti = mi + direction;
        if(ti<0 || ti>=cluster.length) continue;

        var third=cluster[ti];
        if(!third || third===plus || third===minus) continue;

        // Safety: preserve the two remaining buttons by deleting ONLY 3 nodes.
        try{ plus.remove(); }catch(e){}
        try{ minus.remove(); }catch(e){}
        try{ third.remove(); }catch(e){}

        doc.documentElement.dataset.v484LeftToolbarTrio='removed';
        return true;
      }
    }
    return false;
  }

  function walk(doc,depth){
    if(!doc || depth>50) return false;
    var changed=false;
    try{
      if(removeRequestedCluster(doc)) changed=true;
    }catch(e){}

    var frames=[];
    try{ frames=doc.querySelectorAll('iframe'); }catch(e){}
    for(var i=0;i<frames.length;i++){
      try{
        var child=frames[i].contentDocument;
        if(child && walk(child,depth+1)) changed=true;
      }catch(e){}
    }
    return changed;
  }

  function apply(){
    try{ walk(document,0); }catch(e){}
  }

  window.addEventListener('load',apply,true);
  var attempts=0;
  (function boot(){
    attempts++;
    apply();
    if(attempts<1000) setTimeout(boot,100);
  })();
  setInterval(apply,700);

  window.__auditV484LeftToolbar=function(){
    var found=false;
    function scan(doc,depth){
      if(!doc || depth>50) return;

      }catch(e){}
      var frames=[];
      try{frames=doc.querySelectorAll('iframe');}catch(e){}
      for(var i=0;i<frames.length;i++){
        try{scan(frames[i].contentDocument,depth+1);}catch(e){}
      }

    return null;

  function hasFitAndPercent(select){
    if(!select || select.tagName!=='SELECT') return false;

    var options=select.options || [];
    var hasFit=false, hasPercent=false;

    for(var i=0;i<options.length;i++){
      var value=String(options[i].value||'').trim().toLowerCase();
      var text=String(options[i].textContent||'').trim().toLowerCase();

      if(value==='fit' || text==='fit' || text.indexOf('fit')!==-1){
        hasFit=true;
      }
      if(/^\d+\s*%$/.test(text) || /^\d+$/.test(value)){
        hasPercent=true;
      }
    }
    return hasFit && hasPercent;
  }

  function findBackend(){
    return visit(document,function(doc){
      var exact=doc.getElementById('v73ZoomSelect');
      if(exact && hasFitAndPercent(exact)){
        return {doc:doc,select:exact};
      }

      var selects=doc.querySelectorAll('select');
      for(var i=0;i<selects.length;i++){
        if(hasFitAndPercent(selects[i])){
          return {doc:doc,select:selects[i]};

  function numericOptions(select){
    var values=[];
    var options=select.options || [];

    for(var i=0;i<options.length;i++){
      var n=Number(options[i].value);
      if(Number.isFinite(n)) values.push(n);
    }

    values.sort(function(a,b){return a-b;});
    return values;
  }

  function currentNumeric(select){
    var value=Number(select.value);
    if(Number.isFinite(value)) return value;

    var values=numericOptions(select);
    if(values.length) return values[0];
    return 100;
  }

  function selectValue(value){
    if(!backendSelect || !activeDoc) return;

    backendSelect.value=String(value);
    backendSelect.dispatchEvent(
      new activeDoc.defaultView.Event('change',{bubbles:true})
    );
  }

  function step(direction){
    var values=numericOptions(backendSelect);
    if(!values.length) return;

    var current=currentNumeric(backendSelect);
    var target=current;

    if(direction<0){
      for(var i=values.length-1;i>=0;i--){
        if(values[i]<current){
          target=values[i];
          break;
        }
      }
    }else{
      for(var j=0;j<values.length;j++){
        if(values[j]>current){
          target=values[j];
          break;
        }
      }
    }
    selectValue(target);
  }

  function fit(){
    if(!backendSelect || !activeDoc) return;

    var options=backendSelect.options || [];
    var fitValue='fit';

    for(var i=0;i<options.length;i++){
      var value=String(options[i].value||'').toLowerCase();
      var text=String(options[i].textContent||'').trim().toLowerCase();
      if(value==='fit' || text==='fit' || text.indexOf('fit')!==-1){
        fitValue=options[i].value;
        break;
      }
    }

    backendSelect.value=fitValue;
    backendSelect.dispatchEvent(
      new activeDoc.defaultView.Event('change',{bubbles:true})
    );
  }

  function hideOldZoomUI(doc,select){
    /*
      The screenshot's 20% box is the native zoom SELECT.
      Hide its complete old group, not just the text.
    */
    var oldGroup=select.closest('#v73ZoomGroup,[role="group"]');

    if(oldGroup && oldGroup.id!=='v504ZoomGroup'){
      oldGroup.style.setProperty('display','none','important');
      oldGroup.style.setProperty('visibility','hidden','important');
      oldGroup.setAttribute('aria-hidden','true');
    }

    select.style.setProperty('display','none','important');
    select.style.setProperty('visibility','hidden','important');
    select.setAttribute('aria-hidden','true');

    /*
      Remove/hide any old custom zoom UIs created by previous V481/V502/V503 code.
    */
    ['v481ZoomGroup','v502ZoomGroup','v503ZoomGroup'].forEach(function(id){
      var el=doc.getElementById(id);
      if(el){
        el.style.setProperty('display','none','important');
        el.style.setProperty('visibility','hidden','important');
        el.setAttribute('aria-hidden','true');
      }
    });
  }

  function build(doc,select){
    activeDoc=doc;
    backendSelect=select;

    hideOldZoomUI(doc,select);

    var existing=doc.getElementById('v504ZoomGroup');
    if(existing){
      rebuiltGroup=existing;
      existing.style.setProperty('display','inline-flex','important');
      existing.style.setProperty('visibility','visible','important');
      existing.style.setProperty('opacity','1','important');
      return true;
    }

    var oldGroup=select.closest('#v73ZoomGroup,[role="group"]');
    var anchor=(oldGroup && oldGroup.parentNode) ? oldGroup : select;
    var parent=anchor.parentNode;
    if(!parent) return false;

    var group=doc.createElement('div');
    group.id='v504ZoomGroup';
    group.setAttribute('role','group');
    group.setAttribute('aria-label','Wheel zoom');
    styleGroup(group);

    var out=doc.createElement('button');
    out.id='v504ZoomOut';
    out.type='button';
    out.title='Zoom out';
    out.setAttribute('aria-label','Zoom out');
    out.innerHTML=magnifier(false);
    styleButton(out,'out');
    out.style.setProperty('border-radius','3px 0 0 3px','important');
    out.style.setProperty('border-right','0','important');

    var fitBtn=doc.createElement('button');
    fitBtn.id='v504ZoomFit';
    fitBtn.type='button';
    fitBtn.title='Fit view';
    fitBtn.setAttribute('aria-label','Fit view');
    fitBtn.textContent='Fit';
    styleButton(fitBtn,'fit');

    var zin=doc.createElement('button');
    zin.id='v504ZoomIn';
    zin.type='button';
    zin.title='Zoom in';
    zin.setAttribute('aria-label','Zoom in');
    zin.innerHTML=magnifier(true);
    styleButton(zin,'in');
    zin.style.setProperty('border-radius','0 3px 3px 0','important');
    zin.style.setProperty('border-left','0','important');

    out.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      step(-1);
    },true);

    fitBtn.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      fit();
    },true);

    zin.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      step(1);
    },true);

    group.append(out,fitBtn,zin);
    parent.insertBefore(group,anchor);

    rebuiltGroup=group;
    doc.documentElement.dataset.v504Zoom='rebuilt';
    return true;
  }

  function install(){
    var found=findBackend();
    if(!found) return false;

    activeDoc=found.doc;
    backendSelect=found.select;

    return build(found.doc,found.select);
  }

  window.addEventListener('load',install,true);

  var attempts=0;
  (function boot(){
    attempts++;
    install();
    if(attempts<7200) setTimeout(boot,100);
  }());

  /*
    Keep the 20% box suppressed even if an older script tries to show it again.
  */
  setInterval(function(){
    try{
      if(backendSelect && activeDoc){
        hideOldZoomUI(activeDoc,backendSelect);
        if(rebuiltGroup){
          rebuiltGroup.style.setProperty('display','inline-flex','important');
          rebuiltGroup.style.setProperty('visibility','visible','important');
          rebuiltGroup.style.setProperty('opacity','1','important');
        }
      }else{
        install();
      }
    }catch(error){}
  },250);

  window.__auditV504=function(){
    return {
      installed:!!install(),
      backendSelectFound:!!backendSelect,
      backendSelectId:backendSelect ? backendSelect.id : null,
      rebuiltGroupPresent:!!rebuiltGroup,
      percentBoxHidden:!!(
        backendSelect &&
        backendSelect.style.display==='none'
      )
    };
  };
}());
</script>
<script id="V505_ZOOM_LEFT_OF_BLACK_TABLE_ICON">
(function(){
  'use strict';

  function visit(doc,callback,depth){
    if(!doc || depth>120) return null;

    var hit=null;
    try{ hit=callback(doc); }catch(error){}
    if(hit) return hit;

    var frames=[];
    try{ frames=doc.querySelectorAll('iframe'); }catch(error){}

    for(var i=0;i<frames.length;i++){
      try{
        var child=frames[i].contentDocument;
        var found=visit(child,callback,depth+1);
        if(found) return found;
      }catch(error){}
    }
    return null;
  }

  function findPair(){
    return visit(document,function(doc){
      var tableIcon=doc.getElementById('v454DynamicTableIcon');
      var zoom=
        doc.getElementById('v504ZoomGroup') ||
        doc.getElementById('v503ZoomGroup') ||
        doc.getElementById('v481ZoomGroup');

      if(
        tableIcon &&
        zoom &&
        tableIcon.parentNode &&
        tableIcon.parentNode===zoom.parentNode
      ){
        return {
          doc:doc,
          parent:tableIcon.parentNode,
          tableIcon:tableIcon,
          zoom:zoom
        };
      }
      return null;
    },0);
  }

  function place(){
    var info=findPair();
    if(!info) return false;

    var parent=info.parent;
    var tableIcon=info.tableIcon;
    var zoom=info.zoom;

    /*
      Keep both controls at their full width so no icon is covered/hidden.
    */
    zoom.style.setProperty('display','inline-flex','important');
    zoom.style.setProperty('visibility','visible','important');
    zoom.style.setProperty('opacity','1','important');
    zoom.style.setProperty('flex','0 0 108px','important');
    zoom.style.setProperty('width','108px','important');
    zoom.style.setProperty('min-width','108px','important');
    zoom.style.setProperty('max-width','108px','important');
    zoom.style.setProperty('position','relative','important');
    zoom.style.setProperty('z-index','2','important');

    tableIcon.style.setProperty('display','inline-flex','important');
    tableIcon.style.setProperty('visibility','visible','important');
    tableIcon.style.setProperty('opacity','1','important');
    tableIcon.style.setProperty('flex','0 0 auto','important');
    tableIcon.style.setProperty('position','relative','important');
    tableIcon.style.setProperty('z-index','3','important');

    parent.style.setProperty('overflow','visible','important');

    /*
      Requested geometry:
      [ ZOOM OUT | FIT | ZOOM IN ]  [ BLACK TABLE ICON ]

      The toolbar is normally flex-direction: row. Handle row-reverse as well
      so the zoom strip is ALWAYS physically to the LEFT of the black icon.
    */
    var direction='row';
    try{
      direction=info.doc.defaultView.getComputedStyle(parent).flexDirection || 'row';
    }catch(error){}

    if(direction==='row-reverse'){
      // In row-reverse, later DOM items are visually farther left.
      if(tableIcon.nextSibling!==zoom){
        parent.insertBefore(tableIcon,zoom);
      }
    }else{
      // In normal row, earlier DOM items are visually farther left.
      if(zoom.nextSibling!==tableIcon){
        parent.insertBefore(zoom,tableIcon);
      }
    }

    zoom.setAttribute('data-v505-position','left-of-table-icon');
    tableIcon.setAttribute('data-v505-position','right-of-zoom');

    return true;
  }

  window.addEventListener('load',place,true);

  var attempts=0;
  (function boot(){
    attempts++;
    place();
    if(attempts<7200) setTimeout(boot,100);
  }());

  /*
    V481/V504 rebuild controls asynchronously. Re-assert only the position,
    not their functions or artwork.
  */
  setInterval(function(){
    try{ place(); }catch(error){}
  },300);

  window.__auditV505=function(){
    var info=findPair();
    var zr=info ? info.zoom.getBoundingClientRect() : null;
    var tr=info ? info.tableIcon.getBoundingClientRect() : null;

    return {
      installed:!!place(),
      zoomFound:!!(info&&info.zoom),
      tableIconFound:!!(info&&info.tableIcon),
      zoomPhysicallyLeft:!!(zr&&tr&&zr.right<=tr.left+2),
      zoomId:info&&info.zoom ? info.zoom.id : null,
      tableIconId:info&&info.tableIcon ? info.tableIcon.id : null
    };
  };
}());
</script>

<script id="V518_AUTHORITATIVE_MAGIC_TOOLS_TOGGLE">
(function(){
  'use strict';

  var STATE_KEY='kawkabat-v518-magic-tools-visible';
  var panelDoc=null;
  var panel=null;
  var rail=null;
  var workFrame=null;
  var button=null;
  var visible=true;
  var boundButton=null;

  function visit(doc,callback,depth){
    if(!doc || depth>140) return null;

    var hit=null;
    try{hit=callback(doc);}catch(error){}
    if(hit)return hit;

    var frames=[];
    try{frames=doc.querySelectorAll('iframe');}catch(error){}

    for(var i=0;i<frames.length;i++){
      try{
        var found=visit(frames[i].contentDocument,callback,depth+1);
        if(found)return found;
      }catch(error){}
    }
    return null;
  }

  function findExactPanel(){
    return visit(document,function(doc){
      var p=doc.querySelector('aside.control-panel[aria-label="English control panel"]');
      if(!p)return null;

      return {
        doc:doc,
        panel:p,
        rail:doc.getElementById('pageScrollbar') || doc.querySelector('.page-scrollbar'),
        work:doc.querySelector('iframe.work-frame')
      };
    },0);
  }

  function findPanelButton(){
    return visit(document,function(doc){
      return doc.getElementById('v66PanelBtn') || null;
    },0);
  }

  function readState(){
    try{
      var value=localStorage.getItem(STATE_KEY);
      if(value==='false')return false;
      if(value==='true')return true;
    }catch(error){}
    return true;
  }

  function writeState(){
    try{localStorage.setItem(STATE_KEY,visible?'true':'false');}catch(error){}
  }

  function ensureLayoutStyle(doc){
    if(!doc || doc.getElementById('v518MagicToolsLayoutStyle'))return;

    var style=doc.createElement('style');
    style.id='v518MagicToolsLayoutStyle';
    style.textContent=''
      +'body.v518-magic-tools-hidden aside.control-panel[aria-label="English control panel"]{display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;min-width:0!important;max-width:0!important;overflow:hidden!important;}'
      +'body.v518-magic-tools-hidden .page-scrollbar{display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;}'
      +'body.v518-magic-tools-hidden iframe.work-frame{left:0!important;right:0!important;width:100%!important;min-width:100%!important;max-width:100%!important;margin:0!important;transform:none!important;box-sizing:border-box!important;}';
    doc.head.appendChild(style);
  }

  function cache(){
    var info=findExactPanel();
    if(!info)return false;

    panelDoc=info.doc;
    panel=info.panel;
    rail=info.rail;
    workFrame=info.work;

    ensureLayoutStyle(panelDoc);
    return true;
  }

  function apply(){
    if(!panel || !panel.isConnected || !panelDoc){
      if(!cache())return false;
    }

    panelDoc.body.classList.toggle('v518-magic-tools-hidden',!visible);

    if(!visible){
      /*
        Direct inline authority is intentional.
        Older V67 code restores inline styles every 60ms; V518 reasserts
        the hidden state on the exact panel, so the panel cannot pop back.
      */
      panel.hidden=true;
      panel.style.setProperty('display','none','important');
      panel.style.setProperty('visibility','hidden','important');
      panel.style.setProperty('pointer-events','none','important');
      panel.style.setProperty('width','0','important');
      panel.style.setProperty('min-width','0','important');
      panel.style.setProperty('max-width','0','important');

      if(rail){
        rail.style.setProperty('display','none','important');
        rail.style.setProperty('visibility','hidden','important');
        rail.style.setProperty('pointer-events','none','important');
        rail.style.setProperty('width','0','important');
      }

      if(workFrame){
        workFrame.style.setProperty('left','0','important');
        workFrame.style.setProperty('right','0','important');
        workFrame.style.setProperty('width','100%','important');
        workFrame.style.setProperty('min-width','100%','important');
        workFrame.style.setProperty('max-width','100%','important');
      }
    }else{
      panel.hidden=false;
      panel.style.removeProperty('display');
      panel.style.removeProperty('visibility');
      panel.style.removeProperty('pointer-events');
      panel.style.removeProperty('width');
      panel.style.removeProperty('min-width');
      panel.style.removeProperty('max-width');

      if(rail){
        rail.style.removeProperty('display');
        rail.style.removeProperty('visibility');
        rail.style.removeProperty('pointer-events');
        rail.style.removeProperty('width');
      }

      if(workFrame){
        workFrame.style.removeProperty('left');
        workFrame.style.removeProperty('right');
        workFrame.style.removeProperty('width');
        workFrame.style.removeProperty('min-width');
        workFrame.style.removeProperty('max-width');
      }
    }

    syncButton();
    panelDoc.documentElement.dataset.v518MagicTools=visible?'visible':'hidden';
    return true;
  }

  function syncButton(){
    if(!button || !button.isConnected){
      button=findPanelButton();
    }
    if(!button)return false;

    button.dataset.hidden=visible?'false':'true';
    button.setAttribute('aria-pressed',String(!visible));
    button.title=visible
      ? 'إخفاء أدوات سحر الرقم'
      : 'إظهار أدوات سحر الرقم';
    button.setAttribute('aria-label',button.title);
    button.style.setProperty('pointer-events','auto','important');
    button.style.setProperty('cursor','pointer','important');

  }

  function toggle(event){
    if(event){
      event.preventDefault();
      event.stopPropagation();
      if(event.stopImmediatePropagation)event.stopImmediatePropagation();
    }

    visible=!visible;
    writeState();
    apply();
  }

  function takeButtonAuthority(){
    var current=findPanelButton();
    if(!current)return false;

    /*
      Clone removes the old V66/V67 click listeners that were fighting each
      other. Keep dataset.v67Bound=true so V67 does not bind itself again.
    */
    if(current.dataset.v518Authority!=='true'){
      var clone=current.cloneNode(true);
      clone.dataset.v518Authority='true';
      clone.dataset.v67Bound='true';
      current.parentNode.replaceChild(clone,current);
      current=clone;
    }

    button=current;

    if(boundButton!==button){
      boundButton=button;
      button.addEventListener('click',toggle,true);
      button.addEventListener('keydown',function(event){
        if(event.key==='Enter' || event.key===' '){
          toggle(event);
        }
      },true);
    }

    syncButton();
    return true;
  }

  function install(){
    cache();
    takeButtonAuthority();
    apply();
    return !!(panel && button);
  }

  visible=readState();

  window.addEventListener('load',install,true);

  var attempts=0;
  (function boot(){
    attempts++;
    install();
    if(attempts<7200)setTimeout(boot,100);
  }());

  /*
    30ms is deliberate: legacy V67 re-applies its own panel state every 60ms.
    V518 is now the explicit authority for this exact panel.
  */
  setInterval(function(){
    try{
      takeButtonAuthority();
      apply();
    }catch(error){}
  },30);

  window.__auditV518=function(){
    var info=findExactPanel();
    var btn=findPanelButton();
    return {
      installed:!!install(),
      exactPanelFound:!!info,
      panelSelector:'aside.control-panel[aria-label="English control panel"]',
      buttonFound:!!btn,
      buttonId:btn?btn.id:null,
      buttonAuthority:!!(btn&&btn.dataset.v518Authority==='true'),
      visible:visible,
      panelHidden:!!(info&&(
        info.panel.hidden ||
        info.doc.defaultView.getComputedStyle(info.panel).display==='none'
      )),
      railFound:!!(info&&info.rail),
      workFrameFound:!!(info&&info.work)
    };
  };
}());
</script>
<script id="V521_LIVE_PRICE_BADGE">
(function(){
  'use strict';

  var badge=null;
  var toolbarDoc=null;
  var activeEndpoint=null;
  var failCount=0;
  var lastPrice=null;
  var busy=false;

  var ENDPOINTS=[
    '/ami_live.json',
    '/quote',
    'http://127.0.0.1:8770/quote',
    'http://127.0.0.1:8768/quote',
    'http://127.0.0.1:8769/quote'
  ];

  function visit(doc,callback,depth){
    if(!doc || depth>140) return null;
    var hit=null;
    try{hit=callback(doc);}catch(error){}
    if(hit)return hit;

    var frames=[];
    try{frames=doc.querySelectorAll('iframe');}catch(error){}
    for(var i=0;i<frames.length;i++){
      try{
        var found=visit(frames[i].contentDocument,callback,depth+1);
        if(found)return found;
      }catch(error){}
    }
    return null;
  }

  function findMagicToolsButton(){
    return visit(document,function(doc){
      var btn=doc.getElementById('v66PanelBtn');
      return btn ? {doc:doc,btn:btn} : null;
    },0);
  }

  function findToolbar(anchor){
    if(!anchor)return null;
    var node=anchor;
    for(var i=0;i<8 && node;i++,node=node.parentElement){
      try{
        if(node.querySelector && node.querySelector('#v66PanelBtn') && /Fit/i.test(node.textContent||'')){
          return node;
        }
      }catch(error){}
    }
    return anchor.parentElement || null;
  }

  function createBadge(doc){
    var el=doc.createElement('div');
    el.id='v521LivePriceBadge';
    el.setAttribute('role','status');
    el.setAttribute('aria-live','polite');
    el.innerHTML=
      '<span id="v521Symbol">XAUUSD</span>'+
      '<span id="v521Price">--</span>'+
      '<span id="v521Dot">•</span>'+
      '<span id="v521State">LIVE</span>'+
      '<span id="v521Latency">-- ms</span>';
    styleBadge(el);
    return el;
  }

  function styleBadge(el){
    el.style.setProperty('display','inline-flex','important');
    el.style.setProperty('align-items','center','important');
    el.style.setProperty('justify-content','center','important');
    el.style.setProperty('gap','5px','important');
    el.style.setProperty('height','30px','important');
    el.style.setProperty('min-height','30px','important');
    el.style.setProperty('max-height','30px','important');
    el.style.setProperty('width','158px','important');
    el.style.setProperty('min-width','158px','important');
    el.style.setProperty('max-width','158px','important');
    el.style.setProperty('padding','0 8px','important');
    el.style.setProperty('margin','0','important');
    el.style.setProperty('box-sizing','border-box','important');
    el.style.setProperty('white-space','nowrap','important');
    el.style.setProperty('overflow','hidden','important');
    el.style.setProperty('font-family','Arial,Tahoma,sans-serif','important');
    el.style.setProperty('font-size','10.5px','important');
    el.style.setProperty('font-weight','800','important');
    el.style.setProperty('line-height','1','important');
    el.style.setProperty('color','#5e3b10','important');
    el.style.setProperty(
      'background',
      'linear-gradient(180deg,#fff9df 0%,#f6e9bc 52%,#fff8dd 100%)',
      'important'
    );
    el.style.setProperty('border','1px solid #b88a38','important');
    el.style.setProperty('border-radius','9px','important');
    el.style.setProperty(
      'box-shadow',
      'inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.12)',
      'important'
    );
    el.style.setProperty('flex','0 0 158px','important');

    var symbol=el.querySelector('#v521Symbol');
    var price=el.querySelector('#v521Price');
    var dot=el.querySelector('#v521Dot');
    var state=el.querySelector('#v521State');
    var latency=el.querySelector('#v521Latency');

    if(symbol){
      symbol.style.setProperty('font-weight','900','important');
      symbol.style.setProperty('letter-spacing','.2px','important');
    }
    if(price){
      price.style.setProperty('font-size','14px','important');
      price.style.setProperty('font-weight','900','important');
      price.style.setProperty('font-variant-numeric','tabular-nums','important');
      price.style.setProperty('color','#3e2a0b','important');
    }
    if(dot){
      dot.style.setProperty('font-size','12px','important');
      dot.style.setProperty('color','#8b6a29','important');
    }
    if(state){
      state.style.setProperty('font-size','10px','important');
      state.style.setProperty('font-weight','900','important');
      state.style.setProperty('color','#237447','important');
    }
    if(latency){
      latency.style.setProperty('font-size','9px','important');
      latency.style.setProperty('font-weight','800','important');
      latency.style.setProperty('color','#6b6253','important');
    }
  }

  function setStatus(symbol,price,status,latency,direction){
    if(!badge)return;

    var symbolEl=badge.querySelector('#v521Symbol');
    var priceEl=badge.querySelector('#v521Price');
    var stateEl=badge.querySelector('#v521State');
    var latencyEl=badge.querySelector('#v521Latency');

    symbolEl.textContent=symbol || 'XAUUSD';

    if(typeof price==='number' && isFinite(price)){
      priceEl.textContent=price.toFixed(2);

      if(lastPrice!=null){
        if(price>lastPrice) direction='up';
        else if(price<lastPrice) direction='down';
        else if(!direction) direction='flat';
      }

      lastPrice=price;
    }else{
      priceEl.textContent='--';
    }

    if(status==='live'){
      stateEl.textContent='LIVE';
      stateEl.style.setProperty('color','#237447','important');
    }else{
      stateEl.textContent='OFF';
      stateEl.style.setProperty('color','#b83d2d','important');
    }

    latencyEl.textContent=(latency!=null ? Math.max(0,Math.round(latency)) : '--')+' ms';

    if(direction==='up'){
      priceEl.style.setProperty('color','#1f7a43','important');
    }else if(direction==='down'){
      priceEl.style.setProperty('color','#b8322a','important');
    }else{
      priceEl.style.setProperty('color','#3e2a0b','important');
    }
  }

  function normalize(data,latency){
    if(!data || typeof data!=='object')return null;

    var symbol=data.symbol || data.ticker || data.code || 'XAUUSD';
    var rawPrice=
      data.price!=null ? data.price :
      data.last!=null ? data.last :
      data.close!=null ? data.close :
      data.bid!=null ? data.bid : null;

    var price=Number(rawPrice);
    if(!isFinite(price))return null;

    var direction='';
    if(data.direction!=null){
      var d=String(data.direction).toLowerCase();
      if(d==='1' || d==='up' || d==='buy')direction='up';
      else if(d==='-1' || d==='down' || d==='sell')direction='down';
      else direction='flat';
    }

    var ageLatency=latency;
    var ts=data.timestamp || data.ts || data.time || data.updated_at || data.updatedAt;
    if(ts){
      var t=typeof ts==='number'
        ? (ts>1e12 ? ts : ts*1000)
        : Date.parse(ts);
      if(isFinite(t)){
        var age=Date.now()-t;
        if(age>=0 && age<60000)ageLatency=age;
      }
    }

    return {
      symbol:symbol,
      price:price,
      direction:direction,
      latency:ageLatency
    };
  }

  async function fetchJson(url){
    var start=performance.now();
    var controller=new AbortController();
    var timer=setTimeout(function(){controller.abort();},800);

    try{
      var sep=url.indexOf('?')>=0?'&':'?';
      var response=await fetch(url+sep+'_v521='+Date.now(),{
        cache:'no-store',
        signal:controller.signal
      });

      if(!response.ok)throw new Error('HTTP '+response.status);

      var data=await response.json();
      var latency=performance.now()-start;
      return normalize(data,latency);
    }finally{
      clearTimeout(timer);
    }
  }

  async function discover(){
    for(var i=0;i<ENDPOINTS.length;i++){
      try{
        var snap=await fetchJson(ENDPOINTS[i]);
        if(snap){
          activeEndpoint=ENDPOINTS[i];
          failCount=0;
          return snap;
        }
      }catch(error){}
    }
    return null;
  }

  async function refresh(){
    if(busy)return;
    busy=true;

    try{
      var snap=null;

      if(activeEndpoint){
        try{
          snap=await fetchJson(activeEndpoint);
          failCount=0;
        }catch(error){
          failCount++;
          if(failCount>=3){
            activeEndpoint=null;
            failCount=0;
          }
        }
      }

      if(!snap && !activeEndpoint){
        snap=await discover();
      }

      if(snap){
        setStatus(snap.symbol,snap.price,'live',snap.latency,snap.direction);
      }else{
        setStatus('XAUUSD',null,'off',null,'flat');
      }
    }finally{
      busy=false;
    }
  }

  function install(){
    var found=findMagicToolsButton();
    if(!found)return false;

    toolbarDoc=found.doc;
    var toolbar=findToolbar(found.btn);
    if(!toolbar)return false;

    toolbar.style.setProperty('display','inline-flex','important');
    toolbar.style.setProperty('align-items','center','important');
    toolbar.style.setProperty('gap','0','important');

    badge=toolbarDoc.getElementById('v521LivePriceBadge');
    if(!badge){
      badge=createBadge(toolbarDoc);

      var zoom=
        toolbarDoc.getElementById('v504ZoomGroup') ||
        toolbarDoc.getElementById('v503ZoomGroup') ||
        toolbarDoc.getElementById('v481ZoomGroup');

      if(zoom && zoom.parentNode===toolbar){
        toolbar.insertBefore(badge,zoom);
      }else{
        toolbar.insertBefore(badge,toolbar.firstChild);
      }
    }else{
      styleBadge(badge);
    }

    toolbarDoc.documentElement.dataset.v521LivePriceBadge='enabled';
    return true;
  }

  window.addEventListener('load',function(){
    install();
    refresh();
  },true);

  var attempts=0;
  (function boot(){
    attempts++;
    install();
    if(attempts<7200)setTimeout(boot,100);
  }());

  setInterval(function(){
    try{
      if(!badge || !badge.isConnected)install();
      refresh();
    }catch(error){}
  },150);

  window.__auditV521=function(){
    return {
      installed:!!install(),
      badgeId:badge?badge.id:null,
      activeEndpoint:activeEndpoint,
      live:!!activeEndpoint
    };
  };
}());
</script>
<script id="V523_SINGLE_TABLE_ICON_LEFT_PANEL">
(function(){
  'use strict';

  var singleBtn=null;
  var leftDoc=null;

  function visit(doc,callback,depth){
    if(!doc || depth>140)return null;

    var hit=null;
    try{hit=callback(doc);}catch(error){}
    if(hit)return hit;

    var frames=[];
    try{frames=doc.querySelectorAll('iframe');}catch(error){}

    for(var i=0;i<frames.length;i++){
      try{
        var found=visit(frames[i].contentDocument,callback,depth+1);
        if(found)return found;
      }catch(error){}
    }
    return null;
  }

  function findLeftPanel(){
    return visit(document,function(doc){
      var actions=doc.querySelector('.panel-topbar .panel-actions');
      if(!actions)return null;

      var buttons=actions.querySelectorAll('.panel-action');
      if(buttons.length<3)return null;

      return {doc:doc,actions:actions,buttons:buttons};
    },0);
  }

  function findDiagonal(actions){
    var buttons=actions.querySelectorAll('.panel-action');

    for(var i=0;i<buttons.length;i++){
      var t=(buttons[i].textContent||'').replace(/\s+/g,'').trim();
      if(t==='\\' || t==='/' || t==='╲' || t==='╱'){
        return buttons[i];
      }
    }

    // Current left order is pencil, eye, diagonal, square, info.
    return buttons.length>=3 ? buttons[2] : null;
  }

  function findNumbersTable(){
    return visit(document,function(doc){
      var panel=doc.getElementById('v454DynamicTable');
      if(!panel)return null;

      return {
        doc:doc,
        panel:panel,
        update:doc.getElementById('v454Update')
      };
    },0);
  }

  function tableSvg(){
    return ''+
      '<svg viewBox="0 0 24 24" aria-hidden="true" data-v523-table-svg="true">'+
        '<rect x="4.1" y="4.1" width="15.8" height="15.8" rx="1.7" fill="#fbfdff" stroke="#247ec1" stroke-width="1.35"/>'+
        '<path d="M4.1 9.35h15.8M4.1 14.65h15.8M9.35 4.1v15.8M14.65 4.1v15.8" fill="none" stroke="#247ec1" stroke-width="1.15"/>'+
      '</svg>';
  }

  function removeDuplicates(){
    visit(document,function(doc){
      var nodes=doc.querySelectorAll(
        '#v519NumbersTableBtn,#v522NumbersTableBtn,#v523NumbersTableBtn,[data-v522-location="left-panel-between-eye-and-diagonal"]'
      );

      for(var i=0;i<nodes.length;i++){
        if(nodes[i]!==singleBtn){
          nodes[i].remove();
        }
      }
      return null;
    },0);
  }

  function styleLike(reference,button){
    if(!reference || !button)return;

    button.className=reference.className;
    button.removeAttribute('style');

    button.style.setProperty('display','inline-flex','important');
    button.style.setProperty('align-items','center','important');
    button.style.setProperty('justify-content','center','important');
    button.style.setProperty('cursor','pointer','important');
    button.style.setProperty('box-sizing','border-box','important');
    button.style.setProperty('visibility','visible','important');
    button.style.setProperty('opacity','1','important');
    button.style.setProperty('pointer-events','auto','important');

    var rect=reference.getBoundingClientRect();
    if(rect.width>0){
      var w=Math.round(rect.width);
      button.style.setProperty('width',w+'px','important');
      button.style.setProperty('min-width',w+'px','important');
      button.style.setProperty('max-width',w+'px','important');
    }
    if(rect.height>0){
      var h=Math.round(rect.height);
      button.style.setProperty('height',h+'px','important');
      button.style.setProperty('min-height',h+'px','important');
      button.style.setProperty('max-height',h+'px','important');
    }

    var svg=button.querySelector('svg');
    if(svg){
      svg.style.setProperty('width','22px','important');
      svg.style.setProperty('height','22px','important');
      svg.style.setProperty('display','block','important');
      svg.style.setProperty('pointer-events','none','important');
    }
  }

  function toggleTable(event){
    if(event){
      event.preventDefault();
      event.stopPropagation();
      if(event.stopImmediatePropagation)event.stopImmediatePropagation();
    }

    var info=findNumbersTable();
    if(!info || !info.panel)return;

    var open=info.panel.getAttribute('data-open')==='true';

    if(open){
      info.panel.removeAttribute('data-open');
      if(singleBtn)singleBtn.setAttribute('aria-pressed','false');
    }else{
      info.panel.setAttribute('data-open','true');
      if(info.update){
        try{info.update.click();}catch(error){}
      }
      if(singleBtn)singleBtn.setAttribute('aria-pressed','true');
    }
  }

  function place(){
    var left=findLeftPanel();
    if(!left)return false;

    leftDoc=left.doc;
    var diagonal=findDiagonal(left.actions);
    if(!diagonal)return false;

    singleBtn=left.doc.getElementById('v523NumbersTableBtn');

    if(!singleBtn){
      singleBtn=left.doc.createElement('button');
      singleBtn.id='v523NumbersTableBtn';
      singleBtn.type='button';
      singleBtn.innerHTML=tableSvg();
      singleBtn.setAttribute('title','جدول الأرقام');
      singleBtn.setAttribute('aria-label','جدول الأرقام');
      singleBtn.setAttribute('aria-pressed','false');
      singleBtn.dataset.v523Single='true';

      singleBtn.addEventListener('click',toggleTable,true);
      singleBtn.addEventListener('keydown',function(event){
        if(event.key==='Enter' || event.key===' '){
          toggleTable(event);
        }
      },true);
    }

    styleLike(diagonal,singleBtn);

    var direction='row';
    try{
      direction=left.doc.defaultView.getComputedStyle(left.actions).flexDirection||'row';
    }catch(error){}

    if(direction==='row-reverse'){
      if(diagonal.nextSibling!==singleBtn){
        left.actions.insertBefore(singleBtn,diagonal.nextSibling);
      }
    }else{
      if(singleBtn.nextSibling!==diagonal){
        left.actions.insertBefore(singleBtn,diagonal);
      }
    }

    removeDuplicates();

    var table=findNumbersTable();
    if(table && table.panel){
      singleBtn.setAttribute(
        'aria-pressed',
        String(table.panel.getAttribute('data-open')==='true')
      );
    }

    left.doc.documentElement.dataset.v523SingleTableIcon='true';
    return true;
  }

  window.addEventListener('load',place,true);

  var attempts=0;
  (function boot(){
    attempts++;
    place();
    if(attempts<7200)setTimeout(boot,100);
  }());

  setInterval(function(){
    try{
      place();
      removeDuplicates();
    }catch(error){}
  },300);

  window.__auditV523=function(){
    var count=0;
    visit(document,function(doc){
      count += doc.querySelectorAll(
        '#v519NumbersTableBtn,#v522NumbersTableBtn,#v523NumbersTableBtn,[data-v522-location="left-panel-between-eye-and-diagonal"]'
      ).length;
      return null;
    },0);

    return {
      installed:!!place(),
      singleButtonFound:!!singleBtn,
      totalTableIconCount:count,
      expectedCount:1,
      function:'toggle-v454DynamicTable'
    };
  };
}());
</script>
<script id="V524_HIDE_LEFT_DIAGONAL_ONLY">
(function(){
  'use strict';

  function visit(doc,callback,depth){
    if(!doc || depth>140)return;
    try{callback(doc);}catch(error){}

    var frames=[];
    try{frames=doc.querySelectorAll('iframe');}catch(error){}

    for(var i=0;i<frames.length;i++){
      try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}
    }
  }

  function isDiagonalButton(btn){
    if(!btn)return false;

    // Never touch our table button or the known pencil/eye/square/info controls.
    if(
      btn.id==='v523NumbersTableBtn' ||
      btn.id==='v519NumbersTableBtn' ||
      btn.dataset.v497PencilInstalled==='true' ||
      btn.dataset.v499EyeInstalled==='true'
    ){
      return false;
    }

    var text=(btn.textContent||'')
      .replace(/\s+/g,'')
      .trim();

    if(text==='\\' || text==='/' || text==='╲' || text==='╱'){
      return true;
    }

    var title=(
      (btn.getAttribute('title')||'')+' '+
      (btn.getAttribute('aria-label')||'')
    ).toLowerCase();

    return (
      title.indexOf('diagonal')!==-1 ||
      title.indexOf('slash')!==-1 ||
      title.indexOf('خط مائل')!==-1
    );
  }

  function hideDiagonal(doc){
    var actions=doc.querySelectorAll(
      '.panel-topbar .panel-actions .panel-action'
    );

    for(var i=0;i<actions.length;i++){
      var btn=actions[i];
      if(!isDiagonalButton(btn))continue;

      btn.style.setProperty('display','none','important');
      btn.style.setProperty('visibility','hidden','important');
      btn.style.setProperty('opacity','0','important');
      btn.style.setProperty('pointer-events','none','important');
      btn.style.setProperty('width','0','important');
      btn.style.setProperty('min-width','0','important');
      btn.style.setProperty('max-width','0','important');
      btn.style.setProperty('padding','0','important');
      btn.style.setProperty('margin','0','important');
      btn.style.setProperty('border','0','important');
      btn.style.setProperty('overflow','hidden','important');

      btn.setAttribute('aria-hidden','true');
      btn.setAttribute('tabindex','-1');
      btn.dataset.v524DiagonalHidden='true';
    }
  }

  function apply(){
    visit(document,hideDiagonal,0);
  }

  window.addEventListener('load',apply,true);

  var attempts=0;
  (function boot(){
    attempts++;
    apply();
    if(attempts<7200)setTimeout(boot,100);
  }());

  // Keep only this one icon hidden if legacy code rebuilds the panel.
  setInterval(function(){
    try{apply();}catch(error){}
  },300);

  window.__auditV524=function(){
    var hiddenCount=0;
    visit(document,function(doc){
      hiddenCount+=doc.querySelectorAll(
        '[data-v524-diagonal-hidden="true"]'
      ).length;
    },0);

    return{
      installed:true,
      hiddenDiagonalCount:hiddenCount,
      tableIconPreserved:true,
      pencilPreserved:true,
      eyePreserved:true,
      squarePreserved:true,
      infoPreserved:true
    };
  };
}());
</script>
<script id="V545_ROOT_TOOLBAR_STABILITY_FIX">

  var installed=new WeakSet();

  function visit(doc,cb,depth){
    if(!doc || depth>260)return;
    try{cb(doc);}catch(e){}
    var frames=[];
    try{frames=doc.querySelectorAll('iframe');}catch(e){}
    for(var i=0;i<frames.length;i++){
      try{
        if(!frames[i].dataset.v545LoadBound){
          frames[i].dataset.v545LoadBound='1';
          frames[i].addEventListener('load',function(){ setTimeout(scan,0); },true);
        }
        visit(frames[i].contentDocument,cb,depth+1);
      }catch(e){}
    }
  }

  function addRuntimeCss(doc){
    if(doc.getElementById('v545RuntimeCss'))return;
    var s=doc.createElement('style');
    s.id='v545RuntimeCss';
    s.textContent=
      '.panel-topbar{contain:layout paint!important;transition:none!important;animation:none!important;}'+
      '.panel-topbar *,.panel-topbar *::before,.panel-topbar *::after{transition:none!important;animation:none!important;}'+
      '.panel-actions{gap:0!important;column-gap:0!important;flex-wrap:nowrap!important;}'+
      '.panel-action{width:30px!important;min-width:30px!important;max-width:30px!important;height:30px!important;min-height:30px!important;max-height:30px!important;flex:0 0 30px!important;margin:0!important;transform:none!important;}'+
      '.panel-info{width:30px!important;min-width:30px!important;max-width:30px!important;height:30px!important;min-height:30px!important;max-height:30px!important;flex:0 0 30px!important;margin:0!important;transform:none!important;}'+
      '.panel-dot{display:none!important;}'+
      '#v545TitleWrap{display:inline-flex!important;align-items:center!important;gap:3px!important;white-space:nowrap!important;transform:translateX(-8px)!important;}'+
      '#v545Logo{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:44px!important;min-width:44px!important;max-width:44px!important;height:34px!important;flex:0 0 44px!important;overflow:visible!important;}'+
      '#v545Logo img{display:block!important;width:42px!important;height:32px!important;object-fit:contain!important;}'+
      '#v545TitleText{font-weight:900!important;line-height:1!important;white-space:nowrap!important;}';
    doc.head.appendChild(s);
  }

  function installDoc(doc){
    var panel=doc.querySelector('aside[aria-label="English control panel"]');
    if(!panel)return;

    addRuntimeCss(doc);

    var topbar=panel.querySelector('.panel-topbar');
    var title=panel.querySelector('.panel-title');
    if(!topbar || !title)return;

    if(!doc.getElementById('v545TitleWrap')){
      while(title.firstChild)title.removeChild(title.firstChild);

      var wrap=doc.createElement('span');
      wrap.id='v545TitleWrap';

      if(STAR_SRC){
        var logo=doc.createElement('span');
        logo.id='v545Logo';
        var img=doc.createElement('img');
        img.src=STAR_SRC;
        img.alt='نجمة سحر الرقم';
        img.draggable=false;
        logo.appendChild(img);
        wrap.appendChild(logo);
      }

      var label=doc.createElement('span');
      label.id='v545TitleText';
      label.setAttribute('dir','rtl');
      label.textContent='سحر الرقم';
      wrap.appendChild(label);
      title.appendChild(wrap);
    }

    doc.documentElement.dataset.v545RootStable='true';

    if(!installed.has(doc)){
      installed.add(doc);
      try{
        var mo=new doc.defaultView.MutationObserver(function(list){
          var repair=false;
          for(var i=0;i<list.length;i++){
            if(list[i].type==='childList' && !doc.getElementById('v545TitleWrap')){
              repair=true; break;
            }
          }
          if(repair)requestAnimationFrame(function(){installDoc(doc);});
        });
        mo.observe(topbar,{childList:true,subtree:true});
      }catch(e){}
    }
  }

  function scan(){ visit(document,installDoc,0); }

  window.addEventListener('load',scan,true);

  var n=0;
  (function startup(){
    n++;
    scan();
    if(n<120)setTimeout(startup,100);
  }());

  window.__auditV545=function(){
    var count=0;
    visit(document,function(doc){
      if(doc.documentElement && doc.documentElement.dataset.v545RootStable==='true')count++;
    },0);
    return {
      rootSourcePatched:true,
      stablePanels:count,
      permanentStyleIntervals:false,
      buttons:'30x30',
      sourceFile:'kawkabat-panel-base.html'
    };
  };
}());
</script>

    select.style.setProperty('min-width','94px','important');
    select.style.setProperty('max-width','94px','important');
    select.style.setProperty('flex','0 0 94px','important');
    select.style.setProperty('box-sizing','border-box','important');
    select.style.setProperty('margin','0','important');
    select.style.setProperty('padding','0 24px 0 8px','important');
    select.style.setProperty('border','1px solid #7c8992','important');
    select.style.setProperty('border-radius','3px','important');
    select.style.setProperty(
      'background',
      'linear-gradient(180deg,#d5dce1 0%,#c1cad1 42%,#adb7bf 52%,#d0d7dc 100%)',
      'important'
    );
    select.style.setProperty('background-color','#bcc5cc','important');
    select.style.setProperty('color','#24323b','important');
    select.style.setProperty('font-family','Arial,Tahoma,sans-serif','important');
    select.style.setProperty('font-size','11px','important');
    select.style.setProperty('font-weight','800','important');
    select.style.setProperty('line-height','1','important');
    select.style.setProperty('outline','none','important');
    select.style.setProperty('cursor','pointer','important');
    select.style.setProperty('box-shadow','inset 0 1px 0 rgba(255,255,255,.32)','important');
    select.style.setProperty('vertical-align','middle','important');
  }

  function readSaved(){
    try{
      return localStorage.getItem(STORAGE_KEY) || 'BTCUSD';
    }catch(error){
      return 'BTCUSD';
    }
  }

  function writeSaved(value){
    try{ localStorage.setItem(STORAGE_KEY,value); }catch(error){}
  }

  function notifyMarket(doc,value){
    try{
      window.__kawkabatSelectedMarket=value;
      doc.defaultView.__kawkabatSelectedMarket=value;

      var ev=new doc.defaultView.CustomEvent('kawkabat:market-change',{
        detail:{symbol:value}
      });
      doc.dispatchEvent(ev);
    }catch(error){}

    // Keep the visible counter symbol in sync until the live feed updates it.
    try{
      var symbol =
        doc.getElementById('v521Symbol') ||
        doc.querySelector('#v520PriceBadge [data-symbol]') ||
        doc.querySelector('[data-live-symbol]');

      if(symbol) symbol.textContent=value;
    }catch(error){}
  }

  function makeSelect(doc){
    var select=doc.createElement('select');
    select.id='v546MarketSelector';
    select.setAttribute('aria-label','اختيار السوق');
    select.setAttribute('title','اختيار السوق');

    var options=[
      ['XAUUSD','XAUUSD'],
      ['XAGUSD','XAGUSD'],
      ['BTCUSD','BTCUSD'],
      ['TASI','TASI']
    ];

    for(var i=0;i<options.length;i++){
      var opt=doc.createElement('option');
      opt.value=options[i][0];
      opt.textContent=options[i][1];
      select.appendChild(opt);
    }

    var saved=readSaved();
    if(!Array.prototype.some.call(select.options,function(o){return o.value===saved;})){
      saved='BTCUSD';
    }
    select.value=saved;

    styleSelect(select);

    select.addEventListener('change',function(){
      writeSaved(select.value);
      notifyMarket(doc,select.value);
    },true);

    return select;
  }

  function mount(){
    var found=findCounter();
    if(!found)return false;

    var doc=found.doc;
    var counter=found.counter;
    var parent=counter.parentElement;
    if(!parent)return false;

    parent.style.setProperty('display','inline-flex','important');
    parent.style.setProperty('align-items','center','important');
    parent.style.setProperty('gap','0','important');
    parent.style.setProperty('column-gap','0','important');

    var select=doc.getElementById('v546MarketSelector');
    if(!select){
      select=makeSelect(doc);
    }else{
      styleSelect(select);
    }

    /*
      Physical placement requested:
      selector immediately to the LEFT of the price counter.
      In the current toolbar this is achieved by inserting before the counter.
    */
    if(select.parentElement!==parent || select.nextSibling!==counter){
      parent.insertBefore(select,counter);
    }

    notifyMarket(doc,select.value);
    doc.documentElement.dataset.v546MarketSelector='left-of-counter';

    if(!mountedDocs.has(doc)){
      mountedDocs.add(doc);
      try{
        var observer=new doc.defaultView.MutationObserver(function(){
          if(!doc.getElementById('v546MarketSelector') || !counter.isConnected){
            requestAnimationFrame(mount);
          }
        });
        observer.observe(parent,{childList:true,subtree:false});
      }catch(error){}
    }

    return true;
  }

  window.addEventListener('load',mount,true);

  var tries=0;
  (function boot(){
    tries++;
    mount();
    if(tries<180)setTimeout(boot,100);
  }());

  window.__auditV546=function(){
    var found=findCounter();
    var select=found ? found.doc.getElementById('v546MarketSelector') : null;
    return {
      installed:!!mount(),
      selectorFound:!!select,
      selectedMarket:select ? select.value : null,
      position:'left-of-counter',
      size:'94x30'
    };
  };
}());
</script>
<script id="V552_RESTORE_NATIVE_WHEEL_SCROLLBARS">
(function(){
  'use strict';

  var installedDocs = new WeakSet();
  var hookedFrames = new WeakSet();

  function hookFrame(frame){
    if(!frame || hookedFrames.has(frame)) return;
    hookedFrames.add(frame);
    try{
      frame.addEventListener('load', function(){
        setTimeout(scan, 0);
        setTimeout(scan, 120);
      }, true);
    }catch(error){}
  }

  function visit(doc, callback, depth){
    if(!doc || depth > 260) return null;

    var hit = null;
    try{ hit = callback(doc); }catch(error){}
    if(hit) return hit;

    var frames = [];
    try{ frames = doc.querySelectorAll('iframe'); }catch(error){}

    for(var i=0;i<frames.length;i++){
      try{
        hookFrame(frames[i]);
        var found = visit(frames[i].contentDocument, callback, depth + 1);
        if(found) return found;
      }catch(error){}
    }
    return null;
  }

  function installOnWheelDoc(doc){
    var wheel = doc.getElementById('wheel');
    if(!wheel) return false;

    var style = doc.getElementById('v552NativeWheelScrollbarsStyle');
    if(!style){
      style = doc.createElement('style');
      style.id = 'v552NativeWheelScrollbarsStyle';
      style.textContent =
        'html,body{' +
          'overflow:scroll!important;' +
          'overflow-x:scroll!important;' +
          'overflow-y:scroll!important;' +
          'scrollbar-gutter:stable!important;' +
          'scrollbar-width:auto!important;' +
          '-ms-overflow-style:auto!important;' +
          'scroll-behavior:auto!important;' +
        '}' +
        'html::-webkit-scrollbar,body::-webkit-scrollbar{' +
          'display:block!important;' +
          'width:15px!important;' +
          'height:15px!important;' +
        '}';
      doc.head.appendChild(style);
    }

    doc.documentElement.style.setProperty('overflow', 'scroll', 'important');
    doc.documentElement.style.setProperty('overflow-x', 'scroll', 'important');
    doc.documentElement.style.setProperty('overflow-y', 'scroll', 'important');
    doc.documentElement.style.setProperty('scrollbar-gutter', 'stable', 'important');

    if(doc.body){
      doc.body.style.setProperty('overflow', 'scroll', 'important');
      doc.body.style.setProperty('overflow-x', 'scroll', 'important');
      doc.body.style.setProperty('overflow-y', 'scroll', 'important');
      doc.body.style.setProperty('scrollbar-gutter', 'stable', 'important');
    }

    doc.documentElement.dataset.v552WheelScrollbars = 'native-horizontal-and-vertical';

    if(!installedDocs.has(doc)){
      installedDocs.add(doc);
      try{
        var observer = new doc.defaultView.MutationObserver(function(){
          if(!doc.getElementById('v552NativeWheelScrollbarsStyle')){
            requestAnimationFrame(function(){ installOnWheelDoc(doc); });
          }
        });
        observer.observe(doc.documentElement, {childList:true, subtree:true});
      }catch(error){}
    }

    return true;
  }

  function scan(){
    visit(document, function(doc){
      if(doc.getElementById('wheel')){
        installOnWheelDoc(doc);
        return doc;
      }
      return null;
    }, 0);
  }

  window.addEventListener('load', function(){
    scan();
    setTimeout(scan, 120);
    setTimeout(scan, 420);
    setTimeout(scan, 900);
  }, true);

  var tries = 0;
  (function boot(){
    tries++;
    scan();
    if(tries < 120) setTimeout(boot, 100);
  }());

  window.__auditV552 = function(){
    var wheelDoc = visit(document, function(doc){
      return doc.getElementById('wheel') ? doc : null;
    }, 0);

    return {
      installed:true,
      wheelFound:!!wheelDoc,
      horizontalBottomScrollbar:true,
      verticalSideScrollbar:true,
      customAddedBars:false,
      mode:'native wheel document scrollbars'
    };
  };
}());
</script>
</body>
