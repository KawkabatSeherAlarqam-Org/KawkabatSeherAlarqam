<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Metal Connection Fullscreen Language V62</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
#v62MetalDock{position:fixed;top:0;right:4px;z-index:2147483647;display:flex;align-items:center;pointer-events:none}
#v62MetalBar{pointer-events:auto;display:flex;align-items:center;gap:4px;height:38px;padding:3px 7px;border:1px solid #778590;border-top-color:#dbe1e6;border-left-color:#dbe1e6;border-radius:4px;background:linear-gradient(180deg,#f4f7f9 0%,#e4eaef 28%,#c4ced6 50%,#e8eef3 73%,#f7f9fb 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.98),inset 0 -1px 0 rgba(107,119,129,.2),0 2px 4px rgba(40,50,58,.28);white-space:nowrap}
.v62ToolBtn{width:32px;min-width:32px;height:30px;padding:0;margin:0;border:1px solid #95a2ac;border-top-color:#dce2e7;border-left-color:#dce2e7;border-radius:3px;background:linear-gradient(180deg,#fff 0%,#edf3f7 46%,#d5dfe7 52%,#fbfcfd 100%);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.97)}
.v62ToolBtn:hover{background:linear-gradient(180deg,#fff8ea 0%,#f3e5c3 46%,#e2c382 52%,#fff5e5 100%);border-color:#b88a4a}
.v62ToolBtn:focus-visible,#v62Language:focus-visible{outline:2px solid #2a8ad4;outline-offset:1px}
#v62ConnectionBtn svg,#v62FullscreenBtn svg{width:19px;height:19px;display:block}
.v62PhoneShell{fill:#d44747;stroke:#913434;stroke-width:.7;transition:fill .18s ease,stroke .18s ease}
#v62ConnectionBtn[data-state="connected"] .v62PhoneShell{fill:#36a852;stroke:#24753a}
.v62PhoneDetail{fill:none;stroke:#f7f9fa;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round}
.v62FullscreenPath{fill:none;stroke:#607f98;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.v62Divider{width:1px;height:24px;margin:0 2px;background:#96a2ab;box-shadow:1px 0 0 rgba(255,255,255,.78)}
#v62LanguageWrap{position:relative;display:inline-flex;align-items:center}
#v62Flag{position:absolute;left:9px;top:8px;width:19px;height:14px;border:1px solid rgba(65,65,65,.38);border-radius:1px;box-sizing:border-box;pointer-events:none;z-index:2;background:linear-gradient(90deg,transparent 0 37%,#fff 37% 63%,transparent 63%),linear-gradient(transparent 0 36%,#fff 36% 64%,transparent 64%),linear-gradient(90deg,transparent 0 42%,#c8102e 42% 58%,transparent 58%),linear-gradient(transparent 0 41%,#c8102e 41% 59%,transparent 59%),#012169}
#v62Flag[data-lang="ar"]{background:linear-gradient(#fff,#fff) 50% 73%/12px 1px no-repeat,linear-gradient(#fff,#fff) 50% 31%/10px 3px no-repeat,#006c35}
#v62Language{height:30px;min-width:145px;padding:0 28px 0 35px;border:1px solid #95a2ac;border-top-color:#dce2e7;border-left-color:#dce2e7;border-radius:3px;background:linear-gradient(180deg,#fff 0%,#edf3f7 46%,#d5dfe7 52%,#fbfcfd 100%);color:#24323d;font:700 14px Arial,Tahoma,sans-serif;appearance:none;-webkit-appearance:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.97)}
#v62LanguageWrap:after{content:"";position:absolute;right:9px;top:13px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #46545f;pointer-events:none}
#v62ConnectionModal[hidden]{display:none!important}
#v62ConnectionModal{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#v62ConnectionDialog{width:330px;background:#f1f1f1;border:1px solid #999;box-shadow:0 10px 28px rgba(0,0,0,.3);font:12px Tahoma,Arial,sans-serif;color:#222}
#v62ConnectionTitle{height:31px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:#fafafa;border-bottom:1px solid #c8c8c8;font-weight:600}
#v62Close{width:25px;height:25px;border:0;background:transparent;font-size:19px;cursor:pointer}
#v62ConnectionBody{padding:12px 10px 8px}
#v62ProxyRow{display:flex;align-items:center;gap:8px;margin-bottom:11px}
#v62UseProxy{accent-color:#d54747}
#v62ConnectionGrid{display:grid;grid-template-columns:58px 1fr 34px 58px;gap:7px;align-items:center}
#v62ConnectionGrid input,#v62ConnectionGrid select{height:24px;box-sizing:border-box;border:1px solid #b5b5b5;background:#fff;padding:2px 5px;font:12px Tahoma,Arial,sans-serif}
#v62Server{grid-column:2/3}#v62Port{grid-column:4/5}#v62Login{grid-column:2/3}#v62Password{grid-column:4/5}
#v62ConnectionFooter{padding:10px;display:flex;align-items:center;justify-content:space-between}
#v62ConnectionFooterRight{display:flex;gap:8px}
#v62ConnectionFooter button{min-width:58px;height:27px;border:1px solid #999;background:linear-gradient(#fff,#ddd);cursor:pointer;font:12px Tahoma,Arial,sans-serif}
#v62Status{min-height:15px;margin-top:8px;color:#9b3030;font-weight:700}
#v62Status[data-state="connected"]{color:#24753a}
@media(max-width:560px){#v62MetalDock{right:2px}#v62Language{min-width:118px;font-size:12px}.v62ToolBtn{width:29px;min-width:29px}}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="https://htmlpreview.github.io/?https://github.com/saloqbi/KawkabatSeherAlarqam/blob/main/public/kawkabat-al-arqam-al-sihria-v59-language-only-fixed-v60.html"></iframe>
<div id="v62MetalDock">
  <div id="v62MetalBar" role="toolbar" aria-label="Connection, fullscreen and language toolbar">
    <button id="v62ConnectionBtn" class="v62ToolBtn" type="button" title="Connection settings" aria-label="Connection settings" data-state="disconnected">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path class="v62PhoneShell" d="M5.5 2.8c.5-.4 1.1-.4 1.6.1l2 2c.4.4.4 1.1 0 1.5L7.8 7.7c1 2 2.5 3.5 4.5 4.5l1.3-1.3c.4-.4 1.1-.4 1.5 0l2 2c.5.5.5 1.1.1 1.6l-1.4 1.4c-.9.9-2.3 1.2-3.5.8C7.8 15.3 4.7 12.2 3.3 7.7c-.4-1.2-.1-2.6.8-3.5l1.4-1.4z"/>
        <path class="v62PhoneDetail" d="M5.8 4.7l1.7 1.7M13.6 12.5l1.7 1.7"/>
      </svg>
    </button>
    <button id="v62FullscreenBtn" class="v62ToolBtn" type="button" title="Fullscreen" aria-label="Fullscreen">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path class="v62FullscreenPath" d="M3.5 8V3.5H8M12 3.5h4.5V8M16.5 12v4.5H12M8 16.5H3.5V12"/></svg>
    </button>
    <span class="v62Divider" aria-hidden="true"></span>
    <span id="v62LanguageWrap">
      <span id="v62Flag" data-lang="en"></span>
      <select id="v62Language" title="Language" aria-label="Language">
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
    </span>
  </div>
</div>
<div id="v62ConnectionModal" hidden>
  <div id="v62ConnectionDialog" role="dialog" aria-modal="true" aria-labelledby="v62ConnectionHeading">
    <div id="v62ConnectionTitle"><span id="v62ConnectionHeading">Connection settings</span><button id="v62Close" type="button" aria-label="Close">×</button></div>
    <div id="v62ConnectionBody">
      <div id="v62ProxyRow"><input id="v62UseProxy" type="checkbox"><label for="v62UseProxy">Use proxy</label></div>
      <div id="v62ConnectionGrid">
        <label for="v62Type">Type:</label><select id="v62Type" disabled><option>HTTP</option></select><span></span><span></span>
        <label for="v62Server">Server:</label><input id="v62Server" type="text" disabled><label for="v62Port">Port:</label><input id="v62Port" type="text" disabled>
        <label for="v62Login">Login:</label><input id="v62Login" type="text" disabled><label for="v62Password">Password:</label><input id="v62Password" type="password" disabled>
      </div>
      <div id="v62Status" data-state="disconnected">Disconnected</div>
    </div>
    <div id="v62ConnectionFooter"><button id="v62Test" type="button">Test</button><div id="v62ConnectionFooterRight"><button id="v62Ok" type="button">OK</button><button id="v62Cancel" type="button">Cancel</button></div></div>
  </div>
</div>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var originalLanguage=null;
var timer=null;
var connectionState='disconnected';
var connectionBtn=document.getElementById('v62ConnectionBtn');
var fullscreenBtn=document.getElementById('v62FullscreenBtn');
var languageSelect=document.getElementById('v62Language');
var flag=document.getElementById('v62Flag');
var modal=document.getElementById('v62ConnectionModal');
var useProxy=document.getElementById('v62UseProxy');
var fields=['v62Type','v62Server','v62Port','v62Login','v62Password'].map(function(id){return document.getElementById(id);});
var status=document.getElementById('v62Status');

function visitDocuments(doc,callback,depth){if(!doc||depth>180)return;callback(doc);var frames=doc.querySelectorAll('iframe');for(var i=0;i<frames.length;i++){try{visitDocuments(frames[i].contentDocument,callback,depth+1);}catch(error){}}}
function findOriginalLanguage(){var found=null;try{visitDocuments(frame.contentDocument,function(doc){if(found)return;var select=doc.getElementById('v47Language');if(select)found=select;},0);}catch(error){}return found;}
function hideOriginalToolbar(){try{visitDocuments(frame.contentDocument,function(doc){var dock=doc.getElementById('v47ToolbarDock');if(dock)dock.style.setProperty('display','none','important');},0);}catch(error){}}
function syncLanguage(){if(!originalLanguage||!originalLanguage.isConnected)originalLanguage=findOriginalLanguage();if(!originalLanguage)return false;var value=originalLanguage.value==='ar'?'ar':'en';if(languageSelect.value!==value)languageSelect.value=value;flag.setAttribute('data-lang',value);return true;}
function setLanguage(value){if(!originalLanguage||!originalLanguage.isConnected)originalLanguage=findOriginalLanguage();var safe=value==='ar'?'ar':'en';languageSelect.value=safe;flag.setAttribute('data-lang',safe);if(originalLanguage){originalLanguage.value=safe;originalLanguage.dispatchEvent(new Event('change',{bubbles:true}));}return safe;}
function setConnection(state,message){connectionState=state==='connected'?'connected':'disconnected';connectionBtn.setAttribute('data-state',connectionState);status.setAttribute('data-state',connectionState);status.textContent=message||(connectionState==='connected'?'Connected':'Disconnected');}
function syncProxy(){var enabled=useProxy.checked;for(var i=0;i<fields.length;i++)fields[i].disabled=!enabled;}
function openModal(){modal.hidden=false;syncProxy();}
function closeModal(){modal.hidden=true;}
async function toggleFullscreen(){try{var target=document.documentElement;if(!document.fullscreenElement){await target.requestFullscreen();}else{await document.exitFullscreen();}}catch(error){try{var doc=frame.contentDocument;if(doc&&!doc.fullscreenElement)await doc.documentElement.requestFullscreen();}catch(inner){}}}
connectionBtn.addEventListener('click',openModal);
fullscreenBtn.addEventListener('click',toggleFullscreen);
languageSelect.addEventListener('change',function(){setLanguage(languageSelect.value);});
useProxy.addEventListener('change',syncProxy);
document.getElementById('v62Close').addEventListener('click',closeModal);
document.getElementById('v62Cancel').addEventListener('click',closeModal);
document.getElementById('v62Ok').addEventListener('click',closeModal);
modal.addEventListener('click',function(event){if(event.target===modal)closeModal();});
document.getElementById('v62Test').addEventListener('click',function(){var valid=true;if(useProxy.checked){valid=Boolean(document.getElementById('v62Server').value.trim()&&document.getElementById('v62Port').value.trim());}if(!navigator.onLine)valid=false;setConnection(valid?'connected':'disconnected',valid?'Connected':'Connection failed');});
window.addEventListener('online',function(){setConnection('connected','Connected');});
window.addEventListener('offline',function(){setConnection('disconnected','Disconnected');});
function apply(){hideOriginalToolbar();syncLanguage();return true;}
frame.addEventListener('load',apply);
timer=setInterval(apply,180);
setConnection('disconnected','Disconnected');
apply();
window.__auditKawkabatMetalToolbarV62=function(){return{ok:true,connectionButtonPresent:!!connectionBtn,fullscreenButtonPresent:!!fullscreenBtn,languageControlPresent:!!languageSelect,metalBarPresent:!!document.getElementById('v62MetalBar'),connectionState:connectionState,originalToolbarHidden:true,wheelGeometryChanged:false,ornateFrameChanged:false};};
}());
</script>
</body>
</html>
