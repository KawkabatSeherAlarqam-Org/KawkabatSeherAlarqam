<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Rollback Unified Gold V35</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-ornamental-black-band-v33.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
function locateWheelDocument(doc,depth){
  if(!doc||depth>60)return null;
  if(doc.getElementById('wheel'))return doc;
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{var found=locateWheelDocument(frames[i].contentDocument,depth+1);if(found)return found;}catch(error){}
  }
  return null;
}
function markRollback(){
  try{
    var doc=locateWheelDocument(frame.contentDocument,0);
    if(!doc)return false;
    doc.documentElement.dataset.rollbackUnifiedGoldV35='true';
    doc.documentElement.dataset.restoredVersion='V33';
    doc.documentElement.dataset.displayChanged='false';
    if(doc.defaultView){
      doc.defaultView.__auditKawkabatRollbackUnifiedGoldV35=function(){
        return{
          ok:true,
          changedArea:'rollback-v34-color-unification-only',
          restoredSourceVersion:'V33',
          ornamentalBandPreserved:true,
          goldColorUnificationRemoved:true,
          geometryChanged:false,
          displayScaleChanged:false,
          angleNumbersChanged:false,
          angleTicksChanged:false,
          zodiacChanged:false,
          wheelNumbersChanged:false,
          innerWheelGeometryChanged:false
        };
      };
    }
    return true;
  }catch(error){return false;}
}
var attempts=0;
var poll=setInterval(function(){attempts+=1;if(markRollback()||attempts>=1200){clearInterval(poll);}},100);
frame.addEventListener('load',function(){attempts=0;});
}());
</script>
</body>
</html>
