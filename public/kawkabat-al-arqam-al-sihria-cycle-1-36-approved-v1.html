<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Cycle 1 on Wheel 3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading approved structure…</div>
  <script>
  (async function(){
    'use strict';
    var approvedApi='https://api.github.com/repos/saloqbi/KawkabatSeherAlarqam/git/blobs/d9af47f4be4649f4bb687fc937476c40a9b1c54a';
    var wheelUrl='./kawkabat-wheel-direct-controls.html';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(approvedApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('APPROVED_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);
      var closeTag='</scr'+'ipt>';

      html=html.replace('</style>',
        '.work-frame{right:0!important;width:calc(100% - 390px)!important;overflow:hidden!important;outline:none!important}'+
        '.page-scrollbar{right:auto!important;left:375px!important;top:7px!important;bottom:7px!important}'+
        '@media(max-width:950px){.work-frame{left:330px!important;width:calc(100% - 330px)!important}.page-scrollbar{left:315px!important}}'+
        '</style>');

      html=html.replace(
        /<iframe class="work-frame"[^>]*>[\s\S]*?<\/iframe>/,
        '<iframe id="workFrame" class="work-frame" title="Magic Numbers Constellation" tabindex="0" src="'+wheelUrl+'"></iframe>'
      );

      var cycleScript='<script>(function(){'+
        "'use strict';"+
        'var NS="http://www.w3.org/2000/svg",CX=2200,CY=1800,RADIUS=455,tries=0,timer=null;'+
        'function colorClass(value){var mod=value%3;return mod===1?"number-red":mod===2?"number-blue":"number-black";}'+
        'function valid(group){if(!group||group.children.length!==36)return false;for(var i=0;i<36;i+=1){var expected=i===0?36:i,node=group.children[i];if(Number(node.getAttribute("data-wheel"))!==3||Number(node.getAttribute("data-cycle"))!==1||Number(node.getAttribute("data-value"))!==expected||Number(node.textContent)!==expected)return false;}return true;}'+
        'function render(){try{var frame=document.getElementById("workFrame"),doc=frame&&frame.contentDocument,svg=doc&&doc.getElementById("wheel");if(!svg)return false;var group=doc.getElementById("cycleOneWheelThreeNumbers");if(valid(group)){doc.documentElement.dataset.cycleOneWheelThree="true";return true;}if(group)group.remove();group=doc.createElementNS(NS,"g");group.id="cycleOneWheelThreeNumbers";group.setAttribute("aria-label","الدورة رقم 1 من 1 إلى 36 على العجلة رقم 3");for(var index=0;index<36;index+=1){var value=index===0?36:index,angle=(index*10-90)*Math.PI/180,x=CX+Math.cos(angle)*RADIUS,y=CY+Math.sin(angle)*RADIUS,text=doc.createElementNS(NS,"text");text.setAttribute("x",x);text.setAttribute("y",y);text.setAttribute("data-wheel","3");text.setAttribute("data-cycle","1");text.setAttribute("data-value",value);text.setAttribute("class","number-text "+colorClass(value)+(index%9===0?" cardinal-number":""));text.setAttribute("style","font-size:24px;pointer-events:none");text.textContent=value;group.appendChild(text);}var anchor=doc.getElementById("angleFrame");if(anchor&&anchor.parentNode===svg)svg.insertBefore(group,anchor);else svg.appendChild(group);doc.documentElement.dataset.cycleOneWheelThree=valid(group)?"true":"false";return valid(group);}catch(error){return false;}}'+
        'function start(){if(timer)clearInterval(timer);tries=0;render();timer=setInterval(function(){tries+=1;if(render()&&tries>8){clearInterval(timer);timer=null;}else if(tries>=160){clearInterval(timer);timer=null;}},250);}'+
        'var frame=document.getElementById("workFrame");if(frame)frame.addEventListener("load",start);start();'+
        'window.__auditKawkabatCycleOneWheelThree=function(){try{var frame=document.getElementById("workFrame"),doc=frame&&frame.contentDocument,group=doc&&doc.getElementById("cycleOneWheelThreeNumbers");return{ok:valid(group),wheel:3,cycle:1,range:[1,36],numberCount:group?group.children.length:0,radius:RADIUS,cardinalValues:{top:36,right:9,bottom:18,left:27},persistentParentInjection:true};}catch(error){return{ok:false,error:String(error)}}};'+
      '}());'+closeTag;

      html=html.replace('</body>',cycleScript+'</body>');

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load structure: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
