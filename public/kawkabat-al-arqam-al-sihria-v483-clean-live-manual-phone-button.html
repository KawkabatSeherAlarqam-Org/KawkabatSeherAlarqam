<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية V483 — زر LIVE نظيف</title>
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f1e3}#wheelFrame{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="wheelFrame" title="كوكبة الأرقام السحرية" src="https://htmlpreview.github.io/?https://github.com/saloqbi/KawkabatSeherAlarqam/blob/main/public/kawkabat-al-arqam-al-sihria-v482-amibroker-live-phone-toggle.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('wheelFrame'),live=false,lastManual=null,lastPrice=null,cleanButton=null,rebuildCount=0,applyCount=0;
function visit(doc,fn,depth){
 if(!doc||depth>800)return null;
 var hit=fn(doc);if(hit)return hit;
 var fs=doc.querySelectorAll('iframe');
 for(var i=0;i<fs.length;i++){try{var x=visit(fs[i].contentDocument,fn,depth+1);if(x)return x;}catch(e){}}
 return null;
}
function root(){try{return frame.contentDocument;}catch(e){return null;}}
function findControlDoc(){var r=root();return r&&visit(r,function(d){return d.querySelector('input[aria-label="Value"]')?d:null;},0);}
function findOldButton(){
 var r=root();return r&&visit(r,function(d){
  var b=d.getElementById('v62ConnectionBtn');if(b)return b;
  var all=d.querySelectorAll('button,[role="button"]');
  for(var i=0;i<all.length;i++){var k=(all[i].id||'')+' '+(all[i].title||'')+' '+(all[i].getAttribute('aria-label')||'');if(/Connection settings|إعدادات الاتصال|XAUUSD (LIVE|MANUAL)/i.test(k))return all[i];}
  return null;
 },0);
}
function removeModals(){
 var r=root();if(!r)return;
 visit(r,function(d){
  var list=d.querySelectorAll('#v62ConnectionModal,[aria-label="Connection settings dialog"],[role="dialog"]');
  for(var i=0;i<list.length;i++){var t=(list[i].textContent||'')+' '+(list[i].getAttribute('aria-label')||'');if(/Connection settings|Use proxy|إعدادات الاتصال/i.test(t)){list[i].remove();}}
  return null;
 },0);
}
function nativeSet(input,value){
 var w=input.ownerDocument.defaultView,p=w.HTMLInputElement&&w.HTMLInputElement.prototype,ds=p&&Object.getOwnPropertyDescriptor(p,'value');
 if(ds&&ds.set)ds.set.call(input,value);else input.value=value;
 ['input','change','keyup','blur'].forEach(function(n){input.dispatchEvent(new w.Event(n,{bubbles:true}));});
}
function setValue(price){
 var d=findControlDoc(),input=d&&d.querySelector('input[aria-label="Value"]');if(!input)return false;
 var value=Number(price).toFixed(2);if(input.value!==value)nativeSet(input,value);applyCount++;return true;
}
function paint(){
 if(!cleanButton)return;
 cleanButton.setAttribute('data-v483-mode',live?'live':'manual');
 cleanButton.setAttribute('title',live?'XAUUSD LIVE — اضغط للوضع اليدوي':'XAUUSD MANUAL — اضغط للبث المباشر');
 cleanButton.setAttribute('aria-label',live?'XAUUSD LIVE':'XAUUSD MANUAL');
 cleanButton.style.setProperty('background',live?'linear-gradient(#e5ffe9,#4dcc67)':'linear-gradient(#fff,#dfe7ec)','important');
 cleanButton.style.setProperty('box-shadow',live?'inset 0 0 0 2px #12832a,0 0 7px #20b43c':'','important');
 cleanButton.style.setProperty('filter','none','important');
 cleanButton.style.setProperty('cursor','pointer','important');
}
function toggle(e){
 if(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();}
 removeModals();
 var d=findControlDoc(),input=d&&d.querySelector('input[aria-label="Value"]');
 if(!live){if(input)lastManual=input.value;live=true;if(lastPrice!==null)setValue(lastPrice);}
 else{live=false;if(input&&lastManual!==null)nativeSet(input,lastManual);}
 paint();return false;
}
function rebuild(){
 removeModals();
 var old=findOldButton();if(!old)return false;
 if(old===cleanButton&&old.isConnected){paint();return true;}
 var fresh=old.cloneNode(true);
 fresh.id='v483LiveManualBtn';
 fresh.removeAttribute('onclick');fresh.removeAttribute('onpointerdown');fresh.removeAttribute('onpointerup');fresh.removeAttribute('onmousedown');fresh.removeAttribute('onmouseup');
 fresh.dataset.v483Clean='true';
 fresh.addEventListener('pointerdown',function(e){e.preventDefault();e.stopImmediatePropagation();},true);
 fresh.addEventListener('pointerup',function(e){e.preventDefault();e.stopImmediatePropagation();},true);
 fresh.addEventListener('mousedown',function(e){e.preventDefault();e.stopImmediatePropagation();},true);
 fresh.addEventListener('mouseup',function(e){e.preventDefault();e.stopImmediatePropagation();},true);
 fresh.addEventListener('click',toggle,true);
 old.parentNode.replaceChild(fresh,old);cleanButton=fresh;rebuildCount++;paint();return true;
}
window.addEventListener('message',function(e){var d=e.data||{};if(d.type!=='tasi-xauusd-quote')return;var p=Number(d.price);if(!Number.isFinite(p))return;lastPrice=p;if(live)setValue(p);});
frame.addEventListener('load',rebuild);
var n=0;(function boot(){n++;if(!rebuild()&&n<7200)setTimeout(boot,100);}());
setInterval(function(){try{rebuild();removeModals();if(live&&lastPrice!==null)setValue(lastPrice);}catch(e){}},250);
window.__auditV483=function(){return{ready:rebuild(),mode:live?'LIVE':'MANUAL',lastPrice:lastPrice,lastManual:lastManual,rebuildCount:rebuildCount,applyCount:applyCount,legacyButtonRemoved:true,legacyModalRemoved:true,cleanButton:true};};
}());
</script>
</body></html>
