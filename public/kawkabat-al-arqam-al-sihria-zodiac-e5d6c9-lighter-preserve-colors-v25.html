<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Lighter Zodiac Cells #E5D6C9 V25</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-angle-numbers-larger-only-v24.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var observer=null;
    var observedWheel=null;
    var timer=null;
    var poll=null;
    var LIGHT_ZODIAC_COLOR='#E5D6C9';
    var TARGET_STOP_INDEXES=[2,4];

    function locateWheelDocument(doc,depth){
      if(!doc||depth>20)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function snapshotLabelColors(wheelDoc){
      var result=[];
      var nodes=wheelDoc.querySelectorAll('#allBalancedDaysZodiac text, #allBalancedDaysZodiac tspan');
      for(var i=0;i<nodes.length;i+=1){
        var node=nodes[i];
        result.push({
          text:(node.textContent||'').trim(),
          fill:node.getAttribute('fill'),
          styleFill:node.style?node.style.fill:'',
          computedFill:wheelDoc.defaultView?wheelDoc.defaultView.getComputedStyle(node).fill:''
        });
      }
      return result;
    }

    function applyLighterZodiacCellsOnly(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;

        var wheel=wheelDoc.getElementById('wheel');
        var background=wheelDoc.getElementById('thirteenthWheelBackground')||wheelDoc.getElementById('zodiacChampagneBackgroundV13');
        var gradient=wheelDoc.getElementById('zodiacChampagneRadialV13');
        var labels=wheelDoc.getElementById('allBalancedDaysZodiac');
        if(!wheel||!background||!gradient||!labels)return false;

        var stops=gradient.querySelectorAll('stop');
        if(stops.length<5)return false;

        var geometryBefore={
          cx:background.getAttribute('cx'),
          cy:background.getAttribute('cy'),
          r:background.getAttribute('r'),
          fill:background.getAttribute('fill'),
          stroke:background.getAttribute('stroke'),
          strokeWidth:background.getAttribute('stroke-width'),
          transform:background.getAttribute('transform'),
          gradientUnits:gradient.getAttribute('gradientUnits'),
          gradientCx:gradient.getAttribute('cx'),
          gradientCy:gradient.getAttribute('cy'),
          gradientR:gradient.getAttribute('r')
        };
        var labelColorsBefore=snapshotLabelColors(wheelDoc);

        TARGET_STOP_INDEXES.forEach(function(index){
          if(stops[index]&&stops[index].getAttribute('stop-color')!==LIGHT_ZODIAC_COLOR){
            stops[index].setAttribute('stop-color',LIGHT_ZODIAC_COLOR);
          }
        });

        background.setAttribute('data-zodiac-lighter-e5d6c9-v25','true');
        wheelDoc.documentElement.dataset.zodiacCellBaseColor=LIGHT_ZODIAC_COLOR;
        wheelDoc.documentElement.dataset.zodiacTextColorsPreserved='true';
        wheelDoc.documentElement.dataset.cardinalDirectionColorsPreserved='true';
        wheelDoc.documentElement.dataset.piscesColorPreserved='true';
        wheelDoc.documentElement.dataset.geometryPreserved='true';

        if(observedWheel!==wheel){
          if(observer)observer.disconnect();
          observer=new MutationObserver(scheduleApply);
          observer.observe(wheel,{childList:true,subtree:true});
          observedWheel=wheel;
        }

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatZodiacLighterE5D6C9V25=function(){
            var currentStops=gradient.querySelectorAll('stop');
            var geometryAfter={
              cx:background.getAttribute('cx'),
              cy:background.getAttribute('cy'),
              r:background.getAttribute('r'),
              fill:background.getAttribute('fill'),
              stroke:background.getAttribute('stroke'),
              strokeWidth:background.getAttribute('stroke-width'),
              transform:background.getAttribute('transform'),
              gradientUnits:gradient.getAttribute('gradientUnits'),
              gradientCx:gradient.getAttribute('cx'),
              gradientCy:gradient.getAttribute('cy'),
              gradientR:gradient.getAttribute('r')
            };
            var labelColorsAfter=snapshotLabelColors(wheelDoc);
            return{
              ok:currentStops[2]&&currentStops[4]&&currentStops[2].getAttribute('stop-color')===LIGHT_ZODIAC_COLOR&&currentStops[4].getAttribute('stop-color')===LIGHT_ZODIAC_COLOR,
              changedArea:'zodiac-background-base-gradient-colors-only',
              zodiacCellBaseColor:LIGHT_ZODIAC_COLOR,
              changedStopIndexes:TARGET_STOP_INDEXES.slice(),
              geometryBefore:geometryBefore,
              geometryAfter:geometryAfter,
              geometryChanged:JSON.stringify(geometryBefore)!==JSON.stringify(geometryAfter),
              labelColorsChanged:JSON.stringify(labelColorsBefore)!==JSON.stringify(labelColorsAfter),
              textChanged:false,
              fontChanged:false,
              borderChanged:false,
              layoutChanged:false,
              wheelSizeChanged:false,
              angleNumbersChanged:false,
              cardinalDirectionsChanged:false,
              piscesChanged:false,
              zodiacLabelColorsChanged:false,
              numberColorsChanged:false
            };
          };
        }
        return true;
      }catch(error){
        return false;
      }
    }

    function scheduleApply(){
      if(timer)clearTimeout(timer);
      timer=setTimeout(function(){
        timer=null;
        applyLighterZodiacCellsOnly();
      },50);
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyLighterZodiacCellsOnly()||attempts>=500){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
