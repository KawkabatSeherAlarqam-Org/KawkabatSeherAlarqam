<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — View Runtime V3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل Runtime العمل الجديد…</div>
  <script>
  (async function(){
    'use strict';

    var sourceApi='https://api.github.com/repos/saloqbi/KawkabatSeherAlarqam/git/blobs/b45c46e69048f381fce315352e5b5442f0dfe17b';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(sourceApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('VIEW_V2_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);

      html=html.replace('View Runtime V2','View Runtime V3');
      html=html.replace("var modeKey=params.get('view')||'circle24'","var modeKey=params.get('view')||'circle36'");
      html=html.replace(
        "circle24:{label:'Circle of 24',shape:'circle',divisions:24},",
        "circle24:{label:'Circle of 24',shape:'circle',divisions:24},circle36:{label:'Circle of 36',shape:'circle',divisions:36},"
      );
      html=html.replace("var meta=modes[modeKey]||modes.circle24","var meta=modes[modeKey]||modes.circle36");
      html=html.replace(/__auditKawkabatViewRuntimeV2/g,'__auditKawkabatViewRuntimeV3');

      if(html.indexOf("circle36:{label:'Circle of 36'")<0){
        throw new Error('CIRCLE36_MODE_PATCH_FAILED');
      }
      if(html.indexOf("var meta=modes[modeKey]||modes.circle36")<0){
        throw new Error('CIRCLE36_FALLBACK_PATCH_FAILED');
      }

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل Runtime الجديد: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
