<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Cross Document Native Panel Arabic V55</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-v47-live-language-v50.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var timer=null;
var observer=null;
var observedPanel=null;
var applying=false;
var originalText=new WeakMap();
var originalAttr=new WeakMap();
var currentLanguage='en';
var AR={'Default':'الافتراضي','Layout':'التخطيط','Visible':'إظهار','Clockwise':'مع عقارب الساعة','Size':'عدد الحلقات','View':'العرض','Data type':'نوع البيانات','Price':'السعر','Time':'الوقت','Value':'القيمة','Find':'بحث','Increment':'الزيادة','Highlight':'التمييز','Fill':'التعبئة','Levels':'المستويات','Cell':'الخلية','Show marks':'إظهار العلامات','Show numbers':'إظهار الأرقام','Protractor':'المنقلة','Angle':'الزاوية','Counter':'العداد','Secondary scale':'المقياس الثانوي','Start':'البداية','Step':'الخطوة','Radius':'نصف القطر','Font size':'حجم الخط','Divisions':'الأقسام','Marker':'المؤشر','Shape':'الشكل','Triangle':'مثلث','Circle':'دائرة','Square':'مربع','Color':'اللون','Line width':'عرض الخط','Label':'التسمية','Chronometer':'مقياس الزمن','Range':'المدى','Annual':'سنوي','Monthly':'شهري','Weekly':'أسبوعي','Daily':'يومي','Cosmogram':'الخريطة الفلكية','System':'النظام','Geocentric':'مركزي أرضي','Heliocentric':'مركزي شمسي','Location':'الموقع','City':'المدينة','Latitude':'خط العرض','Longitude':'خط الطول','Moon phases':'أطوار القمر','Show eclipses':'إظهار الكسوف والخسوف','Hide':'إخفاء','Show':'إظهار','None':'لا شيء','Today':'اليوم','Date':'التاريخ','Background':'الخلفية','Grid':'الشبكة','Colors':'الألوان','Line':'خط','Dash':'متقطع','Bold line':'خط عريض','Bold dash':'متقطع عريض','North':'شمال','South':'جنوب','East':'شرق','West':'غرب','New York':'نيويورك','Both':'كلاهما','Bull':'صاعد','Bear':'هابط'};
var DIGITS={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
function visitDocs(root,callback,depth){if(!root||depth>180)return;callback(root);var frames=root.querySelectorAll('iframe');for(var i=0;i<frames.length;i++){try{visitDocs(frames[i].contentDocument,callback,depth+1);}catch(error){}}}
function scoreAside(aside){if(!aside||!aside.querySelector('input,select'))return -1;var rect=aside.getBoundingClientRect();if(!rect||rect.width<140||rect.width>520||rect.height<250||rect.left>550)return -1;var text=String(aside.textContent||'');var words=['Default','Layout','Visible','Clockwise','Price','Highlight','Protractor','Counter','Secondary scale'];var score=0;for(var i=0;i<words.length;i++)if(text.indexOf(words[i])!==-1)score++;return score;}
function findPanelAcrossDocuments(){var best=null;var bestScore=-1;try{visitDocs(frame.contentDocument,function(doc){var asides=doc.querySelectorAll('aside');for(var i=0;i<asides.length;i++){var score=scoreAside(asides[i]);if(score>bestScore){bestScore=score;best=asides[i];}}},0);}catch(error){}return bestScore>=4?best:null;}
function findToolbarSelect(){var found=null;try{visitDocs(frame.contentDocument,function(doc){if(found)return;var select=doc.getElementById('v47Language');if(select)found=select;},0);}catch(error){}return found;}
function arabicDigits(value){return String(value||'').replace(/[0-9]/g,function(d){return DIGITS[d];});}
function translate(value){var raw=String(value==null?'':value);var trimmed=raw.trim();if(!trimmed)return raw;var out=AR[trimmed]||trimmed;out=out.replace(/^Circle of\s+(\d+)$/i,function(_,n){return 'دائرة من '+arabicDigits(n)+' قسمًا';});out=out.replace(/\bNorth\b/g,'شمال').replace(/\bSouth\b/g,'جنوب').replace(/\bEast\b/g,'شرق').replace(/\bWest\b/g,'غرب');var lead=(raw.match(/^\s*/)||[''])[0];var tail=(raw.match(/\s*$/)||[''])[0];return lead+out+tail;}
function baseText(node){if(!originalText.has(node))originalText.set(node,node.nodeValue);return originalText.get(node);}
function baseAttr(el,name){var rec=originalAttr.get(el);if(!rec){rec={};originalAttr.set(el,rec);}if(!(name in rec))rec[name]=el.getAttribute(name);return rec[name];}
function applyPanel(panel,lang){if(!panel||applying)return 0;applying=true;var changed=0;try{panel.setAttribute('lang',lang);panel.setAttribute('data-v55-language',lang);var doc=panel.ownerDocument;var walker=doc.createTreeWalker(panel,NodeFilter.SHOW_TEXT);var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(var i=0;i<nodes.length;i++){var node=nodes[i];var parent=node.parentElement;if(!parent||/^(SCRIPT|STYLE|TEXTAREA)$/i.test(parent.tagName))continue;var base=baseText(node);var next=lang==='ar'?translate(base):base;if(node.nodeValue!==next){node.nodeValue=next;changed++;}}var elements=panel.querySelectorAll('[title],[aria-label],[placeholder]');var attrs=['title','aria-label','placeholder'];for(var e=0;e<elements.length;e++){for(var a=0;a<attrs.length;a++){var name=attrs[a];if(!elements[e].hasAttribute(name))continue;var original=baseAttr(elements[e],name);var target=lang==='ar'?translate(original):original;if(target!=null&&elements[e].getAttribute(name)!==target)elements[e].setAttribute(name,target);}}var controls=panel.querySelectorAll('input,select,textarea');for(var c=0;c<controls.length;c++)controls[c].setAttribute('lang',lang);}finally{applying=false;}return changed;}
function ensureObserver(panel){if(observedPanel===panel&&observer)return;if(observer)observer.disconnect();observedPanel=panel;observer=new MutationObserver(function(){if(applying)return;setTimeout(function(){applyPanel(observedPanel,currentLanguage);},0);});observer.observe(panel,{childList:true,subtree:true,characterData:true});}
function readLanguage(){var select=findToolbarSelect();if(select&&(select.value==='ar'||select.value==='en'))return select.value;var result='en';try{visitDocs(frame.contentDocument,function(doc){if(result==='ar')return;try{var v=doc.defaultView.localStorage.getItem('tasi-gannzilla-language-v1');if(v==='ar'||v==='en')result=v;}catch(error){}},0);}catch(error){}return result;}
function sync(){try{var panel=findPanelAcrossDocuments();if(!panel)return false;currentLanguage=readLanguage();ensureObserver(panel);var count=applyPanel(panel,currentLanguage);var view=panel.ownerDocument.defaultView;view.__auditKawkabatCrossDocumentNativePanelArabicV55=function(){return{ok:true,currentLanguage:currentLanguage,panelDocumentFound:true,nativeAsideScore:scoreAside(panel),translatedTextNodeCount:count,crossDocumentSearch:true,mutationObserverActive:!!observer,wheelDigitsHandledBy:'V50',panelGeometryChanged:false,wheelGeometryChanged:false,ornateFrameChanged:false};};return true;}catch(error){return false;}}
function start(){if(timer)clearInterval(timer);timer=setInterval(sync,150);sync();}
frame.addEventListener('load',start);start();
}());
</script>
