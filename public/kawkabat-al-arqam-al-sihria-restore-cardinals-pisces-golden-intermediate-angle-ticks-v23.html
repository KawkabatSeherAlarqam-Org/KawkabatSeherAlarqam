<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — V22 + Golden Intermediate Angle Ticks V23</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-five-degree-clear-golden-v22.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var poll=null;
    var GOLD='#D7B15A';

    function locateWheelDocument(doc,depth){
      if(!doc||depth>28)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function applyGoldenIntermediateTicks(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;

        var angleTicks=wheelDoc.getElementById('angleTicks');
        if(!angleTicks)return false;

        var ticks=angleTicks.querySelectorAll('line.angle-tick');
        if(ticks.length!==360)return false;

        var minorCount=0;
        var fiveDegreeCount=0;

        ticks.forEach(function(tick,index){
          if(index%10===0)return;

          var isFive=index%10===5;
          tick.setAttribute('data-golden-intermediate-angle-tick-v23','true');
          tick.style.setProperty('stroke',GOLD,'important');
          tick.style.setProperty('stroke-width',isFive?'2.55':'1.15','important');
          tick.style.setProperty('opacity',isFive?'1':'0.92','important');
          tick.style.setProperty('stroke-linecap','round','important');
          tick.style.setProperty('vector-effect','non-scaling-stroke','important');

          if(isFive)fiveDegreeCount+=1;
          else minorCount+=1;
        });

        wheelDoc.documentElement.dataset.goldenIntermediateAngleTicksV23='true';
        wheelDoc.documentElement.dataset.goldenIntermediateAngleTickColor=GOLD;
        wheelDoc.documentElement.dataset.goldenMinorTickCount=String(minorCount);
        wheelDoc.documentElement.dataset.goldenFiveDegreeTickCount=String(fiveDegreeCount);
        wheelDoc.documentElement.dataset.angleTickPositionsChanged='false';
        wheelDoc.documentElement.dataset.angleTickLengthsChanged='false';

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatGoldenIntermediateAngleTicksV23=function(){
            return{
              ok:minorCount===288&&fiveDegreeCount===36,
              changedArea:'intermediate-angle-tick-color-and-visual-weight-only',
              goldenColor:GOLD,
              minorTickCount:minorCount,
              fiveDegreeTickCount:fiveDegreeCount,
              minorStrokeWidth:'1.15',
              fiveDegreeStrokeWidth:'2.55',
              positionChanged:false,
              lengthChanged:false,
              angleLabelsChanged:false,
              angleBandChanged:false,
              outerFrameChanged:false,
              zodiacChanged:false,
              wheelNumbersChanged:false,
              valuesChanged:false
            };
          };
        }

        return minorCount===288&&fiveDegreeCount===36;
      }catch(error){
        return false;
      }
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyGoldenIntermediateTicks()||attempts>=1000){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
