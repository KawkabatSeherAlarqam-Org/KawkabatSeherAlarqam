<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — V25 + High Contrast Outward Angle Ticks V26</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="/kawkabat-v209-layer-30.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var poll=null;
    var NS='http://www.w3.org/2000/svg';

    function locateWheelDocument(doc,depth){
      if(!doc||depth>30)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function extendOutward(line,extra){
      var x1=Number(line.getAttribute('x1'));
      var y1=Number(line.getAttribute('y1'));
      var x2=Number(line.getAttribute('x2'));
      var y2=Number(line.getAttribute('y2'));
      if(!Number.isFinite(x1)||!Number.isFinite(y1)||!Number.isFinite(x2)||!Number.isFinite(y2))return;
      var dx=x1-x2;
      var dy=y1-y2;
      var length=Math.sqrt(dx*dx+dy*dy);
      if(!length)return;
      line.setAttribute('x1',(x1+(dx/length)*extra).toFixed(3));
      line.setAttribute('y1',(y1+(dy/length)*extra).toFixed(3));
    }

    function makeVisibleClone(source,index){
      var clone=source.cloneNode(false);
      clone.removeAttribute('style');
      clone.removeAttribute('class');
      clone.setAttribute('class','v26-visible-angle-tick');
      clone.setAttribute('data-v26-index',String(index));
      clone.setAttribute('pointer-events','none');
      clone.setAttribute('stroke','#050403');
      clone.setAttribute('opacity','1');
      clone.setAttribute('stroke-linecap','round');
      clone.setAttribute('vector-effect','non-scaling-stroke');
      clone.setAttribute('shape-rendering','geometricPrecision');

      if(index%10===0){
        clone.setAttribute('stroke-width','5.8');
        extendOutward(clone,16);
      }else if(index%5===0){
        clone.setAttribute('stroke-width','4.8');
        extendOutward(clone,13);
      }else{
        clone.setAttribute('stroke-width','3.6');
        extendOutward(clone,9);
      }
      return clone;
    }

    function applyHighContrastTicks(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;

        var angleTicks=wheelDoc.getElementById('angleTicks');
        var angleLabels=wheelDoc.getElementById('angleLabels');
        if(!angleTicks||!angleLabels)return false;

        var sourceTicks=angleTicks.querySelectorAll('line.angle-tick');
        if(sourceTicks.length!==360)return false;

        var old=wheelDoc.getElementById('v26HighContrastTickOverlay');
        if(old)old.remove();

        var overlay=wheelDoc.createElementNS(NS,'g');
        overlay.setAttribute('id','v26HighContrastTickOverlay');
        overlay.setAttribute('pointer-events','none');

        sourceTicks.forEach(function(tick,index){
          overlay.appendChild(makeVisibleClone(tick,index));
        });

        angleLabels.parentNode.insertBefore(overlay,angleLabels);

        wheelDoc.documentElement.dataset.highContrastOutwardTicksV26='true';
        wheelDoc.documentElement.dataset.v26TickCount='360';
        wheelDoc.documentElement.dataset.v26MajorTenWidth='5.8';
        wheelDoc.documentElement.dataset.v26FiveDegreeWidth='4.8';
        wheelDoc.documentElement.dataset.v26MinorWidth='3.6';
        wheelDoc.documentElement.dataset.v26TickColor='#050403';
        wheelDoc.documentElement.dataset.v26AngleLabelsChanged='false';
        wheelDoc.documentElement.dataset.v26GeometryInsideChanged='false';

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatHighContrastOutwardTicksV26=function(){
            return{
              ok:overlay.children.length===360,
              changedArea:'angle-tick-overlay-only',
              overlayTickCount:overlay.children.length,
              majorTenStrokeWidth:'5.8',
              fiveDegreeStrokeWidth:'4.8',
              minorStrokeWidth:'3.6',
              tickColor:'#050403',
              tenDegreeOutwardExtension:'16px',
              fiveDegreeOutwardExtension:'13px',
              minorOutwardExtension:'9px',
              angleLabelsChanged:false,
              numberPositionsChanged:false,
              zodiacChanged:false,
              wheelNumbersChanged:false,
              innerGeometryChanged:false
            };
          };
        }
        return overlay.children.length===360;
      }catch(error){
        return false;
      }
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyHighContrastTicks()||attempts>=1000){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
