<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Aries 1 to Pisces 36 Numbering V292</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="/kawkabat-v209-layer-03.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var bootTimer=null;
var repairTimer=null;
var observer=null;
var observedGroup=null;
var NS='http://www.w3.org/2000/svg';
var days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
var zodiac=['نار الحمل','تراب الثور','هواء الجوزاء','ماء السرطان','نار الأسد','تراب السنبلة','هواء الميزان','ماء العقرب','نار القوس','تراب الجدي','هواء الدلو','ماء الحوت'];

function visit(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}
  }
}

function findReadyWheelDocument(){
  var found=null;
  try{
    visit(frame.contentDocument,function(doc){
      if(found)return;
      var group=doc.getElementById('allBalancedDaysZodiac');
      if(!group||group.querySelectorAll('.day-zodiac-cell').length!==36)return;
      if(!doc.documentElement.dataset.v50LiveLanguage)return;
      found=doc;
    },0);
  }catch(error){}
  return found;
}

function line(doc,x,y,value,size,weight,role){
  var node=doc.createElementNS(NS,'tspan');
  node.setAttribute('x',String(x));
  node.setAttribute('y',String(y));
  node.setAttribute('data-v81-line',role);
  node.style.setProperty('font-size',size+'px','important');
  node.style.setProperty('font-weight',String(weight),'important');
  node.textContent=value;
  return node;
}

function dayNameAt(index){
  return index===0?'الجمعة':days[(index-1)%days.length];
}

function dayLabelAt(index){
  return String(index===0?36:index)+' '+dayNameAt(index);
}

function zodiacAt(index){
  return index===0?'ماء الحوت':zodiac[(index-1)%12];
}

function correct(group){
  if(!group)return false;
  var cells=group.querySelectorAll('.day-zodiac-cell');
  if(cells.length!==36)return false;
  for(var i=0;i<cells.length;i+=1){
    var text=cells[i].querySelector('text');
    if(!text)return false;
    var day=text.querySelectorAll('tspan[data-v81-line="day"]');
    var sign=text.querySelectorAll('tspan[data-v81-line="element-zodiac"]');
    if(day.length!==1||sign.length!==1)return false;
    if(day[0].getAttribute('y')!=='-18'||sign[0].getAttribute('y')!=='18')return false;
    if(String(day[0].textContent||'').trim()!==dayLabelAt(i))return false;
    if(String(sign[0].textContent||'').trim()!==zodiacAt(i))return false;
  }
  return true;
}

function repair(doc){
  var group=doc.getElementById('allBalancedDaysZodiac');
  if(!group||group.querySelectorAll('.day-zodiac-cell').length!==36)return false;
  if(correct(group))return true;
  var cells=group.querySelectorAll('.day-zodiac-cell');
  for(var index=0;index<36;index+=1){
    var text=cells[index].querySelector('text');
    if(!text)continue;
    var day=dayLabelAt(index);
    var sign=zodiacAt(index);
    var x=Number(text.getAttribute('x'))||0;
    while(text.firstChild)text.removeChild(text.firstChild);
    text.setAttribute('direction','rtl');
    text.setAttribute('unicode-bidi','plaintext');
    text.setAttribute('text-anchor','middle');
    text.style.setProperty('font-family','Arial, Tahoma, sans-serif','important');
    text.style.setProperty('pointer-events','none','important');
    text.appendChild(line(doc,x,-18,day,26,700,'day'));
    text.appendChild(line(doc,x,18,sign,29,800,'element-zodiac'));
    cells[index].dataset.v292NumberedDay='aries-1-pisces-36';
  }
  doc.documentElement.dataset.v292NumberedDays='aries-1-pisces-36';
  return correct(group);
}

function scheduleRepair(doc){
  if(repairTimer)clearTimeout(repairTimer);
  repairTimer=setTimeout(function(){
    repairTimer=null;
    repair(doc);
  },30);
}

function install(){
  var doc=findReadyWheelDocument();
  if(!doc)return false;
  var group=doc.getElementById('allBalancedDaysZodiac');
  repair(doc);
  if(observedGroup!==group){
    if(observer)observer.disconnect();
    observer=new doc.defaultView.MutationObserver(function(){
      if(!correct(group))scheduleRepair(doc);
    });
    observer.observe(group,{childList:true,subtree:true});
    observedGroup=group;
  }
  if(doc.documentElement.dataset.v81LanguageListener!=='true'){
    doc.documentElement.dataset.v81LanguageListener='true';
    doc.defaultView.addEventListener('gannzilla:language-change',function(){
      scheduleRepair(doc);
    });
  }
  doc.defaultView.__auditKawkabatPersistentTwoLineZodiacV81=function(){
    return{
      ok:correct(group),
      sourceVersion:'V292-aries-1-pisces-36',
      languageLayerReady:!!doc.documentElement.dataset.v50LiveLanguage,
      dayLineCount:group.querySelectorAll('tspan[data-v81-line="day"]').length,
      elementZodiacLineCount:group.querySelectorAll('tspan[data-v81-line="element-zodiac"]').length,
      dayAbove:true,
      elementAndZodiacBelow:true,
      persistentAfterLanguageChange:true,
      cellGeometryChanged:false,
      wheelGeometryChanged:false,
      ornateFrameChanged:false,
      panelJitterFixPreserved:true
    };
  };
  return correct(group);
}

function start(){
  if(bootTimer)clearTimeout(bootTimer);
  var attempts=0;
  function boot(){
    attempts+=1;
    if(install()||attempts>=240){
      bootTimer=null;
      return;
    }
    bootTimer=setTimeout(boot,100);
  }
  boot();
}

frame.addEventListener('load',start);
start();
}());
</script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
