<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Native Panel Arabic V54</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-v47-live-language-v50.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var timer=null;
var observer=null;
var observedPanel=null;
var applying=false;
var currentLanguage='en';
var originalText=new WeakMap();
var originalAttributes=new WeakMap();
var AR={'Default':'الافتراضي','Layout':'التخطيط','Visible':'إظهار','Clockwise':'مع عقارب الساعة','Size':'عدد الحلقات','View':'العرض','Data type':'نوع البيانات','Price':'السعر','Time':'الوقت','Value':'القيمة','Find':'بحث','Increment':'الزيادة','Highlight':'التمييز','Fill':'التعبئة','Levels':'المستويات','Cell':'الخلية','Show marks':'إظهار العلامات','Show numbers':'إظهار الأرقام','Protractor':'المنقلة','Angle':'الزاوية','Counter':'العداد','Secondary scale':'المقياس الثانوي','Start':'البداية','Step':'الخطوة','Radius':'نصف القطر','Font size':'حجم الخط','Divisions':'الأقسام','Marker':'المؤشر','Shape':'الشكل','Triangle':'مثلث','Circle':'دائرة','Square':'مربع','Color':'اللون','Line width':'عرض الخط','Label':'التسمية','Chronometer':'مقياس الزمن','Range':'المدى','Annual':'سنوي','Monthly':'شهري','Weekly':'أسبوعي','Daily':'يومي','Cosmogram':'الخريطة الفلكية','System':'النظام','Geocentric':'مركزي أرضي','Heliocentric':'مركزي شمسي','Location':'الموقع','City':'المدينة','Latitude':'خط العرض','Longitude':'خط الطول','Moon phases':'أطوار القمر','Show eclipses':'إظهار الكسوف والخسوف','Hide':'إخفاء','Show':'إظهار','None':'لا شيء','Today':'اليوم','Date':'التاريخ','Background':'الخلفية','Grid':'الشبكة','Colors':'الألوان','Line':'خط','Dash':'متقطع','Bold line':'خط عريض','Bold dash':'متقطع عريض','North':'شمال','South':'جنوب','East':'شرق','West':'غرب','New York':'نيويورك','Both':'كلاهما','Bull':'صاعد','Bear':'هابط'};
var DIGITS={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
function locate(doc,depth,test){if(!doc||depth>180)return null;if(test(doc))return doc;var frames=doc.querySelectorAll('iframe');for(var i=0;i<frames.length;i+=1){try{var found=locate(frames[i].contentDocument,depth+1,test);if(found)return found;}catch(error){}}return null;}
function wheelDocument(){return locate(frame.contentDocument,0,function(doc){return !!doc.getElementById('wheel');});}
function toolbarDocument(){return locate(frame.contentDocument,0,function(doc){return !!doc.getElementById('v47Language');});}
function scoreAside(aside){if(!aside||!aside.querySelector('input,select'))return -1;var rect=aside.getBoundingClientRect();if(!rect||rect.width<140||rect.width>520||rect.height<250||rect.left>520)return -1;var text=String(aside.textContent||'');var words=['Default','Layout','Visible','Clockwise','Price','Highlight','Protractor','Counter','Secondary scale'];var score=0;for(var i=0;i<words.length;i++)if(text.indexOf(words[i])!==-1)score+=1;return score;}
function nativePanel(doc){var asides=Array.prototype.slice.call(doc.querySelectorAll('aside'));var best=null;var bestScore=-1;for(var i=0;i<asides.length;i++){var score=scoreAside(asides[i]);if(score>bestScore){bestScore=score;best=asides[i];}}return bestScore>=4?best:null;}
function arabicDigits(value){return String(value||'').replace(/[0-9]/g,function(d){return DIGITS[d];});}
function translateValue(value){var raw=String(value==null?'':value);var trimmed=raw.trim();if(!trimmed)return raw;var translated=AR[trimmed]||trimmed;translated=translated.replace(/^Circle of\s+(\d+)$/i,function(_,n){return 'دائرة من '+arabicDigits(n)+' قسمًا';});translated=translated.replace(/\bNorth\b/g,'شمال').replace(/\bSouth\b/g,'جنوب').replace(/\bEast\b/g,'شرق').replace(/\bWest\b/g,'غرب');var lead=(raw.match(/^\s*/)||[''])[0];var tail=(raw.match(/\s*$/)||[''])[0];return lead+translated+tail;}
function rememberText(node){if(!originalText.has(node))originalText.set(node,node.nodeValue);return originalText.get(node);}
function rememberAttribute(element,name){var record=originalAttributes.get(element);if(!record){record={};originalAttributes.set(element,record);}if(!(name in record))record[name]=element.getAttribute(name);return record[name];}
function applyPanel(panel,lang){if(!panel||applying)return 0;applying=true;var changed=0;try{panel.setAttribute('data-v54-language',lang);panel.setAttribute('lang',lang);var walker=panel.ownerDocument.createTreeWalker(panel,NodeFilter.SHOW_TEXT);var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(var i=0;i<nodes.length;i++){var node=nodes[i];var parent=node.parentElement;if(!parent||/^(SCRIPT|STYLE|TEXTAREA)$/i.test(parent.tagName))continue;var base=rememberText(node);var next=lang==='ar'?translateValue(base):base;if(node.nodeValue!==next){node.nodeValue=next;changed+=1;}}var attrs=['title','aria-label','placeholder'];var elements=panel.querySelectorAll('[title],[aria-label],[placeholder]');for(var e=0;e<elements.length;e++){for(var a=0;a<attrs.length;a++){var name=attrs[a];if(!elements[e].hasAttribute(name))continue;var original=rememberAttribute(elements[e],name);var target=lang==='ar'?translateValue(original):original;if(target!=null&&elements[e].getAttribute(name)!==target)elements[e].setAttribute(name,target);}}var controls=panel.querySelectorAll('input,select,textarea');for(var c=0;c<controls.length;c++)controls[c].setAttribute('lang',lang);}finally{applying=false;}return changed;}
function ensureObserver(panel){if(observedPanel===panel&&observer)return;if(observer)observer.disconnect();observedPanel=panel;observer=new MutationObserver(function(){if(applying)return;setTimeout(function(){applyPanel(observedPanel,currentLanguage);},0);});observer.observe(panel,{childList:true,subtree:true,characterData:true});}
function readLanguage(wdoc,tdoc){var select=tdoc&&tdoc.getElementById('v47Language');if(select&&(select.value==='ar'||select.value==='en'))return select.value;try{var stored=wdoc.defaultView.localStorage.getItem('tasi-gannzilla-language-v1');if(stored==='ar'||stored==='en')return stored;}catch(error){}return 'en';}
function sync(){try{var wdoc=wheelDocument();var tdoc=toolbarDocument();if(!wdoc||!tdoc)return false;var panel=nativePanel(wdoc);if(!panel)return false;currentLanguage=readLanguage(wdoc,tdoc);ensureObserver(panel);var count=applyPanel(panel,currentLanguage);try{wdoc.defaultView.__auditKawkabatNativePanelArabicV54=function(){return{ok:true,currentLanguage:currentLanguage,nativeAsideFound:true,nativeAsideScore:scoreAside(panel),translatedTextNodeCount:count,mutationObserverActive:!!observer,wheelDigitsHandledBy:'V50',panelGeometryChanged:false,wheelGeometryChanged:false,ornateFrameChanged:false};};}catch(error){}return true;}catch(error){return false;}}
function start(){if(timer)clearInterval(timer);timer=setInterval(sync,150);sync();}
frame.addEventListener('load',start);start();
}());
</script>
