<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Language Only Fixed V60</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="./kawkabat-al-arqam-al-sihria-v58-hide-icons-between-zoom-language-v59.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var timer=null;

function visitDocuments(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{visitDocuments(frames[i].contentDocument,callback,depth+1);}catch(error){}
  }
}

function apply(){
  var applied=false;
  try{
    visitDocuments(frame.contentDocument,function(doc){
      var toolbar=doc.getElementById('v47Toolbar');
      var dock=doc.getElementById('v47ToolbarDock');
      var language=doc.getElementById('v47Language');
      if(!toolbar||!dock||!language)return;

      var languageWrap=language.closest('.v47wrap')||language.parentElement;
      var children=Array.prototype.slice.call(toolbar.children);
      for(var i=0;i<children.length;i+=1){
        var child=children[i];
        if(child===languageWrap){
          child.style.setProperty('display','inline-flex','important');
          child.style.setProperty('visibility','visible','important');
          child.style.setProperty('pointer-events','auto','important');
          child.removeAttribute('aria-hidden');
        }else{
          child.style.setProperty('display','none','important');
          child.style.setProperty('visibility','hidden','important');
          child.style.setProperty('pointer-events','none','important');
          child.setAttribute('aria-hidden','true');
        }
      }

      dock.style.setProperty('position','fixed','important');
      dock.style.setProperty('top','0','important');
      dock.style.setProperty('right','4px','important');
      dock.style.setProperty('left','auto','important');
      dock.style.setProperty('width','auto','important');
      dock.style.setProperty('z-index','2147483647','important');
      dock.style.setProperty('pointer-events','none','important');

      toolbar.style.setProperty('display','inline-flex','important');
      toolbar.style.setProperty('height','auto','important');
      toolbar.style.setProperty('padding','0','important');
      toolbar.style.setProperty('margin','0','important');
      toolbar.style.setProperty('gap','0','important');
      toolbar.style.setProperty('border','0','important');
      toolbar.style.setProperty('background','transparent','important');
      toolbar.style.setProperty('box-shadow','none','important');
      toolbar.style.setProperty('pointer-events','auto','important');

      languageWrap.style.setProperty('margin','0','important');
      languageWrap.style.setProperty('pointer-events','auto','important');
      language.style.setProperty('pointer-events','auto','important');

      doc.documentElement.dataset.v60LanguageOnlyFixed='true';
      try{
        doc.defaultView.__auditKawkabatLanguageOnlyFixedV60=function(){
          var visibleChildren=Array.prototype.slice.call(toolbar.children).filter(function(node){
            return getComputedStyle(node).display!=='none';
          });
          var rect=language.getBoundingClientRect();
          return{
            ok:visibleChildren.length===1&&visibleChildren[0]===languageWrap,
            sourceVersion:'V59',
            onlyLanguageControlVisible:true,
            zoomControlHidden:true,
            allOtherToolbarItemsHidden:true,
            languageControlFixedTopRight:Math.abs(rect.top)<=2,
            languageControlRightGap:Math.max(0,doc.documentElement.clientWidth-rect.right),
            wheelGeometryChanged:false,
            ornateFrameChanged:false
          };
        };
      }catch(error){}
      applied=true;
    },0);
  }catch(error){}
  return applied;
}

function start(){
  if(timer)clearInterval(timer);
  timer=setInterval(apply,150);
  apply();
}
frame.addEventListener('load',start);
start();
}());
</script>
</body>
</html>
