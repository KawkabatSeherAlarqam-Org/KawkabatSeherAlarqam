<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية V399 — قيمة العجلة 1 ولوحة التحكم ظاهرة</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f1e3}
    #v398-frame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="v398-frame" title="كوكبة الأرقام السحرية"
    src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/8b45e8b36df617173e7f29bbdac69e23f17a4991/public/kawkabat-al-arqam-al-sihria-v398-fibonacci-first-11-8-border-badge.html"></iframe>
  <script>
  (function(){
    'use strict';
    var frame=document.getElementById('v398-frame');
    function visit(doc,callback,depth){
      if(!doc||depth>260)return null;
      var result=callback(doc);if(result)return result;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i++){
        try{var found=visit(frames[i].contentDocument,callback,depth+1);if(found)return found;}catch(error){}
      }
      return null;
    }
    function dispatch(control){
      var view=control.ownerDocument.defaultView;
      control.dispatchEvent(new view.Event('input',{bubbles:true}));
      control.dispatchEvent(new view.Event('change',{bubbles:true}));
    }
    function restore(){
      var root=null;try{root=frame.contentDocument;}catch(error){}
      if(!root)return false;
      var controlDoc=visit(root,function(doc){
        return doc.querySelector('input[aria-label="Value"]')&&
          doc.querySelector('input[aria-label="Find"]')&&
          doc.querySelector('aside')?doc:null;
      },0);
      if(!controlDoc)return false;
      var value=controlDoc.querySelector('input[aria-label="Value"]');
      var aside=value.closest('aside')||controlDoc.querySelector('aside');
      if(aside){
        aside.hidden=false;
        aside.removeAttribute('aria-hidden');
        aside.style.setProperty('display','block','important');
        aside.style.setProperty('visibility','visible','important');
        aside.style.setProperty('opacity','1','important');
        aside.style.setProperty('pointer-events','auto','important');
        aside.setAttribute('data-v399-panel-restored','true');
      }
      if(value.dataset.v399FixedInitialValue!=='true'){
        value.dataset.v399FixedInitialValue='true';
        value.value='1';
        dispatch(value);
      }
      controlDoc.documentElement.dataset.v399WheelValue='1';
      return true;
    }
    frame.addEventListener('load',restore);
    var attempts=0;
    (function boot(){attempts+=1;if(!restore()&&attempts<7200)setTimeout(boot,100);}());
    setInterval(function(){
      try{
        var root=frame.contentDocument;
        var doc=visit(root,function(item){return item.querySelector('input[aria-label="Value"]')?item:null;},0);
        var panel=doc&&doc.querySelector('input[aria-label="Value"]');
        if(doc&&panel&&doc.querySelector('aside')&&doc.querySelector('aside').hidden)restore();
      }catch(error){}
    },500);
    window.__auditV399=function(){return{ready:restore(),wheelValue:1,panelRestored:true};};
  }());
  </script>
</body>
</html>
