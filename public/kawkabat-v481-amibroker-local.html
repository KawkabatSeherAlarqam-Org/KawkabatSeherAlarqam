 confluence:$("kaConfluenceValue"),range:$("kaRange")
};

function fmt(v){return Number.isFinite(Number(v))?Number(v).toFixed(2):"--.--";}
function signed(v){if(!Number.isFinite(Number(v)))return"--";v=Number(v);return(v>=0?"+":"")+v.toFixed(2);}
function visit(doc,callback,depth){
  if(!doc||depth>700)return null;
  var r=null;try{r=callback(doc);}catch(e){}
  if(r)return r;
  var frames=[];try{frames=doc.querySelectorAll("iframe");}catch(e){return null;}
  for(var i=0;i<frames.length;i++){
    try{var found=visit(frames[i].contentDocument,callback,depth+1);if(found)return found;}catch(e){}
  }
  return null;
}
function root(){try{return host&&host.contentDocument;}catch(e){return null;}}
function wheelDoc(){
  var r=root();return r&&visit(r,function(doc){
    return doc.getElementById("wheel")&&doc.querySelector(".approved-cycle-number")?doc:null;
  },0);
}
function numberFromNode(node){
  var vals=[node.getAttribute("data-v131-display-value"),node.getAttribute("data-value"),node.getAttribute("data-tick")];
  var primary=node.querySelector&&node.querySelector('tspan[data-v131-number-role="primary"]');
  if(primary)vals.push(primary.textContent);
  vals.push(node.textContent);
  for(var i=0;i<vals.length;i++){
    var n=Number(String(vals[i]==null?"":vals[i]).replace(/,/g,"").trim());
    if(Number.isFinite(n))return n;
  }
  return null;
}
function findCell(doc,target){
  var nodes=doc.querySelectorAll(".approved-cycle-number"),best=null,bestDiff=Infinity;
  for(var i=0;i<nodes.length;i++){
    var n=numberFromNode(nodes[i]);if(n===null)continue;
    var diff=Math.abs(n-target);
    if(diff<bestDiff){bestDiff=diff;best=nodes[i];}
    if(diff<1e-7)return nodes[i];
  }
  return bestDiff<=1.01?best:null;
}
function setVisible(next){
  visible=!!next;
  panel.hidden=!visible;
  try{localStorage.setItem("kawkabat-live-analysis-visible",visible?"true":"false");}catch(e){}
  syncButton();
  if(visible&&lastAnalysis)paintAnalysis(lastAnalysis);
  if(!visible)clearAnalysisPaint();
}
function syncButton(){
  if(toolbarButton){
    toolbarButton.dataset.active=visible?"true":"false";
    toolbarButton.setAttribute("aria-pressed",String(visible));
    toolbarButton.title=visible?"إخفاء التحليل الحي":"إظهار التحليل الحي";
    toolbarButton.style.setProperty("outline",visible?"2px solid #8a2be2":"none","important");
    toolbarButton.style.setProperty("box-shadow",visible?"0 0 7px #8a2be2":"none","important");
  }
  fallbackBtn.dataset.active=visible?"true":"false";
}
function installToolbarButton(){
  var r=root();if(!r)return false;
  var info=visit(r,function(doc){
    var eye=doc.getElementById("v66WheelBtn");
    if(eye&&eye.parentNode)return{doc:doc,eye:eye};
    var pencil=doc.getElementById("v64PencilBtn");
    if(pencil&&pencil.parentNode)return{doc:doc,eye:pencil};
    return null;
  },0);
  if(!info)return false;
  var doc=info.doc,anchor=info.eye;
  var btn=doc.getElementById("kawkabatLiveAnalysisToolbarBtn");
  if(!btn){
    btn=anchor.cloneNode(false);
    btn.id="kawkabatLiveAnalysisToolbarBtn";
    btn.type="button";btn.removeAttribute("onclick");
    btn.innerHTML='<svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><rect x="3" y="12" width="4" height="8" rx="1" fill="#17a34a"/><rect x="10" y="7" width="4" height="13" rx="1" fill="#f0b429"/><rect x="17" y="3" width="4" height="17" rx="1" fill="#8b5cf6"/><path d="M3 5.5h18" stroke="#315a78" stroke-width="1.3"/></svg>';
    btn.setAttribute("aria-label","التحليل الحي");
    btn.style.setProperty("cursor","pointer","important");
    btn.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();setVisible(!visible);});
    anchor.parentNode.insertBefore(btn,anchor);
  }
  toolbarButton=btn;
  fallbackBtn.style.display="none";
  syncButton();
  return true;
}
function ensureButton(){
  if(!installToolbarButton()){
    fallbackBtn.style.display="flex";
    syncButton();
  }
}
function getSymbolState(symbol,price,data){
  symbol=String(symbol||"SYMBOL").toUpperCase();
  var s=stateBySymbol[symbol];
  if(!s){
    s=stateBySymbol[symbol]={anchor:price,high:price,low:price,startedAt:Date.now()};
  }
  if(Number.isFinite(Number(data&&data.high)))s.high=Number(data.high); else s.high=Math.max(s.high,price);
  if(Number.isFinite(Number(data&&data.low)))s.low=Number(data.low); else s.low=Math.min(s.low,price);
  return s;
}
function nextResistance(price,anchor){
  var k=Math.floor((price-anchor)/STEP)+1;
  var level=anchor+k*STEP;
  if(level<=price+0.004)level+=STEP;
  return level;
}
function nextSupport(price,anchor){
  var k=Math.ceil((price-anchor)/STEP)-1;
  var level=anchor+k*STEP;
  if(level>=price-0.004)level-=STEP;
  return level;
}
function nearestFib(price,high,low){
  if(!(Number.isFinite(high)&&Number.isFinite(low))||high-low<0.02)return null;
  var ratios=[23.6,38.2,50,61.8,78.6],range=high-low,best=null;
  ratios.forEach(function(r){
    var value=low+range*(r/100),diff=Math.abs(value-price);
    if(!best||diff<best.diff)best={value:value,ratio:r,diff:diff};
  });
  return best;
}
function analyze(data){
  var price=Number(data.price),symbol=String(data.symbol||"SYMBOL").toUpperCase();
  if(!Number.isFinite(price))return null;
  var s=getSymbolState(symbol,price,data);
  var resistance=nextResistance(price,s.anchor);
  var support=nextSupport(price,s.anchor);
  var main=s.anchor;
  var fib=nearestFib(price,s.high,s.low);
  var confluence=null,candidates=[
    {name:"مقاومة",value:resistance},
    {name:"دعم",value:support},
    {name:"رئيسي",value:main}
  ];
  if(fib){
    var threshold=Math.max(0.25,STEP*0.18),best=null;
    candidates.forEach(function(c){
      var d=Math.abs(c.value-fib.value);
      if(d<=threshold&&(!best||d<best.d))best={d:d,a:c.value,b:fib.value,name:c.name};
    });
    if(best)confluence={from:Math.min(best.a,best.b),to:Math.max(best.a,best.b),name:best.name+" + Fib "+fib.ratio+"%"};
  }
  return{
    symbol:symbol,price:price,direction:String(data.direction||"FLAT").toUpperCase(),
    anchor:s.anchor,resistance:resistance,support:support,main:main,
    fib:fib,high:s.high,low:s.low,confluence:confluence
  };
}
function render(a){
  if(!a)return;
  el.price.textContent=fmt(a.price);
  el.direction.textContent=a.direction==="UP"?"▲ LIVE UP":a.direction==="DOWN"?"▼ LIVE DOWN":"• LIVE";
  el.direction.style.color=a.direction==="UP"?"#45d66c":a.direction==="DOWN"?"#ff5c5c":"#ffd052";
  el.resistance.textContent=fmt(a.resistance);el.resistanceDist.textContent=signed(a.resistance-a.price);
  el.support.textContent=fmt(a.support);el.supportDist.textContent=signed(a.support-a.price);
  el.main.textContent=fmt(a.main);el.mainDist.textContent=signed(a.main-a.price);
  if(a.fib){el.fib.textContent=fmt(a.fib.value);el.fibRatio.textContent="("+a.fib.ratio+"%) "+signed(a.fib.value-a.price);}
  else{el.fib.textContent="--.--";el.fibRatio.textContent="بانتظار نطاق High/Low";}
  el.range.textContent="H "+fmt(a.high)+" / L "+fmt(a.low);
  el.confluence.textContent=a.confluence?fmt(a.confluence.from)+" – "+fmt(a.confluence.to)+"  ("+a.confluence.name+")":"لا يوجد تطابق قوي بعد";
}
function clearAnalysisPaint(){
  var doc=wheelDoc();if(!doc)return;
  var old=doc.getElementById("kawkabatLiveAnalysisOverlay");if(old)old.remove();
}
function paintAnalysis(a){
  if(!visible||!a)return;
  var doc=wheelDoc();if(!doc)return;
  clearAnalysisPaint();
  var svg=doc.getElementById("wheel");if(!svg)return;
  var ns="http://www.w3.org/2000/svg";
  var group=doc.createElementNS(ns,"g");group.id="kawkabatLiveAnalysisOverlay";group.setAttribute("pointer-events","none");
  var specs=[
    {key:"resistance",label:"R",color:"#22c55e"},
    {key:"support",label:"S",color:"#ef4444"},
    {key:"main",label:"M",color:"#f4b91f"}
  ];
  if(a.fib)specs.push({key:"fib",value:a.fib.value,label:"F",color:"#a855f7"});
  specs.forEach(function(spec){
    var value=spec.value!=null?spec.value:a[spec.key];
    var target=Math.round(value),node=findCell(doc,target);if(!node)return;
    var x=Number(node.getAttribute("x")),y=Number(node.getAttribute("y"));
    if(!Number.isFinite(x)||!Number.isFinite(y))return;
    var circle=doc.createElementNS(ns,"circle");
    circle.setAttribute("cx",x);circle.setAttribute("cy",y);circle.setAttribute("r","27");
    circle.setAttribute("fill",spec.color);circle.setAttribute("fill-opacity","0.14");
    circle.setAttribute("stroke",spec.color);circle.setAttribute("stroke-width","5");
    circle.setAttribute("vector-effect","non-scaling-stroke");
    var tag=doc.createElementNS(ns,"text");
    tag.setAttribute("x",x+24);tag.setAttribute("y",y-24);tag.setAttribute("text-anchor","middle");
    tag.setAttribute("fill",spec.color);tag.setAttribute("stroke","#fff");tag.setAttribute("stroke-width","1.4");
    tag.setAttribute("paint-order","stroke fill");tag.setAttribute("font-family","Arial");tag.setAttribute("font-size","17");
    tag.setAttribute("font-weight","900");tag.textContent=spec.label;
    group.appendChild(circle);group.appendChild(tag);
  });
  svg.appendChild(group);
}
function applyLiveAnalysis(data){
  var a=analyze(data);if(!a)return;
  lastAnalysis=a;render(a);if(visible)paintAnalysis(a);
}
var previousApply=window.__kawkabatApplyLiveQuote;
window.__kawkabatApplyLiveQuote=function(data){
  var result=true;
  try{if(previousApply)result=previousApply(data);}catch(e){}
  try{applyLiveAnalysis(data);}catch(e){}
  return result;
};
closeBtn.addEventListener("click",function(){setVisible(false);});
fallbackBtn.addEventListener("click",function(){setVisible(!visible);});
host&&host.addEventListener("load",function(){
  setTimeout(ensureButton,400);setTimeout(ensureButton,1200);setTimeout(ensureButton,2200);
  if(lastAnalysis&&visible)setTimeout(function(){paintAnalysis(lastAnalysis);},1400);
});
setInterval(ensureButton,1200);
panel.hidden=!visible;
ensureButton();
window.__auditKawkabatLiveAnalysis=function(){
  return{
    installed:true,visible:visible,magicFactor:MAGIC,step:STEP,
    wheelGeometryChanged:false,overlayOnly:true,toolbarButton:!!toolbarButton,
    current:lastAnalysis
  };
};
}());
