<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — V27 + Brown Line Clear + Outer Frame Shift V28</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="/kawkabat-v209-layer-28.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var poll=null;
    var BROWN_WIDTH_ADD=12;
    var BROWN_RADIUS_ADD=BROWN_WIDTH_ADD/2;
    var OUTER_FRAME_SHIFT=14;

    function locateWheelDocument(doc,depth){
      if(!doc||depth>32)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function readNumericStyle(view,node,property,fallback){
      var value=Number.parseFloat(view.getComputedStyle(node).getPropertyValue(property));
      return Number.isFinite(value)?value:fallback;
    }

    function setCircleRadiusOnce(circle,delta,key){
      if(!circle)return false;
      var attr='data-v28-original-r-'+key;
      var original=circle.getAttribute(attr);
      if(original==null){
        original=circle.getAttribute('r');
        circle.setAttribute(attr,original);
      }
      var radius=Number(original);
      if(!Number.isFinite(radius))return false;
      circle.setAttribute('r',String(radius+delta));
      return true;
    }

    function moveCardinalOrnamentOutward(group,angle){
      if(!group)return;
      var original=group.getAttribute('data-v28-original-transform');
      if(original==null){
        original=group.getAttribute('transform')||'';
        group.setAttribute('data-v28-original-transform',original);
      }
      var offset='';
      if(angle===360)offset='translate(0 -'+OUTER_FRAME_SHIFT+')';
      else if(angle===90)offset='translate('+OUTER_FRAME_SHIFT+' 0)';
      else if(angle===180)offset='translate(0 '+OUTER_FRAME_SHIFT+')';
      else if(angle===270)offset='translate(-'+OUTER_FRAME_SHIFT+' 0)';
      group.setAttribute('transform',(original+' '+offset).trim());
    }

    function applyBrownAndOuterFrameSpacing(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;
        var view=wheelDoc.defaultView;
        var angleFrame=wheelDoc.getElementById('angleFrame');
        var outerFrame=wheelDoc.getElementById('outerBlackFrame');
        var ornaments=wheelDoc.getElementById('cardinalOrnaments');
        if(!view||!angleFrame||!outerFrame||!ornaments)return false;

        var brown=angleFrame.querySelector('.angle-band-outer-line');
        if(!brown)return false;

        var originalR=brown.getAttribute('data-v28-original-r');
        if(originalR==null){
          originalR=brown.getAttribute('r');
          brown.setAttribute('data-v28-original-r',originalR);
        }
        var radius=Number(originalR);
        if(!Number.isFinite(radius))return false;

        var originalWidth=brown.getAttribute('data-v28-original-width');
        if(originalWidth==null){
          originalWidth=String(readNumericStyle(view,brown,'stroke-width',6.5));
          brown.setAttribute('data-v28-original-width',originalWidth);
        }
        var width=Number(originalWidth);
        if(!Number.isFinite(width))return false;

        brown.setAttribute('r',String(radius+BROWN_RADIUS_ADD));
        brown.style.setProperty('stroke-width',(width+BROWN_WIDTH_ADD)+'px','important');
        brown.style.setProperty('opacity','1','important');
        brown.style.setProperty('vector-effect','non-scaling-stroke','important');

        var circles=outerFrame.querySelectorAll('circle');
        if(!circles.length)return false;
        circles.forEach(function(circle){
          setCircleRadiusOnce(circle,OUTER_FRAME_SHIFT,'outer-frame');
        });

        ornaments.querySelectorAll('.cardinal-ornament').forEach(function(group){
          moveCardinalOrnamentOutward(group,Number(group.getAttribute('data-angle')));
        });

        wheelDoc.documentElement.dataset.brownAngleOuterLineClearV28='true';
        wheelDoc.documentElement.dataset.brownWidthAdd=String(BROWN_WIDTH_ADD);
        wheelDoc.documentElement.dataset.brownRadiusAdd=String(BROWN_RADIUS_ADD);
        wheelDoc.documentElement.dataset.outerFrameShift=String(OUTER_FRAME_SHIFT);
        wheelDoc.documentElement.dataset.brownInnerBoundaryChanged='false';
        wheelDoc.documentElement.dataset.innerWheelGeometryChanged='false';

        view.__auditKawkabatBrownLineClearOuterFrameV28=function(){
          return{
            ok:true,
            changedArea:'brown-angle-outer-line-thicker-outward-and-outer-frame-shifted-outward',
            brownStrokeWidthBefore:width,
            brownStrokeWidthAfter:width+BROWN_WIDTH_ADD,
            brownRadiusBefore:radius,
            brownRadiusAfter:radius+BROWN_RADIUS_ADD,
            brownInnerBoundaryChanged:false,
            outerFrameCircleCount:circles.length,
            outerFrameShiftPx:OUTER_FRAME_SHIFT,
            cardinalOrnamentsShiftedOutward:true,
            angleNumbersChanged:false,
            angleTicksChanged:false,
            zodiacChanged:false,
            wheelNumbersChanged:false,
            innerWheelGeometryChanged:false
          };
        };
        return true;
      }catch(error){
        return false;
      }
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyBrownAndOuterFrameSpacing()||attempts>=1100){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
