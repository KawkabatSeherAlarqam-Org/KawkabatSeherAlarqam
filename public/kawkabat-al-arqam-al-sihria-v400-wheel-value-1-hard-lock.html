<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية V400 — تثبيت دائم لقيمة العجلة 1</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f1e3}
    #v399-frame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="v399-frame" title="كوكبة الأرقام السحرية"
    src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/16ea13a27b9022cecde0cdaeeb573c6911d9aa32/public/kawkabat-al-arqam-al-sihria-v399-wheel-value-1-panel-restored.html"></iframe>
  <script>
  (function(){
    'use strict';
    var frame=document.getElementById('v399-frame');
    var lockedInput=null;
    function visit(doc,callback,depth){
      if(!doc||depth>280)return null;
      var result=callback(doc);if(result)return result;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i++){
        try{var found=visit(frames[i].contentDocument,callback,depth+1);if(found)return found;}catch(error){}
      }
      return null;
    }
    function setNativeValue(control,value){
      var view=control.ownerDocument.defaultView;
      var descriptor=view&&view.HTMLInputElement?
        Object.getOwnPropertyDescriptor(view.HTMLInputElement.prototype,'value'):null;
      if(descriptor&&descriptor.set)descriptor.set.call(control,value);
      else control.value=value;
      control.setAttribute('value',value);
    }
    function dispatch(control,type){
      var view=control.ownerDocument.defaultView;
      control.dispatchEvent(new view.Event(type,{bubbles:true}));
    }
    function enforce(){
      var root=null;try{root=frame.contentDocument;}catch(error){}
      if(!root)return false;
      var controlDoc=visit(root,function(doc){
        return doc.querySelector('input[aria-label="Value"]')?doc:null;
      },0);
      if(!controlDoc)return false;
      var value=controlDoc.querySelector('input[aria-label="Value"]');
      if(value!==lockedInput){
        lockedInput=value;
        value.readOnly=true;
        value.setAttribute('readonly','readonly');
        value.setAttribute('aria-readonly','true');
        value.title='Wheel Value fixed at 1';
        value.addEventListener('input',function(){
          if(String(value.value)!=='1')setNativeValue(value,'1');
        },true);
        value.addEventListener('change',function(){
          if(String(value.value)!=='1')setNativeValue(value,'1');
        },true);
      }
      if(String(value.value)!=='1'){
        setNativeValue(value,'1');
        dispatch(value,'input');
        dispatch(value,'change');
      }
      controlDoc.documentElement.dataset.v400WheelValue='1-locked';
      return String(value.value)==='1'&&value.readOnly===true;
    }
    frame.addEventListener('load',enforce);
    var attempts=0;
    (function boot(){attempts+=1;if(!enforce()&&attempts<7200)setTimeout(boot,50);}());
    setInterval(function(){try{enforce();}catch(error){}},100);
    window.__auditV400=function(){
      return{ready:enforce(),wheelValue:lockedInput&&lockedInput.value,readOnly:!!(lockedInput&&lockedInput.readOnly)};
    };
  }());
  </script>
</body>
</html>
