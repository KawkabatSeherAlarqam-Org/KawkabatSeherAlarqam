<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — V17 + 14px Angle Numbers V18</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="https://htmlpreview.github.io/?https://github.com/saloqbi/KawkabatSeherAlarqam/blob/main/public/kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-v17.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var poll=null;

    function locateWheelDocument(doc,depth){
      if(!doc||depth>18)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var index=0;index<frames.length;index+=1){
        try{
          var found=locateWheelDocument(frames[index].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function applyAngleNumberSizeOnly(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;

        var labels=wheelDoc.querySelectorAll('.angle-label');
        if(!labels.length)return false;

        var style=wheelDoc.getElementById('angleNumberSize14OnlyV18Style');
        if(!style){
          style=wheelDoc.createElement('style');
          style.id='angleNumberSize14OnlyV18Style';
          (wheelDoc.head||wheelDoc.documentElement).appendChild(style);
        }

        style.textContent='.angle-label{font-size:14px!important;}';

        wheelDoc.documentElement.dataset.angleNumberSizeOnly='true';
        wheelDoc.documentElement.dataset.angleNumberFontSize='14px';
        wheelDoc.documentElement.dataset.angleNumberPositionChanged='false';
        wheelDoc.documentElement.dataset.angleNumberColorChanged='false';
        wheelDoc.documentElement.dataset.wheelGeometryChanged='false';

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatAngleNumberSize14OnlyV18=function(){
            return{
              ok:labels.length>0,
              changedArea:'angle-number-font-size-only',
              angleLabelCount:labels.length,
              fontSize:'14px',
              fontWeightChanged:false,
              colorChanged:false,
              fillChanged:false,
              strokeChanged:false,
              filterChanged:false,
              positionChanged:false,
              transformChanged:false,
              geometryChanged:false,
              zodiacChanged:false,
              wheelNumbersChanged:false,
              valuesChanged:false,
              framesChanged:false,
              crest360Changed:false
            };
          };
        }
        return true;
      }catch(error){
        return false;
      }
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyAngleNumberSizeOnly()||attempts>=600){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
