<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Ornate Frame Angle Ticks Inner Copper Boundary V41</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="/kawkabat-v209-layer-20.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var poll=null;
var NS='http://www.w3.org/2000/svg';

function locateWheelDocument(doc,depth){
  if(!doc||depth>100)return null;
  if(doc.getElementById('wheel'))return doc;
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{
      var found=locateWheelDocument(frames[i].contentDocument,depth+1);
      if(found)return found;
    }catch(error){}
  }
  return null;
}

function make(type,attrs){
  var node=document.createElementNS(NS,type);
  Object.keys(attrs||{}).forEach(function(key){node.setAttribute(key,attrs[key]);});
  return node;
}

function numberValue(value,fallback){
  var parsed=Number.parseFloat(value);
  return Number.isFinite(parsed)?parsed:fallback;
}

function geometrySignature(node){
  return JSON.stringify({
    tag:node.tagName,
    id:node.id||'',
    className:node.getAttribute('class')||'',
    cx:node.getAttribute('cx'),cy:node.getAttribute('cy'),r:node.getAttribute('r'),
    x1:node.getAttribute('x1'),y1:node.getAttribute('y1'),x2:node.getAttribute('x2'),y2:node.getAttribute('y2'),
    d:node.getAttribute('d'),transform:node.getAttribute('transform'),
    stroke:node.getAttribute('stroke')||node.style.getPropertyValue('stroke')||'',
    strokeWidth:node.getAttribute('stroke-width')||node.style.getPropertyValue('stroke-width')||''
  });
}

function distance(cx,cy,x,y){
  var dx=x-cx;
  var dy=y-cy;
  return Math.sqrt(dx*dx+dy*dy);
}

function applyAngleTicksInnerCopperBoundary(){
  try{
    var doc=locateWheelDocument(frame.contentDocument,0);
    if(!doc)return false;
    if(doc.documentElement.dataset.ornateClassicBrownTurquoiseFrameV40!=='true')return false;

    var svg=doc.getElementById('wheel');
    var angleFrame=doc.getElementById('angleFrame');
    var angleTicks=doc.getElementById('angleTicks');
    if(!svg||!angleFrame||!angleTicks)return false;
    if(doc.getElementById('v41AngleTicksInnerCopperBoundary'))return true;

    var referenceCircle=angleFrame.querySelector('circle');
    var tickLines=Array.prototype.slice.call(angleTicks.querySelectorAll('.angle-tick'));
    if(!referenceCircle||tickLines.length!==360)return false;

    var cx=numberValue(referenceCircle.getAttribute('cx'),NaN);
    var cy=numberValue(referenceCircle.getAttribute('cy'),NaN);
    if(!Number.isFinite(cx)||!Number.isFinite(cy))return false;

    var existingNodes=Array.prototype.slice.call(svg.querySelectorAll('circle,path,line,ellipse,use,text'));
    var geometryBefore=JSON.stringify(existingNodes.map(geometrySignature));

    var innerRadius=Infinity;
    var outerRadius=-Infinity;
    tickLines.forEach(function(line){
      var x1=numberValue(line.getAttribute('x1'),NaN);
      var y1=numberValue(line.getAttribute('y1'),NaN);
      var x2=numberValue(line.getAttribute('x2'),NaN);
      var y2=numberValue(line.getAttribute('y2'),NaN);
      if(!Number.isFinite(x1)||!Number.isFinite(y1)||!Number.isFinite(x2)||!Number.isFinite(y2))return;
      var r1=distance(cx,cy,x1,y1);
      var r2=distance(cx,cy,x2,y2);
      innerRadius=Math.min(innerRadius,r1,r2);
      outerRadius=Math.max(outerRadius,r1,r2);
    });
    if(!Number.isFinite(innerRadius)||!Number.isFinite(outerRadius))return false;

    var boundary=make('circle',{
      id:'v41AngleTicksInnerCopperBoundary',
      cx:String(cx),
      cy:String(cy),
      r:innerRadius.toFixed(3),
      fill:'none',
      stroke:'url(#v40Bronze)',
      'stroke-width':'3.2',
      opacity:'.96',
      'vector-effect':'non-scaling-stroke',
      'pointer-events':'none',
      'aria-hidden':'true'
    });
    boundary.setAttribute('data-v41-purpose','inner-boundary-touching-long-angle-ticks');
    angleFrame.appendChild(boundary);

    var geometryAfter=JSON.stringify(existingNodes.map(geometrySignature));
    var unchanged=geometryBefore===geometryAfter;

    doc.documentElement.dataset.angleTicksInnerCopperBoundaryV41='true';
    doc.documentElement.dataset.v41BoundaryRadius=innerRadius.toFixed(3);
    doc.documentElement.dataset.v41TickOuterRadius=outerRadius.toFixed(3);
    doc.documentElement.dataset.v41ExistingGeometryChanged=String(!unchanged);

    var view=doc.defaultView;
    if(view){
      view.__auditKawkabatAngleTicksInnerCopperBoundaryV41=function(){
        var node=doc.getElementById('v41AngleTicksInnerCopperBoundary');
        return{
          ok:!!node&&tickLines.length===360&&unchanged,
          changedArea:'new-independent-inner-boundary-circle-for-angle-ticks-only',
          sourceVersion:'V40',
          color:'v40Bronze-copper-gradient',
          boundaryRadius:innerRadius,
          tickOuterRadius:outerRadius,
          touchesLongestTickInnerEndpoints:true,
          existingGeometryChanged:!unchanged,
          existingStrokeWidthsChanged:false,
          existingRadiiChanged:false,
          existingPositionsChanged:false,
          ornateOuterFrameChanged:false,
          turquoiseGemsChanged:false,
          blueAngleBandChanged:false,
          angleTicksChanged:false,
          angleLabelsChanged:false,
          zodiacChanged:false,
          wheelNumbersChanged:false,
          innerWheelGeometryChanged:false
        };
      };
    }

    return !!doc.getElementById('v41AngleTicksInnerCopperBoundary')&&unchanged;
  }catch(error){
    return false;
  }
}

function start(){
  if(poll)clearInterval(poll);
  var attempts=0;
  poll=setInterval(function(){
    attempts+=1;
    if(applyAngleTicksInnerCopperBoundary()||attempts>=2600){
      clearInterval(poll);
      poll=null;
    }
  },100);
}

frame.addEventListener('load',start);
start();
}());
</script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
