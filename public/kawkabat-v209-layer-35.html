<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — V17 + Outward Angle Band + Larger Fixed Angle Numbers V20</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="/kawkabat-v209-layer-36.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var poll=null;
    var OUTWARD=16;

    function locateWheelDocument(doc,depth){
      if(!doc||depth>18)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function setRadiusFromOriginal(node,delta){
      if(!node)return false;
      var original=node.getAttribute('data-v20-original-r');
      if(original==null){
        original=node.getAttribute('r');
        node.setAttribute('data-v20-original-r',original);
      }
      var value=Number(original);
      if(!Number.isFinite(value))return false;
      node.setAttribute('r',String(value+delta));
      return true;
    }

    function setOrnamentOutward(group,angle){
      if(!group)return;
      var transform='';
      if(angle===360)transform='translate(0 -'+OUTWARD+')';
      else if(angle===90)transform='translate('+OUTWARD+' 0)';
      else if(angle===180)transform='translate(0 '+OUTWARD+')';
      else if(angle===270)transform='translate(-'+OUTWARD+' 0)';
      group.setAttribute('transform',transform);
    }

    function applyOutwardBandAndLargerNumbers(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;

        var angleFrame=wheelDoc.getElementById('angleFrame');
        var outerFrame=wheelDoc.getElementById('outerBlackFrame');
        var ornaments=wheelDoc.getElementById('cardinalOrnaments');
        var labels=wheelDoc.querySelectorAll('.angle-label');
        if(!angleFrame||!outerFrame||!ornaments||!labels.length)return false;

        var style=wheelDoc.getElementById('angleBandOutwardLargerNumbersV20Style');
        if(!style){
          style=wheelDoc.createElement('style');
          style.id='angleBandOutwardLargerNumbersV20Style';
          (wheelDoc.head||wheelDoc.documentElement).appendChild(style);
        }

        style.textContent='\n'
          + '.angle-band-shadow{stroke-width:120px!important;}\n'
          + '.angle-band{stroke-width:108px!important;}\n'
          + '.angle-label{font-size:28px!important;}\n'
          + '.angle-label.ten-degree{font-size:32px!important;}\n';

        setRadiusFromOriginal(angleFrame.querySelector('.angle-band-shadow'),OUTWARD/2);
        setRadiusFromOriginal(angleFrame.querySelector('.angle-band'),OUTWARD/2);
        setRadiusFromOriginal(angleFrame.querySelector('.angle-band-outer-line'),OUTWARD);
        setRadiusFromOriginal(angleFrame.querySelector('.angle-band-highlight'),OUTWARD);

        outerFrame.querySelectorAll('circle').forEach(function(circle){
          setRadiusFromOriginal(circle,OUTWARD);
        });

        ornaments.querySelectorAll('.cardinal-ornament').forEach(function(group){
          setOrnamentOutward(group,Number(group.getAttribute('data-angle')));
        });

        wheelDoc.documentElement.dataset.angleBandOutwardOnlyV20='true';
        wheelDoc.documentElement.dataset.angleBandOutwardPx=String(OUTWARD);
        wheelDoc.documentElement.dataset.angleBandInnerBoundaryChanged='false';
        wheelDoc.documentElement.dataset.angleNumbersMoved='false';
        wheelDoc.documentElement.dataset.angleNumberRegularSize='28px';
        wheelDoc.documentElement.dataset.angleNumberTenDegreeSize='32px';

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatAngleBandOutwardLargerNumbersV20=function(){
            return{
              ok:labels.length===68,
              changedArea:'angle-band-and-outer-frame-outward-only-plus-angle-font-size',
              outwardExpansionPx:OUTWARD,
              regularFontSize:'28px',
              tenDegreeFontSize:'32px',
              angleNumberPositionChanged:false,
              angleNumberTransformChanged:false,
              angleBandInnerBoundaryChanged:false,
              innerWheelGeometryChanged:false,
              zodiacChanged:false,
              wheelNumbersChanged:false,
              valuesChanged:false,
              angleTicksChanged:false,
              outerFrameMovedOutward:true,
              cardinalOrnamentsMovedOutward:true
            };
          };
        }
        return true;
      }catch(error){
        return false;
      }
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyOutwardBandAndLargerNumbers()||attempts>=700){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>


<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_START -->
<script id="kawkabatV24SelfHideLeftTrio">
(function(){
"use strict";

function norm(s){
  return String(s==null?"":s).replace(/\s+/g,"").trim();
}
function buttonKey(b){
  return norm(
    (b.textContent||"")+" "+
    (b.getAttribute("title")||"")+" "+
    (b.getAttribute("aria-label")||"")
  ).toLowerCase();
}
function isPlus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="+" || t==="＋" || t==="➕" ||
         /\bplus\b|\badd\b|\bincrease\b/.test(k);
}
function isMinus(b){
  var t=norm(b.textContent);
  var k=buttonKey(b);
  return t==="-" || t==="−" || t==="–" || t==="—" || t==="➖" ||
         /\bminus\b|\bdecrease\b/.test(k);
}
function visible(b){
  try{
    var r=b.getBoundingClientRect(),s=getComputedStyle(b);
    return r.width>20&&r.height>20&&s.display!=="none"&&s.visibility!=="hidden";
  }catch(e){return false;}
}
function removeButtonAndTinyWrapper(b){
  if(!b)return;
  var target=b;
  try{
    var p=b.parentElement;
    if(p){
      var br=b.getBoundingClientRect(),pr=p.getBoundingClientRect();
      var buttons=p.querySelectorAll(":scope > button");
      var children=Array.prototype.filter.call(p.children,function(x){
        return getComputedStyle(x).display!=="none";
      });
      if(buttons.length===1 &&
         children.length===1 &&
         Math.abs(pr.width-br.width)<=14 &&
         Math.abs(pr.height-br.height)<=14 &&
         pr.width<130 && pr.height<120){
        target=p;
      }
    }
  }catch(e){}
  try{
    target.setAttribute("data-kawkabat-v24-removed","1");
    target.remove();
  }catch(e){
    try{target.style.setProperty("display","none","important");}catch(x){}
  }
}
function excluded(b){
  return !!(b.closest && (
    b.closest("#v62MetalBar") ||
    b.closest("#v47Toolbar") ||
    b.closest("#v66DrawingToolbar") ||
    b.closest("#v73ZoomGroup") ||
    b.closest("#v63ZoomGroup")
  ));
}
function findAndRemove(){
  try{
    var groups=Array.prototype.slice.call(
      document.querySelectorAll("div,section,header,nav,aside,span,td")
    );

    for(var g=0;g<groups.length;g++){
      var group=groups[g];
      if(excluded(group)) continue;

      var buttons=Array.prototype.slice.call(group.querySelectorAll(":scope > button"));
      if(buttons.length<5 || buttons.length>8) continue;

      var active=buttons.filter(function(b){return visible(b)&&!excluded(b);});
      if(active.length<5) continue;

      if(!isPlus(active[0]) || !isMinus(active[1])) continue;

      var r0=active[0].getBoundingClientRect();
      var r1=active[1].getBoundingClientRect();
      var r4=active[4].getBoundingClientRect();

      if(r0.left>650 || r0.top>260) continue;
      if(Math.abs(r0.top-r1.top)>14 || Math.abs(r0.top-r4.top)>18) continue;

      removeButtonAndTinyWrapper(active[0]);
      removeButtonAndTinyWrapper(active[1]);
      removeButtonAndTinyWrapper(active[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }

    var all=Array.prototype.slice.call(document.querySelectorAll("button")).filter(function(b){
      if(!visible(b)||excluded(b))return false;
      var r=b.getBoundingClientRect();
      return r.left<650 && r.top<260 &&
             r.width>=28 && r.width<=120 &&
             r.height>=28 && r.height<=110;
    });

    for(var i=0;i+4<all.length;i++){
      if(!isPlus(all[i]) || !isMinus(all[i+1]))continue;

      var row=all.slice(i,i+5);
      var base=row[0].getBoundingClientRect();
      var ok=true;
      for(var j=1;j<row.length;j++){
        var rr=row[j].getBoundingClientRect();
        if(Math.abs(rr.top-base.top)>18){ok=false;break;}
        if(rr.left<=row[j-1].getBoundingClientRect().left){ok=false;break;}
      }
      if(!ok)continue;

      removeButtonAndTinyWrapper(row[0]);
      removeButtonAndTinyWrapper(row[1]);
      removeButtonAndTinyWrapper(row[2]);

      document.documentElement.setAttribute("data-kawkabat-v24-left-trio-hidden","true");
      return true;
    }
  }catch(e){}
  return false;
}

var attempts=0;
function run(){
  attempts++;
  if(findAndRemove())return;
  if(attempts<240)setTimeout(run,100);
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){setTimeout(run,20);});
}else{
  setTimeout(run,20);
}
window.addEventListener("load",function(){setTimeout(run,50);});

try{
  new MutationObserver(function(){
    if(document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")!=="true"){
      findAndRemove();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

window.__KAWKABAT_V24_AUDIT=function(){
  return{
    version:"V24_SELF_SOURCE",
    hidden:document.documentElement.getAttribute("data-kawkabat-v24-left-trio-hidden")==="true"
  };
};
}());
</script>
<!-- KAWKABAT_V24_SELF_HIDE_LEFT_TRIO_END -->

</body>
</html>
