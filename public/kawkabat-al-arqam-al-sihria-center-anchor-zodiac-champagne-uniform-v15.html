<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Uniform Zodiac Champagne V15</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-center-anchor-zodiac-champagne-large-font-v14.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var NS='http://www.w3.org/2000/svg';
    var observer=null;
    var observedWheel=null;
    var timer=null;
    var poll=null;

    function locateWheelDocument(doc,depth){
      if(!doc||depth>12)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var index=0;index<frames.length;index+=1){
        try{
          var found=locateWheelDocument(frames[index].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function ensureGradient(wheelDoc){
      var svg=wheelDoc.getElementById('wheel');
      var defs=svg&&svg.querySelector('defs');
      if(!defs)return null;

      var gradient=wheelDoc.getElementById('zodiacChampagneIsolatedRadialV15');
      if(gradient)return gradient;

      gradient=wheelDoc.createElementNS(NS,'radialGradient');
      gradient.setAttribute('id','zodiacChampagneIsolatedRadialV15');
      gradient.setAttribute('gradientUnits','userSpaceOnUse');
      gradient.setAttribute('cx','2200');
      gradient.setAttribute('cy','1800');
      gradient.setAttribute('r','1610');

      [
        ['0%','#F7F1E3'],
        ['93.17%','#C8AA90'],
        ['95.10%','#E0CEC0'],
        ['96.58%','#F1E5DB'],
        ['98.05%','#E0CEC0'],
        ['100%','#C8AA90']
      ].forEach(function(item){
        var stop=wheelDoc.createElementNS(NS,'stop');
        stop.setAttribute('offset',item[0]);
        stop.setAttribute('stop-color',item[1]);
        gradient.appendChild(stop);
      });

      defs.appendChild(gradient);
      return gradient;
    }

    function ensureIsolatedLayer(wheelDoc){
      var wheel=wheelDoc.getElementById('wheel');
      var divisions=wheelDoc.getElementById('divisions');
      var specialFills=wheelDoc.getElementById('specialFills');
      if(!wheel||!divisions||!specialFills)return null;

      var layer=wheelDoc.getElementById('zodiacChampagneIsolationV15');
      if(!layer){
        layer=wheelDoc.createElementNS(NS,'circle');
        layer.setAttribute('id','zodiacChampagneIsolationV15');
        layer.setAttribute('cx','2200');
        layer.setAttribute('cy','1800');
        layer.setAttribute('r','1555');
      }

      layer.setAttribute('fill','none');
      layer.setAttribute('stroke','url(#zodiacChampagneIsolatedRadialV15)');
      layer.setAttribute('stroke-width','110');
      layer.setAttribute('pointer-events','none');
      layer.setAttribute('data-zodiac-champagne-isolation-v15','true');
      layer.style.opacity='1';

      var viewMode=wheelDoc.documentElement.dataset.viewMode||'circle36';
      layer.style.display=viewMode==='circle36'?'':'none';

      if(layer.parentNode!==wheel||layer.nextSibling!==divisions){
        wheel.insertBefore(layer,divisions);
      }

      return layer;
    }

    function applyUniformZodiacPalette(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;

        var wheel=wheelDoc.getElementById('wheel');
        var labels=wheelDoc.getElementById('allBalancedDaysZodiac');
        var specialFills=wheelDoc.getElementById('specialFills');
        var divisions=wheelDoc.getElementById('divisions');
        if(!wheel||!labels||!specialFills||!divisions)return false;
        if(!ensureGradient(wheelDoc))return false;

        var layer=ensureIsolatedLayer(wheelDoc);
        if(!layer)return false;

        wheelDoc.documentElement.dataset.zodiacCellPalette='champagne-beige-rose-bronze-uniform';
        wheelDoc.documentElement.dataset.zodiacCellBaseHex='#DAC4B2';
        wheelDoc.documentElement.dataset.zodiacCardinalInfluenceIsolated='true';
        wheelDoc.documentElement.dataset.zodiacUniformLayerOrder='after-special-fills-before-divisions';

        if(observedWheel!==wheel){
          if(observer)observer.disconnect();
          observer=new MutationObserver(scheduleApply);
          observer.observe(wheel,{childList:true,subtree:true});
          observedWheel=wheel;
        }

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatUniformZodiacChampagneV15=function(){
            var correctOrder=layer.previousElementSibling===specialFills&&layer.nextElementSibling===divisions;
            return{
              ok:layer.getAttribute('stroke')==='url(#zodiacChampagneIsolatedRadialV15)'&&correctOrder,
              changedArea:'zodiac-cell-background-layer-only',
              palette:'champagne-beige-rose-bronze',
              baseHex:'#DAC4B2',
              isolatedFromCardinalFills:true,
              layerOrder:'after-special-fills-before-divisions',
              zodiacLabelCount:labels.children.length,
              zodiacFontSize:wheelDoc.documentElement.dataset.zodiacFontSize||'29',
              numbersChanged:false,
              valuesChanged:false,
              geometryChanged:false,
              cardinalBandsChanged:false,
              framesChanged:false,
              textChanged:false,
              positionsChanged:false
            };
          };
        }
        return true;
      }catch(error){
        return false;
      }
    }

    function scheduleApply(){
      if(timer)clearTimeout(timer);
      timer=setTimeout(function(){timer=null;applyUniformZodiacPalette();},40);
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyUniformZodiacPalette()||attempts>=500){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
