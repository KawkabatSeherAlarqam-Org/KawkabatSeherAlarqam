<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Zodiac #DAC4B2 Preserve Cardinals V18</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-v17.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var NS='http://www.w3.org/2000/svg';
    var observer=null;
    var observedWheel=null;
    var timer=null;
    var poll=null;

    var CX=2200;
    var CY=1800;
    var INNER_R=1500;
    var OUTER_R=1610;
    var ZODIAC_COLOR='#DAC4B2';
    var CARDINAL_CELLS={9:true,18:true,27:true,36:true};

    function locateWheelDocument(doc,depth){
      if(!doc||depth>14)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function point(radius,angleDeg){
      var a=angleDeg*Math.PI/180;
      return{
        x:CX+radius*Math.sin(a),
        y:CY-radius*Math.cos(a)
      };
    }

    function sectorPath(cellNumber){
      var center=(cellNumber%36)*10;
      var start=center-5;
      var end=center+5;
      var os=point(OUTER_R,start);
      var oe=point(OUTER_R,end);
      var ie=point(INNER_R,end);
      var is=point(INNER_R,start);
      return[
        'M',os.x.toFixed(3),os.y.toFixed(3),
        'A',OUTER_R,OUTER_R,0,0,1,oe.x.toFixed(3),oe.y.toFixed(3),
        'L',ie.x.toFixed(3),ie.y.toFixed(3),
        'A',INNER_R,INNER_R,0,0,0,is.x.toFixed(3),is.y.toFixed(3),
        'Z'
      ].join(' ');
    }

    function ensureLayer(wheelDoc){
      var wheel=wheelDoc.getElementById('wheel');
      if(!wheel)return null;

      var old=wheelDoc.getElementById('zodiacFlatDAC4B2V18');
      if(old&&old.parentNode)old.parentNode.removeChild(old);

      var group=wheelDoc.createElementNS(NS,'g');
      group.setAttribute('id','zodiacFlatDAC4B2V18');
      group.setAttribute('pointer-events','none');
      group.setAttribute('data-color',ZODIAC_COLOR);
      group.setAttribute('data-preserved-cardinals','9,18,27,36');

      for(var cell=1;cell<=36;cell+=1){
        if(CARDINAL_CELLS[cell])continue;
        var path=wheelDoc.createElementNS(NS,'path');
        path.setAttribute('d',sectorPath(cell));
        path.setAttribute('fill',ZODIAC_COLOR);
        path.setAttribute('stroke','none');
        path.setAttribute('data-zodiac-cell',String(cell));
        group.appendChild(path);
      }

      var divisions=wheelDoc.getElementById('divisions');
      var labels=wheelDoc.getElementById('allBalancedDaysZodiac');
      var anchor=divisions||labels;
      if(anchor&&anchor.parentNode){
        anchor.parentNode.insertBefore(group,anchor);
      }else{
        wheel.appendChild(group);
      }
      return group;
    }

    function applyColor(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;
        var wheel=wheelDoc.getElementById('wheel');
        var labels=wheelDoc.getElementById('allBalancedDaysZodiac');
        if(!wheel||!labels)return false;

        var group=ensureLayer(wheelDoc);
        if(!group)return false;

        wheelDoc.documentElement.dataset.zodiacFlatColor=ZODIAC_COLOR;
        wheelDoc.documentElement.dataset.zodiacFlatColorApplied='true';
        wheelDoc.documentElement.dataset.cardinalZodiacCellsPreserved='9,18,27,36';

        if(observedWheel!==wheel){
          if(observer)observer.disconnect();
          observer=new MutationObserver(scheduleApply);
          observer.observe(wheel,{childList:true,subtree:true});
          observedWheel=wheel;
        }

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatZodiacFlatDAC4B2V18=function(){
            return{
              ok:group.children.length===32,
              color:ZODIAC_COLOR,
              recoloredCellCount:32,
              preservedCardinalCells:[9,18,27,36],
              preservedPiscesCell:36,
              fontSizeChanged:false,
              numbersChanged:false,
              valuesChanged:false,
              geometryChanged:false,
              cardinalDirectionsChanged:false,
              labelsChanged:false
            };
          };
        }
        return true;
      }catch(error){
        return false;
      }
    }

    function scheduleApply(){
      if(timer)clearTimeout(timer);
      timer=setTimeout(function(){timer=null;applyColor();},60);
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyColor()||attempts>=500){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
