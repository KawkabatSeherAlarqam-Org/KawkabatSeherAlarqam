<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية V417 — إظهار مؤكد لفيبوناتشي 94.43%</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f1e3}
    #v415-frame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="v415-frame" title="كوكبة الأرقام السحرية"
    src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/6cf680212c12870e02151d786f623063c70cf47c/public/kawkabat-al-arqam-al-sihria-v415-canonical-directions-gates-colors.html"></iframe>
  <script>
  (function(){
    'use strict';
    var frame=document.getElementById('v415-frame');
    var CX=2200,CY=1800,TARGET=94,RATIO='94.43%';
    function visit(doc,callback,depth){
      if(!doc||depth>560)return null;
      var result=callback(doc);if(result)return result;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i++){
        try{var found=visit(frames[i].contentDocument,callback,depth+1);if(found)return found;}catch(error){}
      }
      return null;
    }
    function canonicalSlot(node){
      var x=Number(node.getAttribute('x')),y=Number(node.getAttribute('y'));
      if(!Number.isFinite(x)||!Number.isFinite(y))return null;
      var degree=(Math.atan2(y-CY,x-CX)*180/Math.PI+90+360)%360;
      var step=Math.round(degree/10)%36;
      return step===0?36:step;
    }
    function locate(doc){
      var requiredOffset=Math.floor((TARGET-1)/36),requiredSlot=((TARGET-1)%36)+1;
      var nodes=doc.querySelectorAll('.approved-cycle-number[data-cycle-offset]');
      for(var i=0;i<nodes.length;i++){
        if(Number.parseInt(nodes[i].getAttribute('data-cycle-offset'),10)!==requiredOffset)continue;
        if(canonicalSlot(nodes[i])===requiredSlot)return nodes[i];
      }
      return null;
    }
    function addStop(doc,gradient,offset,color){
      var stop=doc.createElementNS('http://www.w3.org/2000/svg','stop');
      stop.setAttribute('offset',offset);stop.setAttribute('stop-color',color);gradient.appendChild(stop);
    }
    function ensureGradient(doc,wheel){
      var defs=wheel.querySelector('defs');
      if(!defs){defs=doc.createElementNS('http://www.w3.org/2000/svg','defs');wheel.insertBefore(defs,wheel.firstChild);}
      var gradient=doc.getElementById('v417Fib94SilverGloss');
      if(!gradient){
        gradient=doc.createElementNS('http://www.w3.org/2000/svg','linearGradient');gradient.id='v417Fib94SilverGloss';
        gradient.setAttribute('x1','0%');gradient.setAttribute('y1','0%');gradient.setAttribute('x2','100%');gradient.setAttribute('y2','0%');
        addStop(doc,gradient,'0%','#758791');addStop(doc,gradient,'18%','#C4D0D6');
        addStop(doc,gradient,'42%','#FFFFFF');addStop(doc,gradient,'62%','#D6E0E5');
        addStop(doc,gradient,'82%','#F8FBFC');addStop(doc,gradient,'100%','#758791');defs.appendChild(gradient);
      }
      return gradient;
    }
    function create(doc,wheel){
      var badge=doc.createElementNS('http://www.w3.org/2000/svg','g');
      badge.id='v416FibCell94';badge.setAttribute('pointer-events','none');
      badge.setAttribute('data-v416-fixed-cell','94');badge.setAttribute('data-fibonacci-ratio',RATIO);
      var background=doc.createElementNS('http://www.w3.org/2000/svg','rect');
      background.setAttribute('x','-40');background.setAttribute('y','-15');background.setAttribute('width','80');
      background.setAttribute('height','30');background.setAttribute('rx','15');
      background.style.setProperty('fill','url(#v417Fib94SilverGloss)','important');
      background.style.setProperty('fill-opacity','0.94','important');
      background.style.setProperty('stroke','#A67C52','important');
      background.style.setProperty('stroke-width','1.4px','important');
      background.style.setProperty('filter','drop-shadow(0px 1.2px 1.4px rgba(50,68,78,.36))','important');
      badge.appendChild(background);
      var label=doc.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x','0');label.setAttribute('y','0');label.setAttribute('text-anchor','middle');
      label.setAttribute('dominant-baseline','central');label.style.setProperty('font-family','Arial, sans-serif','important');
      label.style.setProperty('font-size','18px','important');label.style.setProperty('font-weight','700','important');
      label.style.setProperty('fill','#6F4A1F','important');label.textContent=RATIO;badge.appendChild(label);
      wheel.appendChild(badge);return badge;
    }
    function position(badge,cell){
      var x=Number(cell.getAttribute('x')),y=Number(cell.getAttribute('y'));
      var dx=x-CX,dy=y-CY,radius=Math.hypot(dx,dy)||1;
      var labelX=x-(dx/radius*42),labelY=y-(dy/radius*42),angle=Math.atan2(dy,dx)*180/Math.PI+90;
      while(angle>90)angle-=180;while(angle<-90)angle+=180;
      badge.setAttribute('transform','translate('+labelX+' '+labelY+') rotate('+angle.toFixed(3)+')');
    }
    function render(){
      var root=null;try{root=frame.contentDocument;}catch(error){}
      if(!root)return false;
      var doc=visit(root,function(candidate){return candidate.getElementById('wheel')&&candidate.querySelector('.approved-cycle-number[data-cycle-offset]')?candidate:null;},0);
      if(!doc)return false;
      var wheel=doc.getElementById('wheel'),cell=locate(doc);if(!cell)return false;
      ensureGradient(doc,wheel);
      var badge=doc.getElementById('v416FibCell94')||create(doc,wheel);
      position(badge,cell);
      var master=doc.getElementById('v393FibonacciLabels');
      var visible=!master||master.style.display!=='none';
      badge.style.setProperty('display',visible?'inline':'none','important');
      badge.style.setProperty('visibility',visible?'visible':'hidden','important');
      badge.style.setProperty('opacity','1','important');
      if(badge.parentNode===wheel)wheel.appendChild(badge);
      doc.documentElement.dataset.v417Fibonacci94_43='fixed-cell-94-top-layer-visible-'+String(visible);
      doc.documentElement.dataset.v417FibonacciRatioCount='24';
      return true;
    }
    frame.addEventListener('load',render);
    var attempts=0;(function boot(){attempts+=1;if(!render()&&attempts<7200)setTimeout(boot,100);}());
    setInterval(function(){try{render();}catch(error){}},150);
    window.__auditV417=function(){return{ready:render(),addedRatio:'94.43%',fixedCell:94,totalRatioCount:24,
      independentSilverGradient:true,forcedTopLayer:true,silverStyleMatched:true,allV415FunctionsPreserved:true};};
  }());
  </script>
</body>
</html>
