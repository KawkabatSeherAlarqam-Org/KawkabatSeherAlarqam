<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — Value Runtime V5</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل Runtime القيمة…</div>
  <script>
  (async function(){
    'use strict';

    var sourceUrl='https://raw.githubusercontent.com/saloqbi/KawkabatSeherAlarqam/main/public/kawkabat-wheel-data-runtime-v4.html';

    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('DATA_V4_HTTP_'+response.status);
      var source=await response.text();

      source=source.replace('Data Type Runtime V4','Value Runtime V5');
      source=source.replace(/__auditKawkabatDataRuntimeV4/g,'__auditKawkabatValueRuntimeV5Base');

      var writeMarker="      document.open();\n      document.write(html);\n      document.close();";
      var valuePatch=`      var valueCloseTag='</scr'+'ipt>';
      var valueScript='<script id="kawkabat-value-runtime-v5">(function(){'+
        "'use strict';"+
        'var params=new URLSearchParams(String(location.hash||"").replace(/^#/,""));'+
        'var dataType=params.get("dataType")||"price";'+
        'var startValue=Number(params.get("value"));if(!Number.isFinite(startValue))startValue=0.01;'+
        'var incrementValue=Number(params.get("increment"));if(!Number.isFinite(incrementValue)||incrementValue===0)incrementValue=1;'+
        'function decimalPlaces(value){var text=String(value);if(/[eE]/.test(text)){var parts=text.toLowerCase().split("e"),base=(parts[0].split(".")[1]||"").length,exp=Number(parts[1]||0);return Math.max(0,base-exp);}return(text.split(".")[1]||"").length;}'+
        'var decimals=Math.min(8,Math.max(decimalPlaces(startValue),decimalPlaces(incrementValue)));'+
        'function formatPrice(value){var fixed=value.toFixed(decimals);return decimals?fixed.replace(/\\.?0+$/,""):fixed;}'+
        'function pad2(value){return String(value).padStart(2,"0");}'+
        'function dateLabel(offset){var date=new Date(Date.UTC(2019,11,31)+(offset*86400000));return pad2(date.getUTCDate())+"."+pad2(date.getUTCMonth()+1);}'+
        'function timeLabel(offset){return pad2(((offset%24)+24)%24)+":00";}'+
        'var count=0;'+
        'for(var cycle=1;cycle<=10;cycle+=1){var group=document.getElementById("numbersCycle"+cycle);if(!group)continue;Array.prototype.forEach.call(group.children,function(node){var raw=Number(node.getAttribute("data-value")||node.textContent),ordinal=Math.max(0,raw-1),priceText=formatPrice(startValue+(ordinal*incrementValue)),dateText=dateLabel(ordinal),timeText=timeLabel(ordinal);node.setAttribute("data-price-value",priceText);if(dataType==="price")node.textContent=priceText;else if(dataType==="date")node.textContent=dateText;else if(dataType==="time")node.textContent=timeText;else if(dataType==="priceDate")node.textContent=priceText+"·"+dateText;else if(dataType==="priceTime")node.textContent=priceText+"·"+timeText;var length=String(node.textContent).length;if(dataType==="date"||dataType==="time")node.style.setProperty("font-size","16px","important");else if(dataType==="priceDate"||dataType==="priceTime")node.style.setProperty("font-size",length>13?"11px":"13px","important");else node.style.setProperty("font-size",length>8?"16px":length>6?"19px":"24px","important");count+=1;});}'+
        'document.documentElement.dataset.startValue=String(startValue);document.documentElement.dataset.incrementValue=String(incrementValue);document.documentElement.dataset.dataType=dataType;'+
        'window.__auditKawkabatValueRuntimeV5=function(){return{ok:count>0,startValue:startValue,increment:incrementValue,dataType:dataType,numberCount:count};};'+
      '}());'+valueCloseTag;
      var bodyCloseIndex=html.lastIndexOf('</body>');
      if(bodyCloseIndex<0)throw new Error('VALUE_BODY_CLOSE_NOT_FOUND');
      html=html.slice(0,bodyCloseIndex)+valueScript+html.slice(bodyCloseIndex);
`;

      if(source.indexOf(writeMarker)<0)throw new Error('VALUE_WRITE_MARKER_NOT_FOUND');
      source=source.replace(writeMarker,valuePatch+writeMarker);

      document.open();
      document.write(source);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل Runtime القيمة: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
