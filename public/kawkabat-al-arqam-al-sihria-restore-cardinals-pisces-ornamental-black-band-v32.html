<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — V31 + Ornamental Black Band V32</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Magic Numbers Constellation" src="./kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-black-band-thicker-outward-v31.html"></iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var poll=null;
    var NS='http://www.w3.org/2000/svg';

    function locateWheelDocument(doc,depth){
      if(!doc||depth>44)return null;
      if(doc.getElementById('wheel'))return doc;
      var frames=doc.querySelectorAll('iframe');
      for(var i=0;i<frames.length;i+=1){
        try{
          var found=locateWheelDocument(frames[i].contentDocument,depth+1);
          if(found)return found;
        }catch(error){}
      }
      return null;
    }

    function polar(cx,cy,r,deg){
      var rad=(deg-90)*Math.PI/180;
      return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};
    }

    function createNode(type,attrs){
      var node=document.createElementNS(NS,type);
      Object.keys(attrs||{}).forEach(function(key){node.setAttribute(key,attrs[key]);});
      return node;
    }

    function addPath(group,d,stroke,width,fill){
      group.appendChild(createNode('path',{
        d:d,
        fill:fill||'none',
        stroke:stroke,
        'stroke-width':width,
        'stroke-linecap':'round',
        'stroke-linejoin':'round',
        'vector-effect':'non-scaling-stroke'
      }));
    }

    function createMotif(cx,cy,r,angle,size){
      var point=polar(cx,cy,r,angle);
      var group=createNode('g',{
        transform:'translate('+point.x.toFixed(3)+' '+point.y.toFixed(3)+') rotate('+angle.toFixed(3)+')',
        'pointer-events':'none',
        class:'v32-motif'
      });

      var gold='url(#ornateGold)';
      var shadow='#57320D';
      var w=Math.max(2.2,size*0.075);
      var left='M '+(-2.05*size).toFixed(3)+' 0 C '+(-1.65*size).toFixed(3)+' '+(-0.70*size).toFixed(3)+', '+(-0.60*size).toFixed(3)+' '+(-0.68*size).toFixed(3)+', 0 0';
      var right='M 0 0 C '+(0.60*size).toFixed(3)+' '+(-0.68*size).toFixed(3)+', '+(1.65*size).toFixed(3)+' '+(-0.70*size).toFixed(3)+', '+(2.05*size).toFixed(3)+' 0';

      addPath(group,left,shadow,w+2);
      addPath(group,right,shadow,w+2);
      addPath(group,left,gold,w);
      addPath(group,right,gold,w);

      addPath(group,'M '+(-2.05*size).toFixed(3)+' 0 C '+(-2.25*size).toFixed(3)+' '+(-0.10*size).toFixed(3)+', '+(-2.24*size).toFixed(3)+' '+(-0.52*size).toFixed(3)+', '+(-1.88*size).toFixed(3)+' '+(-0.58*size).toFixed(3),gold,Math.max(1.7,size*0.055));
      addPath(group,'M '+(2.05*size).toFixed(3)+' 0 C '+(2.25*size).toFixed(3)+' '+(-0.10*size).toFixed(3)+', '+(2.24*size).toFixed(3)+' '+(-0.52*size).toFixed(3)+', '+(1.88*size).toFixed(3)+' '+(-0.58*size).toFixed(3),gold,Math.max(1.7,size*0.055));

      var fleur=createNode('g',{transform:'translate(0 '+(-0.04*size).toFixed(3)+')'});
      addPath(fleur,'M 0 '+(0.68*size).toFixed(3)+' C '+(-0.20*size).toFixed(3)+' '+(0.30*size).toFixed(3)+', '+(-0.17*size).toFixed(3)+' '+(-0.18*size).toFixed(3)+', 0 '+(-0.74*size).toFixed(3)+' C '+(0.17*size).toFixed(3)+' '+(-0.18*size).toFixed(3)+', '+(0.20*size).toFixed(3)+' '+(0.30*size).toFixed(3)+', 0 '+(0.68*size).toFixed(3)+' Z',shadow,Math.max(1.8,size*0.05),shadow);
      addPath(fleur,'M 0 '+(0.60*size).toFixed(3)+' C '+(-0.16*size).toFixed(3)+' '+(0.24*size).toFixed(3)+', '+(-0.13*size).toFixed(3)+' '+(-0.14*size).toFixed(3)+', 0 '+(-0.64*size).toFixed(3)+' C '+(0.13*size).toFixed(3)+' '+(-0.14*size).toFixed(3)+', '+(0.16*size).toFixed(3)+' '+(0.24*size).toFixed(3)+', 0 '+(0.60*size).toFixed(3)+' Z',gold,Math.max(1.4,size*0.038),gold);
      addPath(fleur,'M 0 '+(-0.02*size).toFixed(3)+' C '+(-0.42*size).toFixed(3)+' '+(-0.12*size).toFixed(3)+', '+(-0.60*size).toFixed(3)+' '+(0.10*size).toFixed(3)+', '+(-0.54*size).toFixed(3)+' '+(0.34*size).toFixed(3)+' C '+(-0.27*size).toFixed(3)+' '+(0.20*size).toFixed(3)+', '+(-0.14*size).toFixed(3)+' '+(0.10*size).toFixed(3)+', 0 '+(-0.02*size).toFixed(3)+' C '+(0.14*size).toFixed(3)+' '+(0.10*size).toFixed(3)+', '+(0.27*size).toFixed(3)+' '+(0.20*size).toFixed(3)+', '+(0.54*size).toFixed(3)+' '+(0.34*size).toFixed(3)+' C '+(0.60*size).toFixed(3)+' '+(0.10*size).toFixed(3)+', '+(0.42*size).toFixed(3)+' '+(-0.12*size).toFixed(3)+', 0 '+(-0.02*size).toFixed(3)+' Z',gold,Math.max(1.4,size*0.038),gold);
      group.appendChild(fleur);
      return group;
    }

    function applyOrnamentalBlackBand(){
      try{
        var wheelDoc=locateWheelDocument(appFrame.contentDocument,0);
        if(!wheelDoc)return false;
        var svg=wheelDoc.getElementById('wheel');
        var outerFrame=wheelDoc.getElementById('outerBlackFrame');
        if(!svg||!outerFrame)return false;

        var blackBand=outerFrame.querySelector('.outer-black-band');
        if(!blackBand)return false;

        var old=wheelDoc.getElementById('v32OrnamentalBand');
        if(old)old.remove();

        var vb=(svg.getAttribute('viewBox')||'0 0 4400 3600').split(/\s+/).map(Number);
        var cx=(vb[0]||0)+(vb[2]||4400)/2;
        var cy=(vb[1]||0)+(vb[3]||3600)/2;
        var radius=Number(blackBand.getAttribute('r'));
        var bandWidth=Number.parseFloat(wheelDoc.defaultView.getComputedStyle(blackBand).getPropertyValue('stroke-width'));
        if(!Number.isFinite(radius)||!Number.isFinite(bandWidth))return false;

        var ornamentRadius=radius;
        var ornamentSize=Math.max(12,Math.min(22,bandWidth*0.22));
        var motifCount=48;
        var group=createNode('g',{id:'v32OrnamentalBand','pointer-events':'none'});

        for(var index=0;index<motifCount;index+=1){
          group.appendChild(createMotif(cx,cy,ornamentRadius,index*(360/motifCount),ornamentSize));
        }

        var blackBandNext=blackBand.nextSibling;
        outerFrame.insertBefore(group,blackBandNext);

        wheelDoc.documentElement.dataset.ornamentalBlackBandV32='true';
        wheelDoc.documentElement.dataset.ornamentalMotifCount=String(motifCount);
        wheelDoc.documentElement.dataset.ornamentalOtherGeometryChanged='false';

        wheelDoc.defaultView.__auditKawkabatOrnamentalBlackBandV32=function(){
          return{
            ok:group.children.length===motifCount,
            changedArea:'ornament-inside-black-band-only',
            motifCount:motifCount,
            blackBandRadius:radius,
            blackBandWidth:bandWidth,
            outerFramesChanged:false,
            angleBandChanged:false,
            angleNumbersChanged:false,
            angleTicksChanged:false,
            zodiacChanged:false,
            wheelNumbersChanged:false,
            innerWheelGeometryChanged:false
          };
        };
        return group.children.length===motifCount;
      }catch(error){
        return false;
      }
    }

    function startPolling(){
      if(poll)clearInterval(poll);
      var attempts=0;
      poll=setInterval(function(){
        attempts+=1;
        if(applyOrnamentalBlackBand()||attempts>=1400){
          clearInterval(poll);
          poll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
