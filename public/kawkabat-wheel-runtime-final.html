    var text=make('text',{x:p.x,y:p.y,'class':'outer-text-label '+className+' '+colorClass(cellValue),transform:'rotate('+rotation+' '+p.x+' '+p.y+')',lang:'ar','data-cell':cellValue});text.textContent=textValue;group.appendChild(text);

  for(var innerIndex=0;innerIndex<divisionCount;innerIndex+=1){var full=innerIndex===0?divisionCount:innerIndex,root=((full-1)%9)+1;addInnerNumber(ringOne,full,innerIndex,235,'ring-one-number');addInnerNumber(ringTwo,root,innerIndex,345,'ring-two-number');}

  var dragging=false,moved=false,startX=0,startY=0,startLeft=0,startTop=0,suppressClickUntil=0;
